  function TravelAddModal({ visit, onSave, onDelete, onClose }) {
    const isEdit = !!visit;
    // Normalise legacy single-string city → cities array
    function normVisit(v) {
      if (!v) return { country:'', cities:[], date:'', notes:'', livedIn:false };
      const cities = Array.isArray(v.cities) ? v.cities
        : v.city ? v.city.split(',').map(s=>s.trim()).filter(Boolean) : [];
      return { country:'', date:'', notes:'', livedIn:false, ...v, cities };
    }
    const [f, setF] = React.useState(() => normVisit(visit));
    const set = (k,v) => setF(p => ({ ...p, [k]:v }));

    // ── Searchable country dropdown ──────────────────────────────
    const allCountries = React.useMemo(() => Object.values(COUNTRY_ISO_MAP).sort(), []);
    const [ctryQuery, setCtryQuery] = React.useState(f.country || '');
    const [ctryOpen, setCtryOpen] = React.useState(false);
    const ctryRef = React.useRef(null);

    // Sync query when country is set externally (e.g. initial edit value)
    React.useEffect(() => { setCtryQuery(f.country || ''); }, []);

    const filteredCountries = React.useMemo(() => {
      const q = ctryQuery.trim().toLowerCase();
      if (!q) return allCountries;
      return allCountries.filter(c => c.toLowerCase().includes(q));
    }, [ctryQuery, allCountries]);

    // Close dropdown on outside click
    React.useEffect(() => {
      function handler(e) { if (ctryRef.current && !ctryRef.current.contains(e.target)) setCtryOpen(false); }
      document.addEventListener('mousedown', handler);
      return () => document.removeEventListener('mousedown', handler);
    }, []);

    function selectCountry(c) {
      set('country', c);
      setCtryQuery(c);
      setCtryOpen(false);
    }

    // ── Multi-city tag input ─────────────────────────────────────
    const [cityInput, setCityInput] = React.useState('');
    const cityInputRef = React.useRef(null);

    function addCity() {
      const trimmed = cityInput.trim();
      if (!trimmed) return;
      if (!f.cities.includes(trimmed)) set('cities', [...f.cities, trimmed]);
      setCityInput('');
    }

    function removeCity(c) { set('cities', f.cities.filter(x => x !== c)); }

    function handleCityKey(e) {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addCity(); }
      if (e.key === 'Backspace' && !cityInput && f.cities.length > 0) {
        set('cities', f.cities.slice(0, -1));
      }
    }

    return (
      <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-hdr">
            <div className="modal-title">{isEdit ? 'Edit Visit' : 'Add Visit'}</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div className="form-grid">

            {/* Searchable country */}
            <div className="fg" ref={ctryRef}>
              <label>Country</label>
              <div className="ctry-search-wrap">
                <input
                  className="ctry-search-input"
                  type="text"
                  placeholder="Type to search…"
                  value={ctryQuery}
                  onChange={e => { setCtryQuery(e.target.value); setCtryOpen(true); if (!e.target.value) set('country',''); }}
                  onFocus={() => setCtryOpen(true)}
                  autoComplete="off"
                />
                {ctryOpen && filteredCountries.length > 0 && (
                  <div className="ctry-dropdown">
                    {filteredCountries.map(c => (
                      <div
                        key={c}
                        className={`ctry-option${f.country===c?' selected':''}`}
                        onMouseDown={e => { e.preventDefault(); selectCountry(c); }}
                      >
                        <span>{COUNTRY_FLAGS[c]||'🌍'}</span>
                        <span>{c}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div className="lived-in-row" style={{marginTop:8}}>
                <input type="checkbox" id="livedIn" checked={!!f.livedIn} onChange={e => set('livedIn', e.target.checked)} />
                <label htmlFor="livedIn">Lived here</label>
              </div>
            </div>

            {/* Multi-city tag input */}
            <div className="fg">
              <label>Cities / Regions <span style={{fontSize:11,color:'var(--text3)',fontWeight:400}}>(Enter or comma to add)</span></label>
              <div className="city-tags-wrap" onClick={() => cityInputRef.current && cityInputRef.current.focus()}>
                {f.cities.map(c => (
                  <span key={c} className="city-tag">
                    {c}
                    <button className="city-tag-remove" onClick={e => { e.stopPropagation(); removeCity(c); }}>×</button>
                  </span>
                ))}
                <input
                  ref={cityInputRef}
                  className="city-tag-input"
                  type="text"
                  placeholder={f.cities.length ? '' : 'e.g. Tokyo…'}
                  value={cityInput}
                  onChange={e => setCityInput(e.target.value)}
                  onKeyDown={handleCityKey}
                  onBlur={addCity}
                />
              </div>
            </div>

            <div className="fg">
              <label>Year</label>
              <input type="number" min="1950" max={new Date().getFullYear()} placeholder={String(new Date().getFullYear())} value={f.date ? f.date.slice(0,4) : ''} onChange={e => set('date', e.target.value)} style={{width:'100%'}} />
            </div>
            <div className="fg full">
              <label>Notes</label>
              <textarea placeholder="Highlights, memories, recommendations…" value={f.notes} onChange={e => set('notes', e.target.value)} rows={3} />
            </div>
          </div>
          <div className="modal-footer">
            <div>{isEdit && <button className="btn-del" onClick={() => { onDelete(visit.id); onClose(); }}>Delete</button>}</div>
            <div className="modal-actions">
              <button className="btn-cancel" onClick={onClose}>Cancel</button>
              <button className="btn-save" disabled={!f.country.trim()} onClick={() => {
                // flush any pending city input before saving
                const pendingCity = cityInput.trim();
                const finalCities = pendingCity && !f.cities.includes(pendingCity) ? [...f.cities, pendingCity] : f.cities;
                onSave({ ...f, cities: finalCities, id: f.id || uid() });
                onClose();
              }}>{isEdit ? 'Save' : 'Add Visit'}</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ── BUDGET ──────────────────────────────────────────────────── */
  function BudgetSettingsModal({ budgetData, onSave, onClose }) {
    const [gross, setGross]       = React.useState(String(budgetData.grossAnnual || ''));
    const [hasHELP, setHasHELP]   = React.useState(!!budgetData.hasHELP);
    const [superRate, setSuperRate] = React.useState(String(budgetData.superRate ?? 12));
    const [tmpl, setTmpl]         = React.useState({ ...budgetData.template });
    const setT = (k, v) => setTmpl(t => ({ ...t, [k]: parseFloat(v) || 0 }));

    const grossAnnual = parseFloat(gross) || 0;
    const tax = calcAusTax(grossAnnual, hasHELP);
    const sr = parseFloat(superRate) || 12;
    const superMonthly = Math.round(grossAnnual * sr / 100 / 12);
    const netMonthly = tax.netMonthly;

    const totalBudgeted = BUDGET_CATS.reduce((s, c) => s + (tmpl[c.id] || 0), 0);
    const unalloc = netMonthly - totalBudgeted;

    // Live tax breakdown rows
    const rows = [
      { label:'Gross salary',       val:`$${grossAnnual.toLocaleString()}`,                  color:'var(--text)',  annual:true },
      { label:'PAYG withholding',   val:`($${tax.incomeTax.toLocaleString()})`,               color:'#e05252',     annual:true },
      hasHELP && tax.helpRepayment > 0
        ? { label:'HELP repayment', val:`($${tax.helpRepayment.toLocaleString()})`,           color:'#e05252',     annual:true } : null,
      { label:'Net annual',         val:`$${tax.netAnnual.toLocaleString()}`,                 color:'#4aac76',     annual:true, bold:true },
      { label:'Net monthly (take-home)', val:`$${netMonthly.toLocaleString()}`,               color:'#4aac76',     bold:true },
      { label:`Employer super (${sr}%)`, val:`$${superMonthly.toLocaleString()}/mo`,          color:'#5b96e8' },
      { label:`Effective tax rate`, val:`${tax.effectivePct}%`,                               color:'var(--text2)' },
    ].filter(Boolean);

    return (
      <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal" style={{ maxWidth:520 }}>
          <div className="modal-hdr">
            <div className="modal-title">Salary &amp; Budget Setup</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div className="form-grid">
            {/* Salary inputs */}
            <div className="fg">
              <label>Gross Annual Salary ($)</label>
              <input type="number" value={gross} onChange={e => setGross(e.target.value)} autoFocus placeholder="e.g. 79668" />
            </div>
            <div className="fg">
              <label>Employer Super Rate (%)</label>
              <input type="number" value={superRate} onChange={e => setSuperRate(e.target.value)} step="0.5" />
            </div>
            <div className="fg full">
              <div className="lived-in-row">
                <input type="checkbox" id="helpChk" checked={hasHELP} onChange={e => setHasHELP(e.target.checked)} />
                <label htmlFor="helpChk">I have a HELP / HECS debt</label>
              </div>
            </div>

            {/* Live tax breakdown */}
            {grossAnnual > 0 && (
              <div className="fg full" style={{ background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:10, padding:'12px 14px', display:'flex', flexDirection:'column', gap:6 }}>
                <div style={{ fontSize:11, fontWeight:800, color:'var(--text3)', textTransform:'uppercase', letterSpacing:'.5px', marginBottom:4 }}>Tax Breakdown (FY2025-26 estimate)</div>
                {rows.map((r,i) => (
                  <div key={i} style={{ display:'flex', justifyContent:'space-between', fontSize:13, fontWeight: r.bold ? 700 : 400, color: r.color, borderTop: r.bold ? '1px solid var(--border)' : 'none', paddingTop: r.bold ? 6 : 0, marginTop: r.bold ? 2 : 0 }}>
                    <span>{r.label}</span><span>{r.val}</span>
                  </div>
                ))}
              </div>
            )}

            {/* Budget template */}
            <div className="fg full" style={{ fontSize:12, fontWeight:700, color:'var(--text2)', textTransform:'uppercase', letterSpacing:'.5px', marginTop:4 }}>Monthly Budget Defaults</div>
            {BUDGET_CATS.map(cat => (
              <div key={cat.id} className="fg">
                <label>
                  <Icon name={ICON_BY_EMOJI[cat.icon]||'dot'} size={15} /> {cat.label}
                  {cat.splitHalf && cat.id==='electricity' && <span style={{ fontWeight:400, color:'var(--text3)', fontSize:11 }}> — your ½</span>}
                  {cat.splitHalf && !cat.quarterly && <span style={{ fontWeight:400, color:'var(--text3)', fontSize:11 }}> — your ½</span>}
                </label>
                <input type="number" value={tmpl[cat.id] || 0} onChange={e => setT(cat.id, e.target.value)} placeholder="0" />
              </div>
            ))}
            {netMonthly > 0 && (
              <div className="fg full" style={{ fontSize:12, color: unalloc < 0 ? '#e05252' : 'var(--text2)', marginTop:2 }}>
                Budgeted ${totalBudgeted.toLocaleString()} of ${netMonthly.toLocaleString()} take-home —{' '}
                <strong style={{ color: unalloc < 0 ? '#e05252' : '#4aac76' }}>${Math.abs(unalloc).toLocaleString()} {unalloc < 0 ? 'over' : 'unallocated'}</strong>
              </div>
            )}
          </div>
          <div className="modal-footer">
            <div />
            <div className="modal-actions">
              <button className="btn-cancel" onClick={onClose}>Cancel</button>
              <button className="btn-save" onClick={() => onSave({ grossAnnual: parseFloat(gross)||0, hasHELP, superRate: sr, template: tmpl })}>Save</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function EditableAmt({ value, onSave, cls, locked }) {
    const [editing, setEditing] = React.useState(false);
    const [draft, setDraft] = React.useState('');
    function commit() { onSave(parseFloat(draft) || 0); setEditing(false); }
    if (locked) return <span className="budget-amt-btn dim" style={{ cursor:'default', display:'block', textAlign:'right' }}>—</span>;
    if (editing) return (
      <input
        type="number" min="0"
        className="budget-amt-input"
        value={draft}
        autoFocus
        onChange={e => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setEditing(false); }}
      />
    );
    return (
      <button
        className={`budget-amt-btn${cls ? ' '+cls : ''}`}
        onClick={() => { setDraft(String(value)); setEditing(true); }}
      >
        ${value.toLocaleString()}
      </button>
    );
  }

  function SavingsLineChart({ data }) {
    if (!data || data.length < 2 || data.every(d => d.cum === 0)) {
      return <div style={{height:52,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:12}}>No data yet</div>;
    }
    const maxV = Math.max(...data.map(d => d.cum), 1);
    const W = 200, H = 52;
    const pts = data.map((d, i) => [
      (i / (data.length - 1)) * W,
      H - (d.cum / maxV) * H * 0.86 - 2
    ]);
    const linePath = pts.map(([x,y], i) => `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const areaPath = `M${pts[0][0]},${H} ${pts.map(([x,y])=>`L${x.toFixed(1)},${y.toFixed(1)}`).join(' ')} L${pts[pts.length-1][0]},${H} Z`;
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:52,display:'block'}} preserveAspectRatio="none">
        <defs>
          <linearGradient id="sgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#4aac76" stopOpacity="0.28"/>
            <stop offset="100%" stopColor="#4aac76" stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={areaPath} fill="url(#sgGrad)"/>
        <path d={linePath} fill="none" stroke="#4aac76" strokeWidth="1.5" vectorEffect="non-scaling-stroke"/>
        <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.5" fill="#4aac76" vectorEffect="non-scaling-stroke"/>
      </svg>
    );
  }

  function MonthBarsChart({ months, budgetData, netMonthly }) {
    const STACKS = [
      { ids:['rent','wifi','electricity','phone'], color:'#5c6bc0' },
      { ids:['investments'], color:'#5b96e8' },
      { ids:['groceries','purchases'], color:'#9070d8' },
      { ids:['savings'], color:'#4aac76' },
    ];
    const ref = netMonthly || 1;
    return (
      <div style={{display:'flex',gap:3,alignItems:'flex-end',height:56}}>
        {months.map(ym => {
          const cats = getMonthData(budgetData, ym).categories;
          const segments = STACKS.map(s => ({ color:s.color, val:s.ids.reduce((sum,id)=>sum+(cats[id]?.actual||0),0) })).filter(s=>s.val>0);
          const total = segments.reduce((s,seg)=>s+seg.val,0);
          const barH = Math.min(Math.round((total/ref)*46),46);
          return (
            <div key={ym} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,minWidth:0}}>
              <div style={{width:'100%',display:'flex',flexDirection:'column-reverse',height:46,overflow:'hidden',borderRadius:3}}>
                {barH > 0 ? segments.map((seg,i)=>{
                  const h = Math.max(1,Math.round((seg.val/total)*barH));
                  return <div key={i} style={{width:'100%',height:h,background:seg.color,opacity:.8}}/>;
                }) : <div style={{width:'100%',height:2,background:'var(--border)',borderRadius:3}}/>}
              </div>
              <div style={{fontSize:9,color:'var(--text3)'}}>{new Date(ym+'-15').toLocaleDateString('en-AU',{month:'short'}).slice(0,3)}</div>
            </div>
          );
        })}
      </div>
    );
  }

  function BudgetTableCell({ value, budget, over, onSave }) {
    const [editing, setEditing] = React.useState(false);
    const [draft, setDraft] = React.useState('');
    function commit() { onSave(parseFloat(draft)||0); setEditing(false); }
    if (editing) return (
      <input className="bmt-cell-input" type="number" value={draft} autoFocus
        onChange={e=>setDraft(e.target.value)} onBlur={commit}
        onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape')setEditing(false);}}
      />
    );
    return (
      <button className={`bmt-cell-btn${over?' over':value===0?' zero':''}`}
        onClick={()=>{setDraft(String(value));setEditing(true);}}>
        {value > 0 ? `$${value.toLocaleString()}` : '—'}
      </button>
    );
  }

  function BudgetView({ budgetData, onUpdate }) {
    const todayYM = localDateStr(new Date()).slice(0, 7);
    const [focusYM, setFocusYM] = React.useState(todayYM);
    const [settingsOpen, setSettingsOpen] = React.useState(false);

    const tax        = calcAusTax(budgetData.grossAnnual || 0, budgetData.hasHELP);
    const sr         = budgetData.superRate ?? 12;
    const netMonthly = tax.netMonthly;
    const superMo    = Math.round((budgetData.grossAnnual || 0) * sr / 100 / 12);

    const recentMonths = React.useMemo(() => buildRecentMonths(12), []);
    const tableMos     = recentMonths.slice(-6);

    function updateCatForYM(catId, entry, targetYM) {
      onUpdate(d => {
        const existing = getMonthData(d, targetYM);
        return { ...d, months: { ...d.months, [targetYM]: { ...existing, categories: { ...existing.categories, [catId]: entry } } } };
      });
    }
    function shiftMonth(delta) {
      const [y, mo] = focusYM.split('-').map(Number);
      const d = new Date(y, mo - 1 + delta, 1);
      setFocusYM(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    }

    const focusCats  = getMonthData(budgetData, focusYM).categories;
    const needsSetup = !budgetData.grossAnnual;
    const focusLabel = new Date(focusYM+'-15').toLocaleDateString('en-AU',{month:'long',year:'numeric'});

    // Waterfall groups: salary → fixed → investments → spending → savings
    const WFALL_GROUPS = [
      { label:'Fixed Costs',   ids:['rent','wifi','electricity','phone'], subtotal:'After bills' },
      { label:'Investments',   ids:['investments'],                       subtotal:'For spending' },
      { label:'Daily Spending',ids:['groceries','purchases'],             subtotal:'Before savings' },
      { label:'Savings',       ids:['savings'],                           subtotal:'Leftover' },
    ];
    let wfRem = netMonthly;
    const wfGroups = WFALL_GROUPS.map((g, gi) => {
      const cats = g.ids.map(id => BUDGET_CATS.find(c=>c.id===id)).filter(Boolean);
      const total = cats.reduce((s,c)=>s+(focusCats[c.id]?.actual||0), 0);
      wfRem -= total;
      return { ...g, cats, total, remaining: wfRem };
    });
    const totalActual   = BUDGET_CATS.reduce((s,c)=>s+(focusCats[c.id]?.actual||0),0);
    const finalLeftover = netMonthly - totalActual;

    // Cumulative savings chart data (sum of savings.actual over 12 months)
    const cumData = React.useMemo(() => {
      let cum = 0;
      return recentMonths.map(ym => {
        const cats = getMonthData(budgetData, ym).categories;
        cum += (cats.savings?.actual || 0);
        return { ym, cum };
      });
    }, [budgetData, recentMonths]);

    if (needsSetup) return (
      <div className="budget-wrap">
        <div className="budget-empty">
          <div className="budget-empty-icon"><Icon name="wallet" size={40} /></div>
          <div className="budget-empty-ttl">Set up your budget</div>
          <div className="budget-empty-sub">Enter your gross salary — we'll calculate tax, take-home pay and super automatically.</div>
          <button className="btn-save" style={{padding:'10px 28px',fontSize:14}} onClick={()=>setSettingsOpen(true)}>Get Started</button>
        </div>
        {settingsOpen && <BudgetSettingsModal budgetData={budgetData} onSave={u=>{onUpdate(d=>({...d,...u}));setSettingsOpen(false);}} onClose={()=>setSettingsOpen(false)}/>}
      </div>
    );

    return (
      <div className="budget-wrap">
        {/* Header */}
        <div className="bw-topbar">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <button className="budget-arrow" onClick={()=>shiftMonth(-1)}>‹</button>
            <span className="budget-month-label">{focusLabel}</span>
            <button className="budget-arrow" onClick={()=>shiftMonth(1)}>›</button>
          </div>
          <button className="budget-setup-btn" onClick={()=>setSettingsOpen(true)}>⚙ Setup</button>
        </div>

        {/* 2-col: waterfall + right panel */}
        <div className="bw-main">
          {/* Waterfall */}
          <div className="wf-card">
            <div className="wf-income-bar">
              <span className="wf-income-label">Take-home pay</span>
              <span className="wf-income-val">${netMonthly.toLocaleString()}<span style={{fontSize:13,fontWeight:500,color:'var(--text3)'}}>/mo</span></span>
            </div>

            {wfGroups.map((g, gi) => (
              <React.Fragment key={g.label}>
                <div className="wf-group-label">{g.label}</div>
                {g.cats.map(cat => {
                  const entry = focusCats[cat.id] || {budget:0,actual:0};
                  const pct   = entry.budget > 0 ? Math.min(entry.actual/entry.budget,1) : entry.actual > 0 ? 1 : 0;
                  const over  = entry.actual > entry.budget && entry.budget > 0;
                  const barC  = over ? '#e05252' : pct > 0.8 ? '#c98a10' : cat.color;
                  return (
                    <div key={cat.id} className="wf-row">
                      <div style={{display:'flex',alignItems:'center',gap:5,overflow:'hidden'}}>
                        <Icon name={ICON_BY_EMOJI[cat.icon]||'dot'} size={16} />
                        <span style={{fontSize:13,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{cat.label}</span>
                        {cat.splitHalf && <span className="budget-badge">½</span>}
                      </div>
                      <div className="wf-bar-track"><div className="wf-bar-fill" style={{width:`${pct*100}%`,background:barC}}/></div>
                      <div style={{textAlign:'right',fontSize:11,color:'var(--text3)'}}>
                        {entry.budget>0?`$${entry.budget.toLocaleString()}`:'—'}
                      </div>
                      <EditableAmt value={entry.actual} onSave={v=>updateCatForYM(cat.id,{...entry,actual:v},focusYM)} cls={over?'over':''}/>
                    </div>
                  );
                })}
                <div className="wf-subtotal">
                  <span className="wf-subtotal-label">{g.subtotal}</span>
                  <span className="wf-subtotal-val" style={{color:g.remaining<0?'#e05252':gi===wfGroups.length-1?'#4aac76':'var(--text)'}}>
                    ${Math.max(0,g.remaining).toLocaleString()}
                  </span>
                </div>
              </React.Fragment>
            ))}

            {Math.abs(finalLeftover) > 1 && (
              <div className="wf-leftover">
                <span>Untracked this month</span>
                <span style={{color:finalLeftover<0?'#e05252':'var(--text3)'}}>
                  {finalLeftover>0?'+':'-'}${Math.abs(finalLeftover).toLocaleString()}
                </span>
              </div>
            )}
          </div>

          {/* Right panel */}
          <div className="bw-right">
            {/* Salary breakdown */}
            <div className="bw-chart-card">
              <div className="bw-chart-title">Salary</div>
              {[
                {label:'Gross',   val:`$${Math.round((budgetData.grossAnnual||0)/12).toLocaleString()}/mo`, color:'var(--text)'},
                {label:'PAYG Tax',val:`-$${Math.round(tax.incomeTax/12).toLocaleString()}`,               color:'#e05252'},
                budgetData.hasHELP&&tax.helpRepayment>0 ? {label:'HELP',val:`-$${Math.round(tax.helpRepayment/12).toLocaleString()}`,color:'#e05252'} : null,
                {label:'Take-home',val:`$${netMonthly.toLocaleString()}/mo`,color:'#4aac76',bold:true},
                {label:`Super (${sr}%)`,val:`+$${superMo.toLocaleString()}`,color:'#5b96e8'},
              ].filter(Boolean).map(row => (
                <div key={row.label} className="bw-sal-row">
                  <span style={{color:'var(--text2)',fontSize:13}}>{row.label}</span>
                  <span style={{color:row.color,fontWeight:row.bold?800:600,fontSize:row.bold?15:13}}>{row.val}</span>
                </div>
              ))}
            </div>

            {/* Cumulative savings chart */}
            <div className="bw-chart-card">
              <div className="bw-chart-title">Cumulative Savings (12mo)</div>
              <SavingsLineChart data={cumData}/>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:6,fontSize:12}}>
                <span style={{color:'var(--text3)'}}>{new Date(recentMonths[0]+'-15').toLocaleDateString('en-AU',{month:'short',year:'2-digit'})}</span>
                <span style={{color:'#4aac76',fontWeight:700}}>${(cumData.at(-1)?.cum||0).toLocaleString()}</span>
              </div>
            </div>

            {/* Monthly spending bars */}
            <div className="bw-chart-card">
              <div className="bw-chart-title">Monthly Spending (6mo)</div>
              <MonthBarsChart months={tableMos} budgetData={budgetData} netMonthly={netMonthly}/>
              <div style={{display:'flex',gap:10,marginTop:8,flexWrap:'wrap'}}>
                {[{label:'Fixed',color:'#5c6bc0'},{label:'Invest',color:'#5b96e8'},{label:'Spend',color:'#9070d8'},{label:'Savings',color:'#4aac76'}].map(l=>(
                  <div key={l.label} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'var(--text3)'}}>
                    <div style={{width:8,height:8,borderRadius:2,background:l.color,opacity:.8}}/>
                    {l.label}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* Multi-month table */}
        <div className="bmt">
          <div className="bmt-section-title">Month by Month — click a month to focus the waterfall</div>
          <div style={{overflowX:'auto'}}>
            <table>
              <thead>
                <tr>
                  <th style={{textAlign:'left',padding:'7px 16px'}}>Category</th>
                  {tableMos.map(m => (
                    <th key={m} className={m===focusYM?'bmt-focus':''} onClick={()=>setFocusYM(m)}
                      style={{padding:'7px 12px',minWidth:78}}>
                      {new Date(m+'-15').toLocaleDateString('en-AU',{month:'short',year:'2-digit'})}
                      {m===todayYM?' ◆':''}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {BUDGET_CATS.map(cat => (
                  <tr key={cat.id}>
                    <td style={{padding:'5px 16px'}}>
                      <Icon name={ICON_BY_EMOJI[cat.icon]||'dot'} size={15} /> {cat.label}
                      {cat.splitHalf && <span className="budget-badge">½</span>}
                    </td>
                    {tableMos.map(m => {
                      const md    = getMonthData(budgetData, m);
                      const entry = md.categories[cat.id] || {budget:0,actual:0};
                      const over  = entry.actual > entry.budget && entry.budget > 0;
                      return (
                        <td key={m} className={m===focusYM?'bmt-focus':''} style={{padding:'3px 8px'}}>

  /* ── GITHUB SYNC (data lives in a private repo; token stays on each device) ───────────── */
  const GH_KEY = 'sidd_gh_sync_v1';
  function ghLoadCfg() { try { return JSON.parse(localStorage.getItem(GH_KEY) || 'null'); } catch { return null; } }
  function ghSaveCfg(c) { try { c ? localStorage.setItem(GH_KEY, JSON.stringify(c)) : localStorage.removeItem(GH_KEY); } catch {} }
  function hashStr(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36) + '-' + str.length;
  }
  function b64enc(str) {
    const bytes = new TextEncoder().encode(str); let bin = ''; const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin);
  }
  function b64dec(b64) { const bin = atob(b64.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
  function ghApi(cfg, url, opts = {}) {
    return fetch(`https://api.github.com/repos/${cfg.repo}${url}`, {
      ...opts, cache: 'no-store',
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) },
    });
  }
  const ghFilePath = cfg => '/contents/' + (cfg.path || 'data.json').split('/').map(encodeURIComponent).join('/');
  async function ghCheckRepo(cfg) {
    const r = await ghApi(cfg, '');
    if (r.status === 401) throw new Error('GitHub rejected the token (401). Check it was copied in full and has not expired.');
    if (r.status === 404) throw new Error('Repo not found, or the token cannot see it. Check the name (owner/repo) and that the token has access to that repo.');
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    const j = await r.json();
    if (j.permissions && !j.permissions.push) throw new Error('The token can read this repo but not write to it. Give it Contents: Read and write.');
    if (!j.private && !window.confirm('This repository is PUBLIC, so your data would be visible to anyone. Continue anyway?')) throw new Error('Cancelled: choose a private repository for your data.');
    return j;
  }
  async function ghPull(cfg) {
    const ref = '?ref=' + encodeURIComponent(cfg.branch || 'main');
    const r = await ghApi(cfg, ghFilePath(cfg) + ref);
    if (r.status === 404) return { missing: true };
    if (r.status === 401 || r.status === 403) throw new Error('auth');
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    const j = await r.json();
    let text;
    if (j.content && j.encoding === 'base64') text = b64dec(j.content);
    else {
      const r2 = await ghApi(cfg, ghFilePath(cfg) + ref, { headers: { Accept: 'application/vnd.github.raw+json' } });
      if (!r2.ok) throw new Error('GitHub error ' + r2.status);
      text = await r2.text();
    }
    return { sha: j.sha, data: JSON.parse(text) };
  }
  async function ghPush(cfg, sha, data, message) {
    const body = { message, content: b64enc(JSON.stringify(data)), branch: cfg.branch || 'main' };
    if (sha) body.sha = sha;
    const r = await ghApi(cfg, ghFilePath(cfg), { method: 'PUT', body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) return { conflict: true };
    if (r.status === 401 || r.status === 403) throw new Error('auth');
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    const j = await r.json();
    return { sha: j.content.sha };
  }

  /* ── APP ─────────────────────────────────────────────────────── */
  function App() {
    const DEFAULT_S = { theme:'dark', workCats:[...DEFAULT_WORK_CATS], persCats:[...DEFAULT_PERS_CATS], staleThresholdDays:7, accentColor:'#6470f5', darkBg:'#000000', fontId:'system' };

      return { tasks:makeSamples(), settings:DEFAULT_S, uniData:makeDefaultUniData(), movieData:makeDefaultMovieData(), tvData:makeDefaultTVData(), travelData:makeDefaultTravelData(), budgetData:makeDefaultBudgetData(), timeBlocks:[] };

    const [ghMsg,     setGhMsg]     = useState('');
    const [ghLast,    setGhLast]    = useState(null);
    const ghCfgRef  = useRef(gh);
    const ghShaRef  = useRef(localStorage.getItem(GH_KEY + '_sha')  || null);

    const ghBusy    = useRef(false);
    const dataRef   = useRef(data);
    dataRef.current = data;
    const [syncLatched, setSyncLatched] = useState(false);   // stays true until a sync succeeds
    const [online, setOnline] = useState(typeof navigator === 'undefined' ? true : navigator.onLine !== false);
    useEffect(() => {
      const on = () => setOnline(true), off = () => setOnline(false);
      window.addEventListener('online', on); window.addEventListener('offline', off);
      return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
    }, []);
    useEffect(() => {
      if (!gh) { setSyncLatched(false); return; }
      if (ghStatus === 'error' || ghStatus === 'auth' || ghStatus === 'conflict') setSyncLatched(true);
      else if (ghStatus === 'synced') setSyncLatched(false);
    }, [gh, ghStatus]);

    const setTasks      = fn => setData(d => ({ ...d, tasks:fn(d.tasks) }));

    const setMovieData  = fn => setData(d => ({ ...d, movieData: typeof fn === 'function' ? fn(d.movieData) : fn }));
    const setTVData     = fn => setData(d => ({ ...d, tvData: typeof fn === 'function' ? fn(d.tvData) : fn }));
    const setTravelData = fn => setData(d => ({ ...d, travelData: typeof fn === 'function' ? fn(d.travelData) : fn }));
    const setBudgetData = fn => setData(d => ({ ...d, budgetData: typeof fn === 'function' ? fn(d.budgetData) : fn }));
    const setTimeBlocks = fn => setData(d => ({ ...d, timeBlocks: typeof fn === 'function' ? fn(d.timeBlocks||[]) : fn }));

    // Apply theme
    useEffect(() => {
      const theme = settings.theme || 'dark';
      document.body.className = theme;
      const root = document.documentElement;
      const accent = settings.accentColor || '#6470f5';
      root.style.setProperty('--accent', accent);
      const dt = duskTokens(accent);
      root.style.setProperty('--g-a', dt.ga); root.style.setProperty('--g-c', dt.gc); root.style.setProperty('--g-sky', dt.sky); root.style.setProperty('--on-accent', dt.on);
      if (theme === 'dark') {
        const bg = settings.darkBg || '#000000';
        root.style.setProperty('--bg',       bg);
        root.style.setProperty('--surface',  mixHex(lightenHex(bg, 15), '#222a4a', .34));
        root.style.setProperty('--surface2', mixHex(lightenHex(bg, 25), '#2a3358', .34));
        root.style.setProperty('--border',   mixHex(lightenHex(bg, 38), '#3a4570', .32));
        root.style.setProperty('--shadow',   `0 4px 24px rgba(0,0,0,${bg==='#000000'?.7:.5})`);
      } else {
        ['--bg','--surface','--surface2','--border','--shadow'].forEach(v => root.style.removeProperty(v));
      }
      const font = FONT_OPTIONS.find(f => f.id === ((settings.fontId||'system')==='system' ? 'dusk' : settings.fontId));
      document.body.style.fontFamily = font ? font.stack : '';
    }, [settings.theme, settings.accentColor, settings.darkBg, settings.fontId]);

    // Async init: check IndexedDB for stored file handle
    useEffect(() => {
      (async () => {
        if (HAS_FSA) {
          const handle = await dbGet('fileHandle');
          if (handle) {
            pendingHandleRef.current = handle;
            setFileName(handle.name);
            setFileStatus('reconnect');
          } else {
            setFileStatus('none');
          }
        } else {
          setFileStatus('none');
        }
        setInitialized(true);
      })();
    }, []);

    // Auto-save to localStorage + file whenever data changes
    useEffect(() => {
      if (!initialized) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (fileHandle) {
        clearTimeout(saveTimerRef.current);
        setFileStatus('saving');
        saveTimerRef.current = setTimeout(async () => {
          try {
            await writeFileData(fileHandle, data);
            setFileStatus('connected');
          } catch { setFileStatus('error'); }
        }, 800);
      }
    }, [data, fileHandle, initialized]);


    // ── GitHub sync ────────────────────────────────────────────────
    function ghRemember(sha, hash) {
      ghShaRef.current = sha; ghHashRef.current = hash;
      try { localStorage.setItem(GH_KEY + '_sha', sha || ''); localStorage.setItem(GH_KEY + '_hash', hash || ''); } catch {}
    }
    async function ghSyncNow(force, retried) {
      const cfg = ghCfgRef.current;
      if (!cfg || ghBusy.current) return;
      if (typeof navigator !== 'undefined' && navigator.onLine === false) { setGhStatus('error'); setGhMsg('Offline. Changes are kept on this device and will sync when you are back online.'); return; }
      ghBusy.current = true; setGhStatus('syncing'); setGhMsg('');
      try {
        const local = dataRef.current;
        const localJson = JSON.stringify(local);
        const localHash = hashStr(localJson);
        const dirty = localHash !== ghHashRef.current;
        const remote = await ghPull(cfg);
        if (remote.missing) {
          const res = await ghPush(cfg, null, local, 'Initial sync from ' + (navigator.platform || 'device'));
          if (res.conflict) throw new Error('Could not create the data file. Try again.');
          ghRemember(res.sha, localHash);
        } else if (remote.sha === ghShaRef.current && force !== 'remote') {
          if (dirty || force === 'local') {
            const res = await ghPush(cfg, remote.sha, local, 'Update ' + new Date().toISOString().slice(0, 16).replace('T', ' '));
            if (res.conflict) { ghBusy.current = false; if (!retried) return ghSyncNow(force, true); throw new Error('Changed on another device while saving. Syncing again shortly.'); }
            ghRemember(res.sha, localHash);
          }
        } else {
          // remote differs from what this device last synced
          const takeRemote = force === 'remote' || (!dirty && ghShaRef.current);
          if (takeRemote) {
            const m = migrateData(remote.data);
            if (!m) throw new Error('The data on GitHub could not be read.');
            if (dirty) { try { localStorage.setItem('sidd_tracker_backup', localJson); } catch {} }
            ghRemember(remote.sha, hashStr(JSON.stringify(m)));
            setData(m);
          } else if (force === 'local') {
            const res = await ghPush(cfg, remote.sha, local, 'Overwrite from ' + (navigator.platform || 'device'));
            if (res.conflict) throw new Error('Changed on another device while saving. Try again.');
            ghRemember(res.sha, localHash);
          } else {
            setGhStatus('conflict'); setGhMsg(ghShaRef.current ? 'This device and GitHub both changed since the last sync.' : 'GitHub already has data for this app.');
            ghBusy.current = false; return;
          }
        }
        setGhStatus('synced'); setGhLast(Date.now());
      } catch (e) {
        if (e.message === 'auth') { setGhStatus('auth'); setGhMsg('GitHub rejected the token. It may have expired or lost access.'); }
        else { setGhStatus('error'); setGhMsg(e.message || 'Sync failed'); }
      } finally { ghBusy.current = false; }
    }
    const ghSyncRef = useRef(ghSyncNow);
    ghSyncRef.current = ghSyncNow;

    async function ghConnect(cfg) {
      try {
        await ghCheckRepo(cfg);
      } catch (e) { return e.message; }
      ghSaveCfg(cfg); ghCfgRef.current = cfg; ghRemember(null, null);
      setGh(cfg); setGhStatus('idle');
      ghSyncRef.current();
      return null;
    }
    function ghDisconnect() {
      ghSaveCfg(null); ghCfgRef.current = null; ghRemember(null, null);
      try { localStorage.removeItem(GH_KEY + '_sha'); localStorage.removeItem(GH_KEY + '_hash'); } catch {}
      setGh(null); setGhStatus('off'); setGhMsg(''); setGhLast(null);
    }

    // initial pull + push after edits + refresh when you come back to the app
    useEffect(() => { if (initialized && gh) ghSyncRef.current(); }, [initialized, gh]);
    useEffect(() => {
      if (!initialized || !gh) return;
      const t = setTimeout(() => {
        if (hashStr(JSON.stringify(dataRef.current)) !== ghHashRef.current && ghStatus !== 'conflict' && ghStatus !== 'auth') ghSyncRef.current();
      }, 2500);
      return () => clearTimeout(t);
    }, [data, gh, initialized]);
    useEffect(() => {
      if (!gh) return;
      const pull = () => { if (document.visibilityState === 'visible' && ghStatus !== 'conflict' && ghStatus !== 'auth') ghSyncRef.current(); };
      document.addEventListener('visibilitychange', pull);
      window.addEventListener('online', pull);
      const iv = setInterval(pull, 90000);
      return () => { document.removeEventListener('visibilitychange', pull); window.removeEventListener('online', pull); clearInterval(iv); };
    }, [gh, ghStatus]);

    function downloadBackup() {
      const d = new Date(), pad = n => String(n).padStart(2, '0');
      const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
      const blob = new Blob([JSON.stringify(dataRef.current, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `WorkTracker-backup-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    // File functions
    async function reconnectFile() {
      const handle = pendingHandleRef.current;
      if (!handle) return;
      try {
        const perm = await handle.requestPermission({ mode:'readwrite' });
        if (perm === 'granted') {
          try {
            const raw = await readFileData(handle);
            if (raw) {
              const m = migrateData(raw);
              if (m) setData(m);
            }
          } catch {}
          setFileHandle(handle);
          setFileStatus('connected');
          pendingHandleRef.current = null;
        } else {
          setFileStatus('none');
          pendingHandleRef.current = null;
        }
      } catch { setFileStatus('error'); }
    }

    function dismissReconnect() {
      pendingHandleRef.current = null;
      setFileStatus('none');
    }

    async function connectExistingFile() {
      if (!HAS_FSA) return;
      try {
        const [handle] = await window.showOpenFilePicker({
          types:[{ description:'WorkTracker JSON', accept:{'application/json':['.json']} }],
          multiple:false,
        });
        try {
          const raw = await readFileData(handle);
          if (raw) {
            const m = migrateData(raw);
            if (m) setData(m);
          }
        } catch {}
        setFileHandle(handle);
        setFileName(handle.name);
        setFileStatus('connected');
        await dbSet('fileHandle', handle);
      } catch(e) { if (e.name !== 'AbortError') setFileStatus('error'); }
    }

    async function createNewFile() {
      if (!HAS_FSA) return;
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName:'WorkTracker_data.json',
          types:[{ description:'WorkTracker JSON', accept:{'application/json':['.json']} }],
        });
        await writeFileData(handle, data);
        setFileHandle(handle);
        setFileName(handle.name);
        setFileStatus('connected');
        await dbSet('fileHandle', handle);
      } catch(e) { if (e.name !== 'AbortError') setFileStatus('error'); }
    }

    async function disconnectFile() {
      clearTimeout(saveTimerRef.current);
      setFileHandle(null);
      setFileName('');
      setFileStatus('none');
      await dbDel('fileHandle');
    }

    // Task operations
    const saveTask = form => {
      setTasks(prev => {
        const ex = prev.find(t => t.id===form.id);
        let ts = { ...form, updatedAt:Date.now() };
        if (ts.column === 'done' && ts.recurrence) {
          ts = { ...ts, column:'todo', lastCompleted:Date.now(), deadline:nextDeadline(ts) };
        }
        return ex ? prev.map(t => t.id===form.id ? ts : t) : [...prev, ts];
      });
      setModal(null);
    };
    const delTask  = id  => { setTasks(prev => prev.filter(t => t.id!==id)); setModal(null); };
    const saveBlock = b => { setTimeBlocks(prev => prev.some(x=>x.id===b.id) ? prev.map(x=>x.id===b.id?b:x) : [...prev,b]); setBlockModal(null); };
    const delBlock  = id => { setTimeBlocks(prev => prev.filter(b=>b.id!==id)); setBlockModal(null); };
    const moveTask = (id, col, cat, personalArea) => setTasks(prev => prev.map(t => {
      if (t.id !== id) return t;
      let updated = { ...t, column:col,
        ...(cat !== undefined ? { category:cat } : {}),
        ...(personalArea !== undefined ? { personalArea } : {}),
        updatedAt:Date.now() };
      if (col === 'done' && t.recurrence) {
        updated = { ...updated, column:'todo', lastCompleted:Date.now(), deadline:nextDeadline(t) };
      }
      return updated;
    }));
    const toggleSubtask = (taskId, stId) => setTasks(prev => prev.map(t =>
      t.id!==taskId ? t : { ...t, updatedAt:Date.now(),
        subtasks: (t.subtasks||[]).map(s => s.id===stId ? {...s,done:!s.done} : s) }));

    // Derived data
    const workTasks  = useMemo(() => tasks.filter(t => !t.isPersonal), [tasks]);
    const persTasks  = useMemo(() => tasks.filter(t =>  t.isPersonal), [tasks]);
    const allClients = useMemo(() => [...new Set(workTasks.map(t => t.client).filter(Boolean))].sort(), [workTasks]);

    const filteredWork = useMemo(() => workTasks.filter(t => {
      if (ctryF   && t.country !== ctryF)   return false;
      if (clientF && t.client  !== clientF)  return false;
      if (search) { const q=search.toLowerCase(); return t.title.toLowerCase().includes(q)||(t.client||'').toLowerCase().includes(q); }
      return true;
    }), [workTasks, ctryF, clientF, search]);

    const filteredPers = useMemo(() => {
      if (!search) return persTasks;
      const q=search.toLowerCase();
      return persTasks.filter(t => t.title.toLowerCase().includes(q));
    }, [persTasks, search]);

    const staleCount = useMemo(() =>
      [...workTasks,...persTasks].filter(t => isStale(t, settings.staleThresholdDays) && t.column!=='done' && t.column!=='onhold').length
    , [workTasks, persTasks, settings.staleThresholdDays]);

    const stats = {
      wActive: workTasks.filter(t=>t.column!=='done').length,
      pActive: persTasks.filter(t=>t.column!=='done').length,
      high:    workTasks.filter(t=>t.priority==='high'&&t.column!=='done').length,
      stale:   staleCount,
    };

    const PAGE_TITLES = { calendar:'Calendar', work:'Work', uni:'Uni', personal:'Personal', movies:'Films', tv:'TV', travel:'Travel', budget:'Budget', settings:'Settings' };
    const PAGE_SUBS = {
      calendar:'Deadlines, assessments and blocked time',
      work:`${stats.wActive} active · ${stats.high} high priority`,
      personal:`${stats.pActive} active`,
      uni:'Grades, WAM and the assessment planner',
      movies:`${(movieData?.movies||[]).length} films logged`,
      tv:`${(tvData?.shows||[]).length} shows tracked`,
      travel:`${(travelData?.visits||[]).length} visits logged`,
      budget:'Monthly plan, spending and savings',
      settings:'Sync, backup and appearance',
    };
    const syncBlocked = !!gh && syncLatched && online && tab !== 'settings';
    return (
      <>
      <div inert={syncBlocked ? '' : undefined} aria-hidden={syncBlocked ? 'true' : undefined}>
        {/* RECONNECT BANNER */}
        {fileStatus === 'reconnect' && (
          <div className="file-banner reconnect">
            <span>Data file found: <strong>{fileName}</strong></span>
            <span style={{ color:'var(--text2)', fontSize:13 }}>Click Reconnect to resume saving to this file on your PC.</span>
            <div style={{ display:'flex', gap:8, marginLeft:'auto' }}>
              <button className="fbtn primary" onClick={reconnectFile}>Reconnect</button>
              <button className="fbtn" onClick={dismissReconnect}>Dismiss</button>
            </div>
          </div>
        )}

        {/* TOP NAV */}
        <div className="topnav">
          <div className="nav-logo">Sidd<span>.</span>Work</div>
          <div className="nav-tabs">
            {[['home','Home'],['calendar','Calendar'],['work','Work'],['uni','Uni'],['personal','Personal']].map(([t,l]) => (
              <button key={t} className={`nav-tab ${tab===t?'active':''}`} onClick={() => setTab(t)}>{l}</button>
            ))}
            <div style={{width:'1px',background:'var(--border)',margin:'4px 2px',flexShrink:0}}/>
            {[['movies','Films'],['tv','TV'],['travel','Travel'],['budget','Budget']].map(([t,l]) => (
              <button key={t} className={`nav-tab ${tab===t?'active':''}`} onClick={() => setTab(t)}>{l}</button>
            ))}
          </div>
          <div className="nav-stats">
            <div className="nstat"><span className="nstat-n">{stats.wActive}</span><span className="nstat-l">Work</span></div>
            <div className="nstat"><span className="nstat-n">{stats.pActive}</span><span className="nstat-l">Personal</span></div>
            <div className="nstat"><span className="nstat-n" style={{color:stats.high>0?'var(--high)':'var(--text2)'}}>{stats.high}</span><span className="nstat-l">High Pri</span></div>
            <div className="nstat"><span className="nstat-n" style={{color:stats.stale>0?'var(--med)':'var(--text2)'}}>{stats.stale}</span><span className="nstat-l">Stale</span></div>
          </div>
          {gh && (
            <div className={`file-pill gh-pill ${ghStatus}`} role="button" onClick={() => setTab('settings')}
              title={ghStatus==='synced' ? 'Synced with GitHub' : ghStatus==='syncing' ? 'Syncing with GitHub…' : ghStatus==='conflict' ? 'Sync needs your decision (open Settings)' : ghStatus==='auth' ? 'GitHub token problem (open Settings)' : ghStatus==='error' ? ('Sync problem: ' + ghMsg) : 'GitHub sync'}>
              <div className={`fpill-dot ${ghStatus==='synced' ? 'green' : ghStatus==='syncing'||ghStatus==='idle' ? 'amber' : 'red'}`} />
              <span>{ghStatus==='synced' ? 'Synced' : ghStatus==='syncing'||ghStatus==='idle' ? 'Syncing…' : ghStatus==='conflict' ? 'Choose version' : ghStatus==='auth' ? 'Token issue' : 'Sync error'}</span>
            </div>
          )}
          {fileStatus !== 'checking' && !(gh && (fileStatus==='none' || fileStatus==='reconnect')) && (
            <div className="file-pill" title={fileStatus==='connected'?`Auto-saving to: ${fileName}`:fileStatus==='saving'?'Saving...':'Using browser storage only'}>
              {fileStatus==='connected' && <><div className="fpill-dot green" /><span className="fpill-name">{fileName}</span></>}
              {fileStatus==='saving'    && <><div className="fpill-dot amber" /><span>Saving...</span></>}
              {fileStatus==='error'     && <><div className="fpill-dot red"   /><span>Save error</span></>}
              {(fileStatus==='none'||fileStatus==='reconnect') && <><div className="fpill-dot gray" /><span>Browser only</span></>}
            </div>
          )}
          <button className={`nav-settings-btn ${tab==='settings'?'active':''}`} onClick={() => setTab('settings')} title="Settings" aria-label="Settings"><Icon name="gear" size={18} /></button>
        </div>

        {/* BOTTOM NAV (phone / small tablet) */}
        <nav className="bottom-nav" aria-label="Main">
          {[['home','Home','home'],['calendar','Calendar','calendar'],['work','Work','briefcase'],['uni','Uni','cap']].map(([t,l,ic]) => (
            <button key={t} className={`bn-item ${tab===t?'active':''}`} onClick={() => setTab(t)}><span className="bn-ic"><Icon name={ic} size={22} /></span><span className="bn-lbl">{l}</span></button>
          ))}
          <button className={`bn-item ${['personal','movies','tv','travel','budget','settings'].includes(tab)||moreOpen?'active':''}`} onClick={() => setMoreOpen(o=>!o)}><span className="bn-ic"><Icon name="menu" size={22} /></span><span className="bn-lbl">More</span></button>
        </nav>
        {moreOpen && (
          <div className="more-overlay" onClick={() => setMoreOpen(false)}>
            <div className="more-sheet" onClick={e => e.stopPropagation()}>
              <div className="more-grip" />
              <div className="more-grid">
                {[['personal','Personal','user'],['movies','Films','film'],['tv','TV','tv'],['travel','Travel','globe'],['budget','Budget','wallet'],['settings','Settings','gear']].map(([t,l,ic]) => (
                  <button key={t} className={`more-item ${tab===t?'active':''}`} onClick={() => setTab(t)}><span className="more-ic"><Icon name={ic} size={26} /></span><span>{l}</span></button>
                ))}
              </div>
              <div className="more-stats">
                <span><b style={{color:'#5b6af0'}}>{stats.wActive}</b> work</span>
                <span><b style={{color:'#9070d8'}}>{stats.pActive}</b> personal</span>
                <span><b style={{color:'#e05252'}}>{stats.high}</b> high pri</span>
                <span><b style={{color:stats.stale>0?'#c98a10':'var(--text2)'}}>{stats.stale}</b> stale</span>
              </div>
            </div>
          </div>
        )}

        {PAGE_TITLES[tab] && (
          <header className="page-hdr"><div><h1>{PAGE_TITLES[tab]}</h1><p>{PAGE_SUBS[tab]}</p></div></header>
        )}

        {/* TOOLBAR */}
        {(tab==='work' || tab==='personal') && (
          <div className="toolbar">
            <div className="toolbar-row">
              {tab==='work' && (<>
                <button className={`ctry-btn ${!ctryF?'active':''}`} onClick={() => setCtryF('')}>All</button>
                {COUNTRIES.map(c => (
                  <button key={c.code} className={`ctry-btn ${ctryF===c.code?'active':''}`} onClick={() => setCtryF(f=>f===c.code?'':c.code)} title={c.name}>{c.flag} {c.code}</button>
                ))}
                <div className="toolbar-sep" />
                <select className="client-select" value={clientF} onChange={e => setClientF(e.target.value)}>
                  <option value="">All clients</option>
                  {allClients.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <div className="toolbar-sep" />
                <div className="view-toggle">
                  <button className={`vtab ${workView==='board'?'active':''}`} onClick={() => setWorkView('board')}>Board</button>
                  <button className={`vtab ${workView==='priority'?'active':''}`} onClick={() => setWorkView('priority')}>Priority</button>
                </div>
              </>)}
              <input className="search-input" type="text" placeholder="Search tasks or clients..." value={search} onChange={e => setSearch(e.target.value)} />
              <button className="add-btn" onClick={() => setModal({ isPersonal:tab==='personal', defaultCat:settings.workCats[0]?.id, defaultStatus:'todo', defaultCountry:ctryF, defaultDl:'' })}>+ New Task</button>
            </div>
          </div>
        )}

        {/* CONTENT */}
        {tab==='home' && (
          <HomeView
            tasks={tasks}
            workTasks={workTasks}
            persTasks={persTasks}
            uniData={uniData}
            movieData={movieData}
            tvData={tvData}
            settings={settings}
            onNav={t => setTab(t)}
          />
        )}
        {tab==='work' && workView==='board' && (
          <MatrixView tasks={filteredWork} workCats={settings.workCats} staleThreshold={settings.staleThresholdDays}
            onEdit={t => setModal({ task:t, isPersonal:false })}
            onAdd={(catId,status) => setModal({ isPersonal:false, defaultCat:catId, defaultStatus:status, defaultCountry:ctryF, defaultDl:'' })}
            onDelete={delTask} onMove={moveTask} onToggleSubtask={toggleSubtask} />
        )}
        {tab==='work' && workView==='priority' && (
          <PriorityView tasks={filteredWork} workCats={settings.workCats} staleThreshold={settings.staleThresholdDays}
            onEdit={t => setModal({ task:t, isPersonal:false })} onMove={moveTask} />
        )}
        {tab==='personal' && (
          <PersonalMatrixView tasks={filteredPers} persCats={settings.persCats||DEFAULT_PERS_CATS} staleThreshold={settings.staleThresholdDays}
            onEdit={t => setModal({ task:t, isPersonal:true })} onDelete={delTask}
            onAdd={(catId, status) => setModal({ isPersonal:true, defaultCat:catId, defaultStatus:status, defaultDl:'' })}
            onMove={moveTask} onToggleSubtask={toggleSubtask} />
        )}
        {tab==='calendar' && (
          <CalendarView
            tasks={tasks}
            workCats={settings.workCats}
            persCats={settings.persCats||DEFAULT_PERS_CATS}
            uniData={uniData}
            timeBlocks={timeBlocks||[]}
            onEdit={t => setModal({ task:t, isPersonal:t.isPersonal })}
            onAdd={dateStr => setModal({ isPersonal:false, defaultCat:settings.workCats[0]?.id, defaultStatus:'todo', defaultCountry:'', defaultDl:dateStr })}
            onEditUni={(semId, subjId, assess) => setUniCalModal({ semId, subjId, assess })}
            onAddBlock={payload => {
              const date = typeof payload === 'string' ? payload : payload?.date;
              const st   = typeof payload === 'object' ? payload?.startTime : undefined;
              const et   = typeof payload === 'object' ? payload?.endTime   : undefined;
              setBlockModal({ defaultDate:date, defaultStartTime:st, defaultEndTime:et });
            }}
            onEditBlock={b => setBlockModal({ block: b })}
          />
        )}
        {tab==='uni' && (
          <UniView uniData={uniData || makeDefaultUniData()} onUpdate={setUniData} />
        )}
        {tab==='movies' && (
          <MoviesView movieData={movieData || makeDefaultMovieData()} onUpdate={setMovieData} tmdbKey={settings.tmdbKey||''} />
        )}
        {tab==='tv' && (
          <TVView tvData={tvData || makeDefaultTVData()} onUpdate={setTVData} tmdbKey={settings.tmdbKey||''} />
        )}
        {tab==='travel' && (
          <TravelView travelData={travelData || makeDefaultTravelData()} onUpdate={setTravelData} />
        )}
        {tab==='budget' && (
          <BudgetView budgetData={budgetData || makeDefaultBudgetData()} onUpdate={setBudgetData} />
        )}
        {tab==='settings' && (
          <SettingsView settings={settings} onUpdate={setSettings}
            fileStatus={fileStatus} fileName={fileName} hasFSA={HAS_FSA}
            gh={gh} ghStatus={ghStatus} ghMsg={ghMsg} ghLast={ghLast} onGhConnect={ghConnect} onGhSync={() => ghSyncRef.current()} onGhResolve={c => ghSyncRef.current(c)} onGhDisconnect={ghDisconnect} onDownloadBackup={downloadBackup}
            onConnectExisting={connectExistingFile} onCreateNew={createNewFile} onDisconnect={disconnectFile} />
        )}

        {/* UNI ASSESSMENT MODAL (from calendar) */}
        {uniCalModal && (
          <UniAssessModal
            assess={uniCalModal.assess}
            onSave={saved => {
              setUniData(d => ({
                ...d,
                semesters: d.semesters.map(sem => sem.id!==uniCalModal.semId ? sem : {
                  ...sem,
                  subjects: sem.subjects.map(subj => subj.id!==uniCalModal.subjId ? subj : {
                    ...subj,
                    assessments: subj.assessments.map(a => a.id===saved.id ? saved : a)
                  })
                })
              }));
              setUniCalModal(null);
            }}
            onDelete={() => setUniCalModal(null)}
            onClose={() => setUniCalModal(null)} />
        )}
        {/* TIME BLOCK MODAL */}
        {blockModal && (
          <TimeBlockModal
            block={blockModal.block || null}
            defaultDate={blockModal.defaultDate || localDateStr(new Date())}
            defaultStartTime={blockModal.defaultStartTime}
            defaultEndTime={blockModal.defaultEndTime}
            onSave={saveBlock}
            onDelete={delBlock}
            onClose={() => setBlockModal(null)}
          />
        )}
        {/* MODAL */}
        {modal && (
          <TaskModal task={modal.task||null} isPersonal={modal.isPersonal}
            defaultCat={modal.defaultCat} defaultStatus={modal.defaultStatus}
            defaultCountry={modal.defaultCountry} defaultDl={modal.defaultDl}
            workCats={settings.workCats} persCats={settings.persCats||DEFAULT_PERS_CATS} allClients={allClients}
            onSave={saveTask} onDelete={delTask} onClose={() => setModal(null)} />
        )}
      </div>

      {/* SYNC GATE: editing is paused while GitHub sync is failing, so devices cannot drift apart */}
      {syncBlocked && (
        <div className="sync-block" role="alertdialog" aria-modal="true" aria-labelledby="sync-block-title">
          <div className="sync-block-card">
            <div className="sync-block-ic"><Icon name={ghStatus === 'syncing' ? 'refresh' : 'alert'} size={26} /></div>
            <h2 id="sync-block-title">
              {ghStatus === 'syncing' ? 'Syncing with GitHub…' : ghStatus === 'conflict' ? 'Choose which version to keep' : ghStatus === 'auth' ? 'GitHub access needs attention' : 'Not synced to GitHub'}
            </h2>
            <p>
              {ghStatus === 'syncing' ? 'Hang on, this only takes a moment.'
                : <>{ghMsg || 'Your changes could not be saved to GitHub.'} Editing is paused until this is resolved, so your devices cannot get out of step.</>}
            </p>
            <div className="sync-block-actions">
              {ghStatus === 'conflict' ? (
                <>
                  <button className="btn-save" onClick={() => ghSyncRef.current('remote')}>Use GitHub's version</button>
                  <button className="btn-cancel" onClick={() => ghSyncRef.current('local')}>Keep this device's</button>
                </>
              ) : (
                <button className="btn-save" disabled={ghStatus === 'syncing'} onClick={() => ghSyncRef.current()}>
                  <Icon name="refresh" size={16} /> {ghStatus === 'syncing' ? 'Syncing…' : 'Sync now'}
                </button>
              )}
              <button className="btn-cancel" onClick={() => setTab('settings')}><Icon name="gear" size={16} /> Open settings</button>
            </div>
          </div>
        </div>
      )}
      </>
    );
  }


  /* ── TOUCH DRAG & DROP ──────────────────────────────────────────
     Phones don't fire HTML5 drag events. This layer turns a long-press + drag on any
     [draggable="true"] element into the same dragstart / dragover / drop / dragend events
     the app already handles, so every ranking list and board works unchanged. */
  (function installTouchDnD() {
    if (!('ontouchstart' in window)) return;
    const HOLD_MS = 280, MOVE_TOL = 9, EDGE = 70;
    let src=null, ghost=null, timer=null, active=false, lastTarget=null, dt=null, sx=0, sy=0, lx=0, ly=0, raf=null, offX=0, offY=0, suppressUntil=0;
    const mkDT = () => { const store={}; return { effectAllowed:'all', dropEffect:'move', types:[], files:[],
      setData(k,v){ store[k]=String(v); this.types=Object.keys(store); }, getData(k){ return store[k]||''; }, clearData(){ for (const k in store) delete store[k]; this.types=[]; }, setDragImage(){} }; };
    const fire = (el, type, extra) => { const ev = new Event(type, { bubbles:true, cancelable:true }); Object.defineProperty(ev,'dataTransfer',{ value:dt }); if (extra) Object.assign(ev, extra); return el.dispatchEvent(ev); };
    const cleanup = () => { clearTimeout(timer); cancelAnimationFrame(raf); if (ghost) ghost.remove(); ghost=null; src=null; active=false; lastTarget=null; dt=null; document.body.classList.remove('touch-dragging'); };
    function targetAt(x, y) { if (ghost) ghost.style.display='none'; const el = document.elementFromPoint(x, y); if (ghost) ghost.style.display=''; return el; }
    function update() {
      if (!active) return;
      ghost.style.transform = `translate(${lx-offX}px, ${ly-offY}px) scale(1.03)`;
      const t = targetAt(lx, ly);
      if (t !== lastTarget) {
        if (lastTarget) fire(lastTarget, 'dragleave', { relatedTarget:t });
        if (t) fire(t, 'dragenter', { relatedTarget:lastTarget });
        lastTarget = t;
      }
      if (t) fire(t, 'dragover');
      const vh = window.innerHeight;
      if (ly < EDGE) window.scrollBy(0, -Math.ceil((EDGE-ly)/5));
      else if (ly > vh-EDGE-60) window.scrollBy(0, Math.ceil((ly-(vh-EDGE-60))/5));
      raf = requestAnimationFrame(update);
    }
    function begin() {
      if (!src) return;
      dt = mkDT();
      fire(src, 'dragstart');
      const r = src.getBoundingClientRect();
      ghost = src.cloneNode(true);
      ghost.removeAttribute('draggable');
      ghost.classList.add('touch-ghost');
      ghost.style.cssText = `position:fixed;left:0;top:0;width:${r.width}px;height:${r.height}px;margin:0;z-index:9999;pointer-events:none;opacity:.92;box-shadow:0 14px 36px rgba(0,0,0,.55);transition:none;`;
      offX = sx - r.left; offY = sy - r.top;
      document.body.appendChild(ghost);
      document.body.classList.add('touch-dragging');
      active = true;
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
      update();
    }
    document.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return cleanup();
      const el = e.target.closest && e.target.closest('[draggable="true"]');
      if (!el || e.target.closest('button,input,select,textarea,a')) return;
      src = el; sx = lx = e.touches[0].clientX; sy = ly = e.touches[0].clientY;
      timer = setTimeout(begin, HOLD_MS);
    }, { passive:true });
    document.addEventListener('touchmove', e => {
      const t = e.touches[0]; lx = t.clientX; ly = t.clientY;
      if (!active) { if (src && Math.hypot(lx-sx, ly-sy) > MOVE_TOL) { clearTimeout(timer); src=null; } return; }
      e.preventDefault();
    }, { passive:false });
    const finish = (drop) => e => {
      if (!active) { cleanup(); return; }
      cancelAnimationFrame(raf);
      const t = targetAt(lx, ly);
      if (drop && t) fire(t, 'drop');
      if (src) fire(src, 'dragend');
      suppressUntil = Date.now() + 450;
      cleanup();
    };
    document.addEventListener('touchend', finish(true));
    document.addEventListener('touchcancel', finish(false));
    document.addEventListener('click', e => { if (Date.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
    document.addEventListener('contextmenu', e => { if (active || src) e.preventDefault(); });
  })();

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
