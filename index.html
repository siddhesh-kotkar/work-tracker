                                {movie.isAllTime && <div className="mv-at-badge" title="All-time favourite"><Icon name="star" size={15} fill /></div>}
                              </div>
                              <div className="mv-card-body">
                                <div className="mv-card-title" title={movie.title}>{movie.title}</div>
                                <div className="mv-card-sub">{[movie.director, movie.trackYear ? `watched ${movie.trackYear}` : null].filter(Boolean).join(' · ')}</div>
                                {movie.rating
                                  ? <div className="mv-card-rating"><StarRating value={movie.rating} readOnly size={11}/><span style={{fontSize:10,color:'var(--text2)'}}>{movie.rating}</span></div>
                                  : <div className="mv-no-rating">Unrated</div>}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )
          )}

          {/* ── STUDIO VIEW ── */}
          {isStudio && (
            movies.length === 0 ? (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="film" size={40} /></div>
                <div className="mv-empty-ttl">No films yet</div>
                <div className="mv-empty-sub">Add films and run Enrich to populate studio data.</div>
              </div>
            ) : (
              <div className="mv-genre-view">
                {sortedStudios.map(studio => {
                  const group = studioMap[studio];
                  const collapsed = collapsedStudios[studio];
                  const avgRating = group.filter(m=>m.rating).length
                    ? (group.filter(m=>m.rating).reduce((s,m)=>s+m.rating,0)/group.filter(m=>m.rating).length).toFixed(1)
                    : null;
                  return (
                    <div key={studio} className="mv-genre-section">
                      <div className="mv-genre-hdr" style={{cursor:'pointer'}} onClick={()=>toggleStudio(studio)}>
                        <span className="mv-genre-name">{studio}</span>
                        <span className="mv-genre-count">{group.length} film{group.length!==1?'s':''}</span>
                        {avgRating && <span style={{fontSize:12,color:'var(--text3)',marginLeft:8}}>avg ★{avgRating}</span>}
                        <span style={{marginLeft:'auto',fontSize:12,color:'var(--text3)'}}>{collapsed?'▶':'▼'}</span>
                      </div>
                      {!collapsed && (
                        <div className="mv-grid">
                          {group.map(movie => (
                            <div key={movie.id} className="mv-card" onClick={()=>setModal({movie})}>
                              <div className="mv-poster">
                                {movie.posterPath
                                  ? <img src={TMDB_IMG+movie.posterPath} alt={movie.title}/>
                                  : <div className="mv-poster-fb"><Icon name="film" size={26} /></div>}
                                {movie.isAllTime && <div className="mv-at-badge" title="All-time favourite"><Icon name="star" size={15} fill /></div>}
                              </div>
                              <div className="mv-card-body">
                                <div className="mv-card-title" title={movie.title}>{movie.title}</div>
                                <div className="mv-card-sub">{[movie.director, movie.releaseYear].filter(Boolean).join(' · ')}</div>
                                {movie.rating
                                  ? <div className="mv-card-rating"><StarRating value={movie.rating} readOnly size={11}/><span style={{fontSize:10,color:'var(--text2)'}}>{movie.rating}</span></div>
                                  : <div className="mv-no-rating">Unrated</div>}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )
          )}

          {/* ── UNRATED VIEW ── */}
          {isUnrated && (
            unratedMovies.length === 0 ? (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="star" size={40} /></div>
                <div className="mv-empty-ttl">All films rated</div>
                <div className="mv-empty-sub">Every film in your library has a rating.</div>
              </div>
            ) : (
              <div className="mv-unrated-view">
                <div className="mv-unrated-hdr">
                  <span className="mv-unrated-count-pill">{unratedMovies.length} films</span>
                  <select className="mv-unrated-sort" value={unratedSort} onChange={e => setUnratedSort(e.target.value)}>
                    <option value="year">Sort by year</option>
                    <option value="title">Sort by title</option>
                    <option value="runtime_asc">Runtime ↑ (shortest first)</option>
                    <option value="runtime_desc">Runtime ↓ (longest first)</option>
                  </select>
                  <button
                    onClick={()=>pickRandom(unratedMovies)}
                    title="Pick a random film to watch"
                    className="mv-add-btn">
                    <Icon name="dice" size={16} /> Pick one
                  </button>
                </div>
                <div className="mv-grid">
                  {unratedMovies.map(movie => {
                    const wy = movie.watchDate ? parseInt(movie.watchDate) : movie.trackYear;
                    return (
                      <div key={movie.id} className="mv-card" onClick={() => setModal({ movie })}>
                        <div className="mv-poster">
                          {movie.posterPath
                            ? <img src={TMDB_IMG + movie.posterPath} alt={movie.title} />
                            : <div className="mv-poster-fb"><Icon name="film" size={26} /></div>}
                          {wy && <div className="mv-rank-badge" style={{ background:'var(--surface2)', color:'var(--text2)', border:'1px solid var(--border)' }}>{wy}</div>}
                        </div>
                        <div className="mv-card-body">
                          <div className="mv-card-title" title={movie.title}>{movie.title}</div>
                          <div className="mv-card-sub">{[[movie.director, movie.releaseYear].filter(Boolean).join(' · '), movie.runtime && (unratedSort==='runtime_asc'||unratedSort==='runtime_desc') ? `${movie.runtime}m` : ''].filter(Boolean).join(' · ')}</div>
                          <div className="mv-no-rating" style={{ color:'var(--med)', fontWeight:600 }}>⚠ Needs rating</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )
          )}

          {/* ── YEAR: FILMS VIEW ── */}
          {!isSpecial && subView==='films' && (()=>{
            if (yearMovies.length === 0) return (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="film" size={40} /></div>
                <div className="mv-empty-ttl">{isUndated ? 'No undated films' : `No films tracked for ${year}`}</div>
                <div className="mv-empty-sub">{isUndated ? 'Films without a watch year will appear here.' : `Add films you watched in ${year}.`}</div>
              </div>
            );
            if (sortedYearMovies.length === 0) return (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="search" size={40} /></div>
                <div className="mv-empty-ttl">No results</div>
                <div className="mv-empty-sub">No films in {year} match "{search}".</div>
              </div>
            );

            // Helper renders a single film card
            function FilmCard({ movie }) {
              return (
                <div className="mv-card" onClick={()=>setModal({movie})}>
                  <div className="mv-poster">
                    {movie.posterPath
                      ? <img src={TMDB_IMG+movie.posterPath} alt={movie.title} />
                      : <div className="mv-poster-fb"><Icon name="film" size={26} /></div>}
                    {movie.yearRank && <div className="mv-rank-badge">#{movie.yearRank}</div>}
                    {movie.isAllTime && <div className="mv-at-badge" title="All-time favourite"><Icon name="star" size={15} fill /></div>}
                    {movie.honourableMention && !movie.yearRank && <div className="mv-hm-badge">HM</div>}
                  </div>
                  <div className="mv-card-body">
                    <div className="mv-card-title" title={movie.title}>{movie.title}</div>
                    <div className="mv-card-sub">{[movie.director, movie.releaseYear].filter(Boolean).join(' · ')}</div>
                    {movie.rating
                      ? <div className="mv-card-rating"><StarRating value={movie.rating} readOnly size={11}/><span style={{fontSize:10,color:'var(--text2)'}}>{movie.rating}</span></div>
                      : <div className="mv-no-rating">Unrated</div>}
                  </div>
                </div>
              );
            }
            function FilmListItem({ movie }) {
              return (
                <div className="mv-list-item" onClick={()=>setModal({movie})}>
                  {movie.yearRank && <div className={`mv-li-rank ${movie.yearRank<=3?'top3':''}`}>#{movie.yearRank}</div>}
                  <div className="mv-li-poster"><Poster movie={movie}/></div>
                  <div className="mv-li-info">
                    <div className="mv-li-title">{movie.title}{movie.isAllTime&&<span style={{fontSize:12,marginLeft:5}}>⭐</span>}{movie.honourableMention&&!movie.yearRank&&<span style={{fontSize:10,fontWeight:800,background:'rgba(201,138,16,.15)',color:'#c98a10',borderRadius:4,padding:'1px 5px',marginLeft:5}}>HM</span>}</div>
                    <div className="mv-li-meta">{[movie.director, movie.releaseYear, movie.runtime?`${movie.runtime} min`:null, (movie.genres||[]).slice(0,2).join(' · ')].filter(Boolean).join(' · ')}</div>
                  </div>
                  <div className="mv-li-right">
                    {movie.rating ? <StarRating value={movie.rating} readOnly size={14}/> : <span className="mv-no-rating">Unrated</span>}
                    {(movie.genres||[]).slice(0,1).map(g=><span key={g} className="mv-genre-pill">{g}</span>)}
                  </div>
                </div>
              );
            }

            if (!groupByRelease) {
              return gridMode==='grid' ? (
                <div className="mv-grid">{sortedYearMovies.map(m=><FilmCard key={m.id} movie={m}/>)}</div>
              ) : (
                <div className="mv-list">{sortedYearMovies.map(m=><FilmListItem key={m.id} movie={m}/>)}</div>
              );
            }

            // ── Grouped by release year ──
            const watchYr = parseInt(year);
            const releaseGroups = {};
            for (const m of sortedYearMovies) {
              const ry = m.releaseYear ? String(m.releaseYear) : 'Unknown';
              if (!releaseGroups[ry]) releaseGroups[ry] = [];
              releaseGroups[ry].push(m);
            }
            const sortedRGs = Object.keys(releaseGroups)
              .filter(k=>k!=='Unknown')
              .sort((a,b)=>b-a);
            if (releaseGroups['Unknown']) sortedRGs.push('Unknown');

            const avgRating = grp => {
              const rated = grp.filter(m=>m.rating);
              return rated.length ? (rated.reduce((s,m)=>s+m.rating,0)/rated.length).toFixed(1) : null;
            };

            return (
              <div>
                {sortedRGs.map(ry => {
                  const grp = releaseGroups[ry];
                  const isNew = ry !== 'Unknown' && parseInt(ry) === watchYr;
                  const avg = avgRating(grp);
                  return (
                    <div key={ry} style={{marginBottom:24}}>
                      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,paddingBottom:6,borderBottom:'1px solid var(--border)'}}>
                        <span style={{fontSize:15,fontWeight:800,color:'var(--text)'}}>{ry === 'Unknown' ? 'Unknown release year' : ry}</span>
                        {isNew && <span style={{fontSize:10,fontWeight:800,background:'var(--accent)',color:'#fff',borderRadius:5,padding:'2px 7px',letterSpacing:'.3px'}}>NEW RELEASE</span>}
                        <span style={{fontSize:12,color:'var(--text3)'}}>{grp.length} film{grp.length!==1?'s':''}</span>
                        {avg && <span style={{fontSize:12,color:'var(--text2)',marginLeft:'auto'}}>avg ★ {avg}</span>}
                      </div>
                      {gridMode==='grid'
                        ? <div className="mv-grid">{grp.map(m=><FilmCard key={m.id} movie={m}/>)}</div>
                        : <div className="mv-list">{grp.map(m=><FilmListItem key={m.id} movie={m}/>)}</div>
                      }
                    </div>
                  );
                })}
              </div>
            );
          })()}

          {/* ── YEAR: RANKINGS VIEW ── */}
          {!isSpecial && subView==='rankings' && (
            <div className="mv-rankings-wrap">
              <div style={{display:'flex',alignItems:'baseline',gap:12,marginBottom:8}}>
                <div style={{fontSize:20,fontWeight:800}}>{year} Top 10</div>
                <div style={{fontSize:13,color:'var(--text2)'}}>{ranked.length}/10 ranked</div>
              </div>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:14}}>Drag to reorder (press and hold on touch) · Click the # to remove from ranking</div>
              <div className="mv-rank-list">
                {ranked.map(movie=>(
                  <div key={movie.id}
                    className={`mv-rank-item ${dragId===movie.id?'dragging':''} ${dragOver===movie.id&&dragId!==movie.id?'drag-over':''}`}
                    draggable onDragStart={e=>onRankDragStart(e,movie.id)} onDragOver={e=>onRankDragOver(e,movie.id)}
                    onDrop={e=>onRankDrop(e,movie.id)} onDragEnd={()=>{setDragId(null);setDragOver(null);}}>
                    <div className={`mv-rank-num ${movie.yearRank<=3?'top3':''}`} title="Click to remove from ranking" style={{cursor:'pointer'}} onClick={e=>{e.stopPropagation();removeFromRankings(movie.id);}}>
                      #{movie.yearRank}
                    </div>
                    <div className="mv-rank-poster-sm"><Poster movie={movie}/></div>
                    <div className="mv-rank-info">
                      <div className="mv-rank-film-title">{movie.title}</div>
                      <div className="mv-rank-film-meta">{[movie.director, movie.releaseYear, movie.runtime?`${movie.runtime}m`:null].filter(Boolean).join(' · ')}</div>
                    </div>
                    {movie.rating && <StarRating value={movie.rating} readOnly size={14}/>}
                  </div>
                ))}
                {[...Array(Math.max(0,10-ranked.length))].map((_,i)=>(
                  <div key={`slot${i}`} style={{background:'var(--surface)',border:'1px dashed var(--border)',borderRadius:10,padding:'11px 16px',display:'flex',alignItems:'center',gap:14}}>
                    <div style={{fontSize:20,fontWeight:900,color:'var(--text3)',minWidth:34,textAlign:'center'}}>#{ranked.length+i+1}</div>
                    <div style={{fontSize:13,color:'var(--text3)',fontStyle:'italic'}}>empty slot</div>
                  </div>
                ))}
              </div>
              {/* Honourable Mentions section */}
              {hmMovies.length > 0 && (
                <div className="mv-hm-section">
                  <div className="mv-hm-title">🏅 Honourable Mentions</div>
                  {hmMovies.map(movie=>(
                    <div key={movie.id} className="mv-hm-item" onClick={()=>setModal({movie})}>
                      <div className="mv-rank-poster-sm"><Poster movie={movie}/></div>
                      <div className="mv-rank-info">
                        <div className="mv-rank-film-title">{movie.title}</div>
                        <div className="mv-rank-film-meta">{[movie.director, movie.releaseYear, movie.runtime?`${movie.runtime}m`:null].filter(Boolean).join(' · ')}</div>
                      </div>
                      {movie.rating && <StarRating value={movie.rating} readOnly size={14}/>}
                      <button className="mv-hm-remove-btn" onClick={e=>{e.stopPropagation();toggleHM(movie.id);}}>Remove HM</button>
                      {ranked.length < 10 && (
                        <button className="mv-hm-btn" onClick={e=>{e.stopPropagation();addToRankings(movie.id);}}>+ Rank</button>
                      )}
                    </div>
                  ))}
                </div>
              )}

              {/* Not yet ranked */}
              {unranked.length > 0 && (
                <div className="mv-rank-unranked-section">
                  <div className="mv-rank-unranked-title">Watched in {year} · not yet ranked</div>
                  {unranked.map(movie=>(
                    <div key={movie.id} className="mv-rank-unranked-item"
                      draggable onDragStart={e=>onRankDragStart(e,movie.id)} onDragEnd={()=>{setDragId(null);setDragOver(null);}}>
                      <div className="mv-rank-poster-sm"><Poster movie={movie}/></div>
                      <div className="mv-rank-info" style={{cursor:ranked.length<10?'pointer':'default'}} onClick={()=>ranked.length<10&&addToRankings(movie.id)} title={ranked.length<10?'Click to add to rankings':'Rankings full'}>
                        <div className="mv-rank-film-title">{movie.title}</div>
                        <div className="mv-rank-film-meta">{[movie.director, movie.releaseYear, movie.runtime?`${movie.runtime}m`:null].filter(Boolean).join(' · ')}</div>
                      </div>
                      {movie.rating && <StarRating value={movie.rating} readOnly size={14}/>}
                      <button className="mv-hm-btn" onClick={e=>{e.stopPropagation();toggleHM(movie.id);}} title="Mark as Honourable Mention">🏅 HM</button>
                      {ranked.length < 10 && (
                        <span style={{fontSize:20,color:'var(--text3)',cursor:'pointer'}} onClick={()=>addToRankings(movie.id)} title="Add to rankings">+</span>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── ALL TIME VIEW ── */}
          {isAllTime && (
            <div>
              <div className="mv-at-header-tabs">
                <button className={`mv-at-htab ${atTab==='films'?'active':''}`} onClick={()=>setAtTab('films')}>Top Films</button>
                <button className={`mv-at-htab ${atTab==='directors'?'active':''}`} onClick={()=>setAtTab('directors')}>Directors</button>
                <button className={`mv-at-htab ${atTab==='stats'?'active':''}`} onClick={()=>setAtTab('stats')}>Stats</button>
              </div>

              {atTab==='films' && (
                allTimeMovies.length===0 ? (
                  <div className="mv-empty">
                    <div className="mv-empty-icon"><Icon name="star" size={40} /></div>
                    <div className="mv-empty-ttl">Your all-time list is empty</div>
                    <div className="mv-empty-sub">Add a film and tick "Add to All Time list" to start building your favourites.</div>
                  </div>
                ) : <>
                  {/* Letterboxd banner — top 4 all-time */}
                  {allTimeMovies.length > 0 && (
                    <div className="mv-top4" style={{marginBottom:24}}>
                      {allTimeMovies.slice(0,4).map((movie,i)=>(
                        <div key={movie.id} className="mv-top4-item" onClick={()=>setModal({movie})}>
                          {movie.posterPath
                            ? <img className="mv-top4-poster" src={TMDB_IMG+movie.posterPath} alt={movie.title}/>
                            : <div className="mv-top4-poster-fb"><Icon name="film" size={30} /></div>}
                          <div className="mv-top4-overlay"/>
                          <div className="mv-top4-info">
                            <div className="mv-top4-rank">#{i+1}</div>
                            <div className="mv-top4-title">{movie.title}</div>
                            {movie.director && <div className="mv-top4-dir">{movie.director}</div>}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{fontSize:11,color:'var(--text3)',marginBottom:12}}>Drag to reorder (press and hold on touch) · Click a film to edit</div>
                  {/* Top 10 */}
                  <div style={{fontSize:11,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Top 10</div>
                  <div className="mv-rank-list" style={{maxWidth:680,marginBottom:24}}>
                    {allTimeMovies.slice(0,10).map((movie,i)=>(
                      <div key={movie.id}
                        className={`mv-rank-item ${dragId===movie.id?'dragging':''} ${dragOver===movie.id&&dragId!==movie.id?'drag-over':''}`}
                        draggable onDragStart={e=>onAtDragStart(e,movie.id)} onDragOver={e=>onAtDragOver(e,movie.id)}
                        onDrop={e=>onAtDrop(e,movie.id)} onDragEnd={()=>{setDragId(null);setDragOver(null);}}
                        onClick={()=>setModal({movie})}>
                        <div className={`mv-rank-num ${i<3?'top3':''}`}>{i+1}</div>
                        <div className="mv-rank-poster-sm"><Poster movie={movie}/></div>
                        <div className="mv-rank-info">
                          <div className="mv-rank-film-title">{movie.title}</div>
                          <div className="mv-rank-film-meta">{[movie.director, movie.releaseYear].filter(Boolean).join(' · ')}</div>
                        </div>
                        {movie.rating && <StarRating value={movie.rating} readOnly size={14}/>}
                      </div>
                    ))}
                  </div>
                  {/* Beyond top 10 */}
                  {allTimeMovies.length > 10 && (
                    <>
                      <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8,paddingTop:4,borderTop:'1px solid var(--border)'}}>Beyond the Top 10</div>
                      <div className="mv-rank-list" style={{maxWidth:680}}>
                        {allTimeMovies.slice(10).map((movie,i)=>(
                          <div key={movie.id}
                            className={`mv-rank-item ${dragId===movie.id?'dragging':''} ${dragOver===movie.id&&dragId!==movie.id?'drag-over':''}`}
                            draggable onDragStart={e=>onAtDragStart(e,movie.id)} onDragOver={e=>onAtDragOver(e,movie.id)}
                            onDrop={e=>onAtDrop(e,movie.id)} onDragEnd={()=>{setDragId(null);setDragOver(null);}}
                            onClick={()=>setModal({movie})}
                            style={{opacity:.75}}>
                            <div className="mv-rank-num" style={{fontSize:16,color:'var(--text3)'}}>{i+11}</div>
                            <div className="mv-rank-poster-sm"><Poster movie={movie}/></div>
                            <div className="mv-rank-info">
                              <div className="mv-rank-film-title">{movie.title}</div>
                              <div className="mv-rank-film-meta">{[movie.director, movie.releaseYear].filter(Boolean).join(' · ')}</div>
                            </div>
                            {movie.rating && <StarRating value={movie.rating} readOnly size={13}/>}
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </>
              )}

              {atTab==='directors' && (
                directors.length===0 ? (
                  <div className="mv-empty">
                    <div className="mv-empty-icon"><Icon name="film" size={40} /></div>
                    <div className="mv-empty-ttl">No directors yet</div>
                    <div className="mv-empty-sub">Add films with director names to your all-time list and they'll appear here.</div>
                  </div>
                ) : (
                  directors.map(([name, films])=>(
                    <div key={name} className="mv-dir-card">
                      <div className="mv-dir-name">
                        {name}
                        <span className="mv-dir-count">{films.length} film{films.length!==1?'s':''}</span>
                      </div>
                      <div className="mv-dir-films">
                        {[...films].sort((a,b)=>(a.allTimeRank||99)-(b.allTimeRank||99)).map(f=>(
                          <span key={f.id} className="mv-dir-film-pill" onClick={e=>{e.stopPropagation();setModal({movie:f});}}>
                            {f.title}{f.releaseYear?` (${f.releaseYear})`:''}
                          </span>
                        ))}
                      </div>
                    </div>
                  ))
                )
              )}

              {atTab==='stats' && (
                movies.length===0 ? (
                  <div className="mv-empty">
                    <div className="mv-empty-icon"><Icon name="chart" size={40} /></div>
                    <div className="mv-empty-ttl">No data yet</div>
                    <div className="mv-empty-sub">Add films across years to see your lifetime stats.</div>
                  </div>
                ) : (
                  <div className="mv-stats-section">{statsContent}</div>
                )
              )}
            </div>
          )}
        </div>
        </div>{/* /mv-main */}

        {/* MODAL */}
        {modal && (
          <MovieAddModal
            movie={modal==='add' ? null : modal.movie}
            tmdbKey={tmdbKey}
            defaultTrackYear={isSpecial ? new Date().getFullYear() : year}
            onSave={saveMovie}
            onDelete={deleteMovie}
            onClose={()=>setModal(null)}
          />
        )}
        {/* BULK ENRICH MODAL */}
        {enrichModal && (
          <BulkEnrichModal
            movies={movies}
            tmdbKey={tmdbKey}
            onApply={applyEnrichPatches}
            onClose={()=>setEnrichModal(false)}
          />
        )}
        {/* BULK ADD MODAL */}
        {bulkAddModal && (
          <BulkAddFilmsModal
            defaultYear={new Date().getFullYear()}
            existingMovies={movies}
            onSave={newMovies => {
              onUpdate(d => ({ ...d, movies: [...(d.movies || []), ...newMovies] }));
            }}
            onClose={()=>setBulkAddModal(false)}
          />
        )}
        {/* FIND DUPLICATES MODAL */}
        {dupesModal && (
          <FindDuplicatesModal
            noun="film"
            items={movies}
            renderMeta={m => [m.director, m.releaseYear, m.trackYear ? `tracked ${m.trackYear}` : null, m.rating ? `★${m.rating}` : null].filter(Boolean).join(' · ') || 'No details'}
            onDelete={id => onUpdate(d => ({ ...d, movies: d.movies.filter(m => m.id !== id) }))}
            onClose={()=>setDupesModal(false)}
          />
        )}
      </div>
    );
  }

  /* ── TV COMPONENTS ──────────────────────────────────────────── */

  function TVAddModal({ show, tmdbKey, onSave, onDelete, onClose }) {
    const isEdit = !!show;
    const [q, setQ] = React.useState('');
    const [results, setResults] = React.useState([]);
    const [searching, setSearching] = React.useState(false);
    const [loadingDetails, setLoadingDetails] = React.useState(false);
    const [searchErr, setSearchErr] = React.useState('');
    const [showSearch, setShowSearch] = React.useState(!!tmdbKey);
    const blank = { title:'', creator:'', genres:[], seasons:'', posterPath:'', tmdbId:null, overview:'', rating:null, notes:'', language:'', country:'', status:'plan', isAllTime:false, allTimeRank:null };
    const [form, setForm] = React.useState(isEdit ? { ...blank, ...show, genres:Array.isArray(show.genres)?show.genres:[] } : blank);
    const [genresStr, setGenresStr] = React.useState((form.genres||[]).join(', '));

    async function doSearch() {
      if (!q.trim()) return;
      if (!tmdbKey) { setSearchErr('Add your TMDB API key in Settings first.'); return; }
      setSearching(true); setSearchErr('');
      try { setResults((await tmdbTVSearch(q.trim(), tmdbKey)).slice(0,8)); }
      catch(e) { setSearchErr('Search failed — check your TMDB API key.'); }
      setSearching(false);
    }
    async function pickResult(r) {
      setLoadingDetails(true);
      let creator='', genres=[], seasons='', language='', country='';
      if (tmdbKey) {
        try {
          const d = await tmdbTVGetDetails(r.id, tmdbKey);
          creator = (d.created_by||[]).map(c=>c.name).join(', ');
          genres = (d.genres||[]).map(g=>g.name);
          seasons = d.number_of_seasons || '';
          language = d.original_language || r.original_language || '';
          country = (d.production_countries||[])[0]?.name || (d.origin_country||[])[0] || '';
        } catch(e) { language = r.original_language || ''; }
      } else { language = r.original_language || ''; }
      const yr = r.first_air_date ? r.first_air_date.slice(0,4) : '';
      setForm(f=>({...f, tmdbId:r.id, title:r.name||r.title||'', firstAired:yr, creator, genres, seasons, posterPath:r.poster_path||'', overview:r.overview||'', language, country}));
      setGenresStr(genres.join(', '));
      setLoadingDetails(false); setResults([]); setShowSearch(false);
    }
    function syncGenres(str) { setGenresStr(str); setForm(f=>({...f, genres:str.split(',').map(s=>s.trim()).filter(Boolean)})); }
    function save() {
      if (!form.title.trim()) return;
      onSave({ id:show?.id||uid(), ...form, genres:genresStr.split(',').map(s=>s.trim()).filter(Boolean) });
    }
    const statusOpt = TV_STATUS_OPTS.find(s=>s.id===form.status) || TV_STATUS_OPTS[0];
    return (
      <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal" style={{ maxWidth:520 }}>
          <div className="modal-hdr">
            <div className="modal-title">{isEdit?'Edit Show':'Add Show'}</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div>
            {tmdbKey && (
              <div style={{marginBottom:16}}>
                {!showSearch ? (
                  <span className="mv-manual-link" onClick={()=>setShowSearch(true)}>🔍 Search TMDB to auto-fill</span>
                ) : (
                  <>
                    <div className="mv-modal-search">
                      <input className="mv-search-in" placeholder="Search TV shows…" value={q} autoFocus
                        onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()} />
                      <button className="mv-search-btn" onClick={doSearch} disabled={searching}>{searching?'…':'Search'}</button>
                    </div>
                    {searchErr && <div style={{fontSize:12,color:'#e05252',marginBottom:8}}>{searchErr}</div>}
                    {loadingDetails && <div style={{fontSize:13,color:'var(--text2)',marginBottom:8}}>Fetching details…</div>}
                    {results.length > 0 && (
                      <div className="mv-results-list">
                        {results.map(r=>(
                          <div key={r.id} className="mv-result-row" onClick={()=>pickResult(r)}>
                            <div className="mv-result-poster">
                              {r.poster_path ? <img src={TMDB_IMG+r.poster_path} alt=""/> : <div style={{width:'100%',height:'100%',background:'var(--surface2)'}}/>}
                            </div>
                            <div>
                              <div className="mv-result-title">{r.name||r.title}</div>
                              <div className="mv-result-meta">{r.first_air_date?r.first_air_date.slice(0,4):'—'}{r.vote_average?` · ★ ${r.vote_average.toFixed(1)}`:''}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                    <span className="mv-manual-link" onClick={()=>{setShowSearch(false);setResults([]);}}>Hide search</span>
                  </>
                )}
              </div>
            )}
            <div className="mv-form-grid">
              <div className="mv-form-field full" style={{flexDirection:'row',gap:14,alignItems:'flex-start'}}>
                {form.posterPath && (
                  <div style={{width:70,height:105,borderRadius:8,overflow:'hidden',flexShrink:0}}>
                    <img src={TMDB_IMG+form.posterPath} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  </div>
                )}
                <div style={{flex:1,display:'flex',flexDirection:'column',gap:10}}>
                  <div className="mv-form-field">
                    <div className="mv-form-lbl">Title *</div>
                    <input className="mv-form-in" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Show title"/>
                  </div>
                  <div className="mv-form-field">
                    <div className="mv-form-lbl">Creator</div>
                    <input className="mv-form-in" value={form.creator||''} onChange={e=>setForm(f=>({...f,creator:e.target.value}))} placeholder="Creator / showrunner"/>
                  </div>
                </div>
              </div>
              <div className="mv-form-field">
                <div className="mv-form-lbl">Status</div>
                <select className="mv-form-in" value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>
                  {TV_STATUS_OPTS.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
              <div className="mv-form-field">
                <div className="mv-form-lbl">Seasons</div>
                <input className="mv-form-in" type="number" min="1" value={form.seasons||''} onChange={e=>setForm(f=>({...f,seasons:parseInt(e.target.value)||''}))} placeholder="e.g. 3"/>
              </div>
              <div className="mv-form-field full">
                <div className="mv-form-lbl">Genres (comma separated)</div>
                <input className="mv-form-in" value={genresStr} onChange={e=>syncGenres(e.target.value)} placeholder="Drama, Crime, Thriller"/>
              </div>
              <div className="mv-form-field">
                <div className="mv-form-lbl">My Rating</div>
                <div style={{paddingTop:6}}>
                  <StarRating value={form.rating} onChange={v=>setForm(f=>({...f,rating:v}))} size={24}/>
                  {form.rating && <div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>{form.rating} / 5</div>}
                </div>
              </div>
              <div className="mv-form-field">
                <div className="mv-form-lbl">Language</div>
                <input className="mv-form-in" value={form.language||''} onChange={e=>setForm(f=>({...f,language:e.target.value}))} placeholder="en, ko…"/>
              </div>
              <div className="mv-form-field full">
                <div className="mv-form-lbl">Notes</div>
                <textarea className="mv-form-in mv-form-ta" value={form.notes||''} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Thoughts, episodes watched, etc."/>
              </div>
              <div className="mv-form-field full">
                <label style={{ display:'flex', alignItems:'flex-start', gap:10, cursor:'pointer', padding:'10px 12px', background:'var(--surface2)', borderRadius:8, border:'1px solid var(--border)' }}>
                  <input type="checkbox" checked={form.isAllTime||false} onChange={e=>setForm(f=>({...f,isAllTime:e.target.checked}))} style={{ width:16, height:16, accentColor:'var(--accent)', flexShrink:0, marginTop:1 }} />
                  <div>
                    <div style={{ fontSize:13, fontWeight:600 }}>Add to All Time Rankings ⭐</div>
                    <div style={{ fontSize:11, color:'var(--text2)' }}>Include in your personal all-time favourites</div>
                  </div>
                </label>
              </div>
            </div>
          </div>
          <div className="modal-footer">
            <div className="modal-actions">
              {isEdit && onDelete && <button className="btn-del" style={{marginRight:'auto'}} onClick={()=>{onDelete(show.id);onClose();}}>Delete</button>}
              <button className="btn-cancel" onClick={onClose}>Cancel</button>
              <button className="btn-save" onClick={save} disabled={!form.title.trim()}>Save</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function BulkAddTVModal({ onSave, onClose, existingShows }) {
    const [text, setText]           = React.useState('');
    const [status, setStatus]       = React.useState('plan');
    const [skipDupes, setSkipDupes] = React.useState(true);

    const titles = text.split('\n').map(s => s.trim()).filter(Boolean);

    const existingTitlesLC = React.useMemo(()=>
      new Set((existingShows||[]).map(s=>s.title.trim().toLowerCase())),
      [existingShows]
    );

    const dupes = titles.filter(t => existingTitlesLC.has(t.toLowerCase()));
    const toAdd = skipDupes ? titles.filter(t => !existingTitlesLC.has(t.toLowerCase())) : titles;

    function handleSave() {
      if (!toAdd.length) return;
      const shows = toAdd.map(title => ({
        id: uid(),
        title,
        creator: '',
        genres: [],
        seasons: '',
        posterPath: '',
        tmdbId: null,
        overview: '',
        rating: null,
        notes: '',
        language: '',
        country: '',
        status,
        isAllTime: false,
        allTimeRank: null,
      }));
      onSave(shows);
      onClose();
    }

    const TV_STATUS_LABELS = { plan:'📋 Plan to Watch', watching:'▶️ Watching', completed:'✅ Completed', dropped:'🚫 Dropped' };

    return (
      <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal" style={{maxWidth:480}}>
          <div className="modal-hdr">
            <div className="modal-title">Bulk Add TV Shows</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div className="modal-body">
            <div className="fg full">
              <label>Show titles — one per line</label>
              <textarea
                autoFocus
                value={text}
                onChange={e=>setText(e.target.value)}
                placeholder={"The Wire\nBreaking Bad\nThe Bear\n..."}
                style={{minHeight:180,resize:'vertical',fontFamily:'inherit',fontSize:14,lineHeight:1.6,padding:'9px 12px',border:'1px solid var(--border)',borderRadius:8,background:'var(--surface2)',color:'var(--text)',width:'100%',boxSizing:'border-box'}}
              />
              {titles.length > 0 && (
                <div style={{fontSize:12,color:'var(--text3)',marginTop:4}}>{titles.length} title{titles.length!==1?'s':''} entered</div>
              )}
            </div>

            {/* Duplicate warning */}
            {dupes.length > 0 && (
              <div style={{background:'rgba(220,120,30,.12)',border:'1px solid rgba(220,120,30,.35)',borderRadius:8,padding:'10px 12px',marginTop:4}}>
                <div style={{fontSize:12,fontWeight:700,color:'#e07a20',marginBottom:6}}>⚠️ {dupes.length} already in your library</div>
                <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.7,maxHeight:80,overflowY:'auto'}}>
                  {dupes.map((t,i)=><span key={i} style={{display:'inline-block',background:'rgba(220,120,30,.15)',borderRadius:4,padding:'1px 6px',margin:'1px 3px 1px 0'}}>{t}</span>)}
                </div>
                <label style={{display:'flex',alignItems:'center',gap:6,marginTop:8,fontSize:12,cursor:'pointer',color:'var(--text)'}}>
                  <input type="checkbox" checked={skipDupes} onChange={e=>setSkipDupes(e.target.checked)} style={{accentColor:'var(--accent)'}}/>
                  Skip these duplicates
                </label>
              </div>
            )}

            <div className="fg full" style={{marginTop:4}}>
              <label>Status</label>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {Object.entries(TV_STATUS_LABELS).map(([v,l])=>(
                  <button key={v} onClick={()=>setStatus(v)}
                    style={{padding:'8px 10px',borderRadius:8,border:`1px solid ${status===v?'var(--accent)':'var(--border)'}`,background:status===v?'var(--accent-soft, var(--surface2))':'var(--surface)',color:status===v?'var(--accent)':'var(--text)',fontSize:12,fontWeight:600,cursor:'pointer',transition:'all .15s',textAlign:'left'}}>
                    {l}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="modal-footer">
            <div/>
            <div className="modal-actions">
              <button className="btn-cancel" onClick={onClose}>Cancel</button>
              <button className="btn-save" disabled={!toAdd.length} onClick={handleSave}>
                Add {toAdd.length > 0 ? `${toAdd.length} Show${toAdd.length!==1?'s':''}` : 'Shows'}
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function TVView({ tvData, onUpdate, tmdbKey }) {
    const [statusFilter, setStatusFilter] = React.useState('all');
    const [view, setView] = React.useState('library'); // 'library' | 'rankings'
    const [modal, setModal] = React.useState(null);
    const [bulkAddModal, setBulkAddModal] = React.useState(false);
    const [dupesModal, setDupesModal] = React.useState(false);
    const [dragId, setDragId] = React.useState(null);
    const [dragOver, setDragOver] = React.useState(null);

    const shows = tvData.shows || [];
    const allTimeShows = [...shows].filter(s=>s.isAllTime).sort((a,b)=>(a.allTimeRank||999)-(b.allTimeRank||999));
    const notRanked = shows.filter(s=>!s.isAllTime);
    const filteredShows = statusFilter==='all' ? shows : shows.filter(s=>s.status===statusFilter);

    function saveShow(s) {
      const exists = shows.find(x=>x.id===s.id);
      let final = {...s};
      // Assign allTimeRank when newly added to all-time
      if (s.isAllTime && !exists?.isAllTime) final.allTimeRank = allTimeShows.length + 1;
      if (!s.isAllTime) final.allTimeRank = null;
      onUpdate(d=>({ ...d, shows: exists ? d.shows.map(x=>x.id===s.id?final:x) : [...d.shows, final] }));
      setModal(null);
    }
    function deleteShow(id) { onUpdate(d=>({...d,shows:d.shows.filter(s=>s.id!==id)})); setModal(null); }

    function toggleAllTime(e, id) {
      e.stopPropagation();
      const show = shows.find(s=>s.id===id);
      if (!show) return;
      if (!show.isAllTime) {
        onUpdate(d=>({ ...d, shows: d.shows.map(s=>s.id===id?{...s,isAllTime:true,allTimeRank:allTimeShows.length+1}:s) }));
      } else {
        onUpdate(d=>{
          const updated = d.shows.map(s=>s.id===id?{...s,isAllTime:false,allTimeRank:null}:s);
          const compact = updated.filter(s=>s.isAllTime).sort((a,b)=>(a.allTimeRank||999)-(b.allTimeRank||999)).map((s,i)=>({...s,allTimeRank:i+1}));
          return {...d, shows:updated.map(s=>{const c=compact.find(x=>x.id===s.id);return c||s;})};
        });
      }
    }
    function onAtDragStart(e,id) { setDragId(id); e.dataTransfer.effectAllowed='move'; }
    function onAtDragOver(e,id) { e.preventDefault(); setDragOver(id); }
    function onAtDrop(e, targetId) {
      e.preventDefault();
      if (!dragId||dragId===targetId) { setDragId(null); setDragOver(null); return; }
      const list=[...allTimeShows];
      const di=list.findIndex(s=>s.id===dragId); const ti=list.findIndex(s=>s.id===targetId);
      if (di<0||ti<0) { setDragId(null); setDragOver(null); return; }
      const [item]=list.splice(di,1); list.splice(ti,0,item);
      const reranked=list.map((s,i)=>({...s,allTimeRank:i+1}));
      onUpdate(d=>({...d, shows:d.shows.map(s=>{const r=reranked.find(x=>x.id===s.id);return r||s;})}));
      setDragId(null); setDragOver(null);
    }

    function TVPoster({ show, className }) {
      if (show.posterPath) return <img src={TMDB_IMG+show.posterPath} alt={show.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>;
      return <div className={className||'tv-card-poster-fb'}>📺</div>;
    }
    function StatusBadge({ status }) {
      const opt = TV_STATUS_OPTS.find(s=>s.id===status);
      if (!opt) return null;
      return <span className="tv-status-badge" style={{color:opt.color,background:opt.bg}}>{opt.label}</span>;
    }

    const counts = {
      all: shows.length,
      watching: shows.filter(s=>s.status==='watching').length,
      completed: shows.filter(s=>s.status==='completed').length,
      plan: shows.filter(s=>s.status==='plan').length,
      dropped: shows.filter(s=>s.status==='dropped').length,
    };
    const ratedShows = shows.filter(s=>s.rating!=null);
    const avgRating = ratedShows.length ? (ratedShows.reduce((a,s)=>a+s.rating,0)/ratedShows.length).toFixed(1) : null;

    // Genre map for library card view — a show appears under every genre it belongs to
    const { genreMap, sortedGenres } = React.useMemo(() => {
      const map = {};
      for (const show of filteredShows) {
        const gs = show.genres && show.genres.length > 0 ? show.genres : ['Uncategorised'];
        for (const g of gs) {
          if (!map[g]) map[g] = [];
          if (!map[g].find(s=>s.id===show.id)) map[g].push(show);
        }
      }
      for (const g of Object.keys(map)) {
        map[g].sort((a,b) => {
          if (b.rating && a.rating) return b.rating - a.rating;
          if (b.rating) return 1; if (a.rating) return -1;
          return (a.title||'').localeCompare(b.title||'');
        });
      }
      const uncategorised = Object.keys(map).filter(k=>k==='Uncategorised');
      const rest = Object.keys(map).filter(k=>k!=='Uncategorised').sort((a,b)=>map[b].length-map[a].length);
      return { genreMap: map, sortedGenres: [...rest, ...uncategorised] };
    }, [filteredShows]);

    return (
      <div className="tv-wrap">
        <div className="tv-header">
          <div className="tv-view-tabs">
            <button className={`tv-vtab ${view==='library'?'active':''}`} onClick={()=>setView('library')}>Library</button>
            <button className={`tv-vtab ${view==='rankings'?'active':''}`} onClick={()=>setView('rankings')}>All Time</button>
          </div>
          {view === 'library' && (
            <div className="tv-status-tabs">
              <button className={`tv-stab ${statusFilter==='all'?'active':''}`} onClick={()=>setStatusFilter('all')}>All ({counts.all})</button>
              {TV_STATUS_OPTS.map(opt=>(
                counts[opt.id] > 0 && <button key={opt.id} className={`tv-stab ${statusFilter===opt.id?'active':''}`} onClick={()=>setStatusFilter(opt.id)}>{opt.label} ({counts[opt.id]})</button>
              ))}
            </div>
          )}
          <button className="ghost-btn tv-push" onClick={()=>setDupesModal(true)} title="Find duplicate shows"><Icon name="alert" size={15} /> Dupes</button>
          <button className="ghost-btn" onClick={()=>setBulkAddModal(true)}>+ Bulk Add</button>
          <button className="tv-add-btn" onClick={()=>setModal('add')}>+ Add Show</button>
        </div>

        {/* KPI strip */}
        {shows.length > 0 && (
          <div className="tv-kpi-strip">
            <div className="tv-kpi"><div className="tv-kpi-val">{counts.all}</div><div className="tv-kpi-lbl">Total Shows</div></div>
            {counts.watching > 0 && <div className="tv-kpi"><div className="tv-kpi-val" style={{color:'#4aac76'}}>{counts.watching}</div><div className="tv-kpi-lbl">Watching</div></div>}
            {counts.completed > 0 && <div className="tv-kpi"><div className="tv-kpi-val" style={{color:'#5b96e8'}}>{counts.completed}</div><div className="tv-kpi-lbl">Completed</div></div>}
            {counts.plan > 0 && <div className="tv-kpi"><div className="tv-kpi-val" style={{color:'#9070d8'}}>{counts.plan}</div><div className="tv-kpi-lbl">Plan to Watch</div></div>}
            {allTimeShows.length > 0 && <div className="tv-kpi"><div className="tv-kpi-val" style={{color:'var(--accent)'}}>{allTimeShows.length}</div><div className="tv-kpi-lbl">All Time</div></div>}
            {avgRating && <div className="tv-kpi"><div className="tv-kpi-val">{avgRating} ★</div><div className="tv-kpi-lbl">Avg Rating</div></div>}
          </div>
        )}

        <div className="tv-content">
          {shows.length === 0 ? (
            <div className="tv-empty">
              <div className="tv-empty-icon"><Icon name="tv" size={40} /></div>
              <div className="tv-empty-ttl">No shows tracked yet</div>
              <div className="tv-empty-sub">Add shows you're watching, have completed, or plan to watch.</div>
            </div>

          ) : view === 'library' ? (
            /* ── LIBRARY: cards grouped by genre ───────────────────── */
            filteredShows.length === 0 ? (
              <div className="tv-empty">
                <div className="tv-empty-icon"><Icon name="tv" size={40} /></div>
                <div className="tv-empty-ttl">No {TV_STATUS_OPTS.find(s=>s.id===statusFilter)?.label.toLowerCase()} shows</div>
                <div className="tv-empty-sub">Switch filter or add a new show.</div>
              </div>
            ) : sortedGenres.map(genre => (
              <div key={genre} className="tv-genre-section">
                <div className="tv-genre-hdr">
                  {genre}
                  <span className="tv-genre-count">{genreMap[genre].length}</span>
                </div>
                <div className="tv-card-grid">
                  {genreMap[genre].map(show => (
                    <div key={show.id} className="tv-card" onClick={()=>setModal({show})}>
                      <div className="tv-card-poster">
                        {show.posterPath
                          ? <img src={TMDB_IMG+show.posterPath} alt={show.title}/>
                          : <div className="tv-card-poster-fb">📺</div>}
                        {show.isAllTime && <div className="tv-at-badge"><Icon name="star" size={15} fill /></div>}
                      </div>
                      <div className="tv-card-body">
                        <div className="tv-card-title" title={show.title}>{show.title}</div>
                        <div className="tv-card-meta">{show.seasons ? `${show.seasons} season${show.seasons!==1?'s':''}` : show.creator || ''}</div>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:4}}>
                          <StatusBadge status={show.status}/>
                          {show.rating && <span style={{fontSize:10,color:'var(--text2)'}}>{show.rating}★</span>}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))

          ) : (
            /* ── ALL TIME RANKINGS ──────────────────────────────────── */
            allTimeShows.length === 0 ? (
              <div className="tv-empty">
                <div className="tv-empty-icon"><Icon name="star" size={40} /></div>
                <div className="tv-empty-ttl">Your all-time list is empty</div>
                <div className="tv-empty-sub">Edit a show and tick "Add to All Time Rankings" — or click ⭐ below on any show.</div>
              </div>
            ) : (
              <>
                {/* Top 4 poster banner */}
                {allTimeShows.length > 0 && (
                  <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.min(allTimeShows.length,4)},1fr)`,gap:8,marginBottom:24,maxWidth:560}}>
                    {allTimeShows.slice(0,4).map((show,i)=>(
                      <div key={show.id} style={{position:'relative',borderRadius:8,overflow:'hidden',cursor:'pointer',aspectRatio:'2/3'}} onClick={()=>setModal({show})}>
                        {show.posterPath
                          ? <img src={TMDB_IMG+show.posterPath} alt={show.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                          : <div style={{width:'100%',height:'100%',background:'var(--surface2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28}}>📺</div>}
                        <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 60%)'}}/>
                        <div style={{position:'absolute',bottom:8,left:8,right:8}}>
                          <div style={{fontSize:18,fontWeight:900,color:'var(--accent)',lineHeight:1}}>#{i+1}</div>
                          <div style={{fontSize:11,fontWeight:700,color:'#fff',lineHeight:1.3,marginTop:2}}>{show.title}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:12}}>Drag to reorder (press and hold on touch) · Click ⭐ to remove</div>
                <div className="tv-rank-list" style={{maxWidth:680,marginBottom:24}}>
                  {allTimeShows.map((show,i)=>(
                    <div key={show.id}
                      className={`tv-rank-item ${dragId===show.id?'dragging':''} ${dragOver===show.id&&dragId!==show.id?'drag-over':''}`}
                      draggable onDragStart={e=>onAtDragStart(e,show.id)} onDragOver={e=>onAtDragOver(e,show.id)}
                      onDrop={e=>onAtDrop(e,show.id)} onDragEnd={()=>{setDragId(null);setDragOver(null);}}
                      onClick={()=>setModal({show})}>
                      <div className={`tv-rank-num ${i<3?'top3':''}`}>{i+1}</div>
                      <div className="tv-poster-sm">
                        {show.posterPath ? <img src={TMDB_IMG+show.posterPath} alt={show.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/> : <div className="tv-poster-fb">📺</div>}
                      </div>
                      <div className="tv-info">
                        <div className="tv-title">{show.title}</div>
                        <div className="tv-meta">{[show.creator, show.seasons?`${show.seasons} season${show.seasons!==1?'s':''}`:null,(show.genres||[]).slice(0,2).join(' · ')].filter(Boolean).join(' · ')}</div>
                      </div>
                      <StatusBadge status={show.status}/>
                      {show.rating && <StarRating value={show.rating} readOnly size={14}/>}
                      <span title="Remove from all-time" style={{fontSize:16,cursor:'pointer',marginLeft:4,opacity:.7}} onClick={e=>toggleAllTime(e,show.id)}>⭐</span>
                    </div>
                  ))}
                </div>

                {/* Not yet in rankings */}
                {notRanked.length > 0 && (
                  <div className="tv-notranked-section">
                    <div className="tv-notranked-title">Not in rankings — click ⭐ to add</div>
                    <div className="tv-notranked-grid">
                      {notRanked.map(show=>(
                        <div key={show.id} className="tv-notranked-card" onClick={()=>setModal({show})}>
                          <div className="tv-card-poster">
                            {show.posterPath
                              ? <img src={TMDB_IMG+show.posterPath} alt={show.title}/>
                              : <div className="tv-card-poster-fb">📺</div>}
                            <div className="tv-notranked-add" onClick={e=>toggleAllTime(e,show.id)} title="Add to all-time rankings">⭐</div>
                          </div>
                          <div className="tv-card-body">
                            <div className="tv-card-title" title={show.title}>{show.title}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )
          )}
        </div>

        {modal && (
          <TVAddModal
            show={modal==='add' ? null : modal.show}
            tmdbKey={tmdbKey}
            onSave={saveShow}
            onDelete={deleteShow}
            onClose={()=>setModal(null)}
          />
        )}
        {bulkAddModal && (
          <BulkAddTVModal
            existingShows={shows}
            onSave={newShows => {
              onUpdate(d => ({ ...d, shows: [...(d.shows || []), ...newShows] }));
            }}
            onClose={()=>setBulkAddModal(false)}
          />
        )}
        {dupesModal && (
          <FindDuplicatesModal
            noun="show"
            items={shows}
            renderMeta={s => [s.creator, s.status, s.seasons ? `${s.seasons} season${s.seasons!==1?'s':''}` : null, s.rating ? `★${s.rating}` : null].filter(Boolean).join(' · ') || 'No details'}
            onDelete={id => onUpdate(d => ({ ...d, shows: d.shows.filter(s => s.id !== id) }))}
            onClose={()=>setDupesModal(false)}
          />
        )}
      </div>
    );
  }

  /* ── SETTINGS VIEW ───────────────────────────────────────────── */
  function SettingsView({ settings, onUpdate, fileStatus, fileName, hasFSA, onConnectExisting, onCreateNew, onDisconnect, gh, ghStatus, ghMsg, ghLast, onGhConnect, onGhSync, onGhResolve, onGhDisconnect, onDownloadBackup }) {
    const [ghForm, setGhForm] = useState({ repo:'', token:'', path:'data.json', branch:'main' });
    const [ghErr,  setGhErr]  = useState('');
    const [ghBusyUi, setGhBusyUi] = useState(false);
    async function submitGh() {
      setGhErr(''); setGhBusyUi(true);
      const repo = ghForm.repo.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { setGhErr('Enter the repo as owner/name, for example sidd/work-tracker-data'); setGhBusyUi(false); return; }
      if (!ghForm.token.trim()) { setGhErr('Paste your GitHub token.'); setGhBusyUi(false); return; }
      const err = await onGhConnect({ repo, token:ghForm.token.trim(), path:(ghForm.path||'data.json').trim(), branch:(ghForm.branch||'main').trim() });
      setGhBusyUi(false);
      if (err) setGhErr(err); else setGhForm(f => ({ ...f, token:'' }));
    }
    const [editing,     setEditing]     = useState(null);   // work cat id being edited
    const [editF,       setEditF]       = useState({});
    const [adding,      setAdding]      = useState(false);
    const [newP,        setNewP]        = useState({ label:'', color:'#3b82f6' });
    const [persEditing, setPersEditing] = useState(null);   // pers cat id being edited
    const [persEditF,   setPersEditF]   = useState({});
    const [persAdding,  setPersAdding]  = useState(false);
    const [newPers,     setNewPers]     = useState({ label:'', color:'#4aac76' });

    function startEdit(cat) { setEditing(cat.id); setEditF({ label:cat.label, color:cat.color }); }
    function saveEdit() {
      onUpdate(s => ({ ...s, workCats:s.workCats.map(c => c.id===editing ? { ...c, ...editF } : c) }));
      setEditing(null);
    }
    function deleteCat(id) {
      if (!window.confirm("Delete this project group? Tasks won't show on the board but remain saved.")) return;
      onUpdate(s => ({ ...s, workCats:s.workCats.filter(c => c.id!==id) }));
    }
    function addProject() {
      if (!newP.label.trim()) return;
      onUpdate(s => ({ ...s, workCats:[...s.workCats, { id:uid(), label:newP.label.trim(), color:newP.color, builtIn:false, hint:'' }] }));
      setNewP({ label:'', color:'#3b82f6' });
      setAdding(false);
    }
    // Personal group helpers
    function startPersEdit(cat) { setPersEditing(cat.id); setPersEditF({ label:cat.label, color:cat.color }); }
    function savePersEdit() {
      onUpdate(s => ({ ...s, persCats:(s.persCats||[]).map(c => c.id===persEditing ? { ...c, ...persEditF } : c) }));
      setPersEditing(null);
    }
    function deletePers(id) {
      if (!window.confirm("Delete this personal group? Tasks in this group will move to Uncategorised.")) return;
      onUpdate(s => ({ ...s, persCats:(s.persCats||[]).filter(c => c.id!==id) }));
    }
    function addPersGroup() {
      if (!newPers.label.trim()) return;
      onUpdate(s => ({ ...s, persCats:[...(s.persCats||[]), { id:uid(), label:newPers.label.trim(), color:newPers.color }] }));
      setNewPers({ label:'', color:'#4aac76' });
      setPersAdding(false);
    }
    return (
      <div className="settings-wrap">

        {/* DATA STORAGE */}
        <div className="settings-section">
          <div className="section-title">Data Storage</div>
          {!hasFSA ? (
            <div className="no-fsa-note">
              Your browser does not support file-based saving (File System Access API). Open this app in <strong>Chrome</strong> or <strong>Edge</strong> on a computer to save to a file. On any device you can use <strong>GitHub sync</strong> (below) to keep your data safe and in step across devices.
            </div>
          ) : fileStatus === 'connected' ? (
            <>
              <div className="storage-status">
                <span style={{ fontSize:26 }}>📁</span>
                <div className="storage-info">
                  <div className="storage-label">{fileName}</div>
                  <div className="storage-sub">Auto-saving to this file on your computer. Data is safe even if browser cache is cleared.</div>
                </div>
              </div>
              <div className="storage-btns">
                <button className="sbtn" onClick={onConnectExisting}>Switch file</button>
                <button className="sbtn danger" onClick={onDisconnect}>Disconnect</button>
              </div>
            </>
          ) : fileStatus === 'error' ? (
            <>
              <div className="storage-status" style={{ borderColor:'rgba(224,82,82,.3)' }}>
                <span style={{ fontSize:26 }}>!</span>
                <div className="storage-info">
                  <div className="storage-label" style={{ color:'#e05252' }}>Save error</div>
                  <div className="storage-sub">Could not write to the file. It may have been moved or deleted. Reconnect a file to continue.</div>
                </div>
              </div>
              <div className="storage-btns">

                <li>Create a <strong>private</strong> repo (e.g. <code>work-tracker-data</code>), with a README so it isn't empty.</li>
                <li>Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer">fine-grained token</a>: Repository access = <em>Only select repositories</em> → that repo; Permissions → <em>Contents: Read and write</em>.</li>
                <li>Paste the repo and token below, then connect.</li>
              </ol>
              <div className="gh-form">
                <div className="fg"><label>Repository</label><input type="text" placeholder="owner/work-tracker-data" value={ghForm.repo} onChange={e => setGhForm(f => ({ ...f, repo:e.target.value }))} autoCapitalize="off" autoCorrect="off" spellCheck="false" /></div>
                <div className="fg"><label>Access token</label><input type="password" placeholder="github_pat_…" value={ghForm.token} onChange={e => setGhForm(f => ({ ...f, token:e.target.value }))} autoComplete="off" /></div>
                <div className="gh-form-row">
                  <div className="fg"><label>File name</label><input type="text" value={ghForm.path} onChange={e => setGhForm(f => ({ ...f, path:e.target.value }))} autoCapitalize="off" spellCheck="false" /></div>
                  <div className="fg"><label>Branch</label><input type="text" value={ghForm.branch} onChange={e => setGhForm(f => ({ ...f, branch:e.target.value }))} autoCapitalize="off" spellCheck="false" /></div>

                {ghErr && <div className="gh-err">{ghErr}</div>}
                <div className="storage-btns"><button className="sbtn primary" disabled={ghBusyUi} onClick={submitGh}>{ghBusyUi ? 'Connecting…' : 'Connect'}</button></div>
              </div>
            </>
          ) : (
            <>
              <div className="storage-status">
                <span style={{ fontSize:26 }}>{ghStatus==='synced' ? '✅' : ghStatus==='conflict' ? '⚠️' : ghStatus==='syncing' || ghStatus==='idle' ? '🔄' : '❗'}</span>
                <div className="storage-info">
                  <div className="storage-label">{gh.repo}</div>

                    {(ghStatus==='syncing' || ghStatus==='idle') && 'Syncing…'}

                    <button className="sbtn primary" onClick={() => onGhResolve('remote')}>Use GitHub's version</button>
