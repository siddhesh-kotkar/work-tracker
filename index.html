  /* ── FILE PERSISTENCE (IndexedDB + File System Access API) ───── */
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('WorkTrackerDB', 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore('meta');
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbGet(key) {
    try {
      const db = await openDB();
      return new Promise(res => {
        const r = db.transaction('meta','readonly').objectStore('meta').get(key);
        r.onsuccess = () => res(r.result ?? null);
        r.onerror   = () => res(null);
      });
    } catch { return null; }
  }
  async function dbSet(key, val) {
    try {
      const db = await openDB();
      return new Promise(res => {
        const tx = db.transaction('meta','readwrite');
        tx.objectStore('meta').put(val, key);
        tx.oncomplete = res; tx.onerror = res;
      });
    } catch {}
  }
  async function dbDel(key) {
    try {
      const db = await openDB();
      return new Promise(res => {
        const tx = db.transaction('meta','readwrite');
        tx.objectStore('meta').delete(key);
        tx.oncomplete = res; tx.onerror = res;
      });
    } catch {}
  }
  async function readFileData(handle) {
    const file = await handle.getFile();
    const text = await file.text();
    if (!text.trim()) return null;
    return JSON.parse(text);
  }
  async function writeFileData(handle, data) {
    const w = await handle.createWritable();
    await w.write(JSON.stringify(data, null, 2));
    await w.close();
  }

  /* ── HELPERS ─────────────────────────────────────────────────── */
  function dlStatus(ds) {
    if (!ds) return null;
    const t = new Date(); t.setHours(0,0,0,0);
    const d = new Date(ds + 'T00:00:00');
    const diff = (d - t) / 86400000;
    return diff < 0 ? 'overdue' : diff <= 3 ? 'soon' : 'ok';
  }
  function fmtDate(ds) {
    if (!ds) return '';
    const [,m,d] = ds.split('-');
    const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${parseInt(d)} ${mn[parseInt(m)-1]}`;
  }
  function fmtDaysAgo(ts) {
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'yesterday';
    return `${days}d ago`;
  }
  const priObj  = id   => PRIORITIES.find(p => p.id === id);
  const catObj  = (id, cats) => (cats||[]).find(c => c.id === id);
  const ctryObj = code => COUNTRIES.find(c => c.code === code);
  const areaObj = (id, cats) => (cats || DEFAULT_PERS_CATS).find(a => a.id === id);
  function sortTasks(arr) {
    const p = { high:0, medium:1, low:2 };
    return [...arr].sort((a,b) => {
      if (p[a.priority] !== p[b.priority]) return p[a.priority] - p[b.priority];
      if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
      return a.deadline ? -1 : b.deadline ? 1 : b.createdAt - a.createdAt;
    });
  }
  function isStale(task, days) {
    if (!days) return false;
    const ref = task.updatedAt || task.createdAt || 0;
    return (Date.now() - ref) > days * 86400000;
  }
  function daysSince(task) {
    const ref = task.updatedAt || task.createdAt || Date.now();
    return Math.floor((Date.now() - ref) / 86400000);
  }
  function nextDeadline(task) {
    const rec = task.recurrence;
    if (!rec) return task.deadline || '';
    const today = new Date(); today.setHours(0,0,0,0);
    if (rec.type === 'monthly') {
      const dom = rec.dayOfMonth || 1;
      const d = new Date(today);
      d.setDate(dom);
      if (d <= today) d.setMonth(d.getMonth() + 1);
      return localDateStr(d);
    }
    const days = rec.type === 'weekly' ? 7 : rec.type === 'biweekly' ? 14
      : rec.unit === 'weeks'  ? (rec.interval||1) * 7
      : rec.unit === 'months' ? (rec.interval||1) * 30
      : (rec.interval||1);
    return localDateStr(new Date(today.getTime() + days * 86400000));
  }
  function migrateData(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const tasks = (raw.tasks || []).map(t => ({
      ...t,
      updatedAt:  t.updatedAt  || t.createdAt || Date.now(),
      client:     t.client    || '',
      country:    t.country   || '',
      priority:   t.priority  || 'medium',
      subtasks:   t.subtasks  || [],
    }));
    const settings = {
      theme: 'dark',
      workCats: [...DEFAULT_WORK_CATS],
      persCats: [...DEFAULT_PERS_CATS],
      staleThresholdDays: 7,
      accentColor: '#6470f5',
      darkBg: '#000000',
      fontId: 'system',
      tmdbKey: '',
      ...(raw.settings || {}),
    };
    if (!settings.workCats || !settings.workCats.length) settings.workCats = [...DEFAULT_WORK_CATS];
    if (!settings.persCats || !settings.persCats.length) settings.persCats = [...DEFAULT_PERS_CATS];
    let uniData = raw.uniData || makeDefaultUniData();
    // Restore gradcert if accidentally deleted (it's a separate qualification, always kept)
    if (uniData.semesters && !uniData.semesters.find(s => s.id === 'gradcert')) {
      const defaults = makeDefaultUniData();
      const gradcert = defaults.semesters.find(s => s.id === 'gradcert');
      if (gradcert) uniData = { ...uniData, semesters: [gradcert, ...uniData.semesters] };
    }
    // Ensure excludeFromGPA is set on gradcert
    uniData = { ...uniData, semesters: (uniData.semesters||[]).map(s =>
      s.id === 'gradcert' ? { ...s, excludeFromGPA: true } : s
    )};
    return { tasks, settings, uniData, movieData: raw.movieData || makeDefaultMovieData(), tvData: raw.tvData || makeDefaultTVData(), travelData: raw.travelData || makeDefaultTravelData(), budgetData: raw.budgetData || makeDefaultBudgetData(), timeBlocks: raw.timeBlocks || [] };
  }

                <button className="st-add-btn" onClick={addSubtask}>+</button>
              </div>
            </div>
          </div>
          <div className="modal-footer">
            <div>{task && <button className="btn-del" onClick={() => { onDelete(task.id); onClose(); }}>Delete Task</button>}</div>
            <div className="modal-actions">
              <button className="btn-cancel" onClick={onClose}>Cancel</button>
              <button className="btn-save" disabled={!f.title.trim()} onClick={() => {
                if (!f.title.trim()) return;
                onSave({ ...f, id:f.id||uid(), createdAt:f.createdAt||Date.now(), updatedAt:Date.now() });
              }}>{task ? 'Save Changes' : 'Add Task'}</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ── MATRIX CARD ─────────────────────────────────────────────── */
  function SubtaskMini({ task, onToggle, solid }) {
    const sts = task.subtasks || [];
    if (!sts.length) return null;
    const W = { borderTopColor: solid ? 'rgba(255,255,255,0.2)' : undefined };
    const boxS = done => solid ? { borderColor: done ? '#fff' : 'rgba(255,255,255,0.45)', background: done ? 'rgba(0,0,0,0.25)' : 'transparent', color:'#fff' } : {};
    const txtS = done => solid ? { color: done ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.88)' } : {};
    const progS = solid ? { background:'rgba(0,0,0,0.2)', border:'1px solid rgba(255,255,255,0.2)', color:'#fff' } : {};
    return (
      <div className="mcard-subtasks" style={W} onClick={e => e.stopPropagation()}>
        {sts.map(st => (
          <div key={st.id} className="mcard-st" onClick={() => onToggle(task.id, st.id)}>
            <div className={`st-box ${st.done?'checked':''}`} style={boxS(st.done)}>{st.done?'✓':''}</div>
            <span className={`st-txt ${st.done?'done':''}`} style={txtS(st.done)}>{st.text}</span>
          </div>
        ))}
        <span className="st-progress" style={progS}>{sts.filter(s=>s.done).length}/{sts.length} done</span>
      </div>
    );
  }

  function MCard({ task, workCats, staleThreshold, onEdit, onDelete, onMove, onToggleSubtask,
                   isDragging, onDragStart, onDragEnd, catOverride }) {
    const [menu, setMenu] = useState(null);
    const menuRef = useRef();
    const p     = priObj(task.priority);
    const cat   = catOverride || catObj(task.category, workCats);
    const dl    = dlStatus(task.deadline);
    const ctry  = ctryObj(task.country);
    const colIdx = STATUS_COLS.findIndex(s => s.id === task.column);
    const stale  = isStale(task, staleThreshold) && task.column !== 'done' && task.column !== 'onhold';
    const ds     = daysSince(task);
    useEffect(() => {
      if (!menu) return;
      const h = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenu(null); };
      document.addEventListener('mousedown', h);
      document.addEventListener('touchstart', h);
      return () => { document.removeEventListener('mousedown', h); document.removeEventListener('touchstart', h); };
    }, [menu]);
    return (
      <>
        <div className={`mcard ${cat?.color?'tinted':''} ${stale?'stale':''} ${isDragging?'is-dragging':''}`}
          draggable={true}
          style={cat?.color ? { '--cc':cat.color } : {}}
          onDragStart={e => { e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',task.id); onDragStart?.(); }}
          onDragEnd={() => onDragEnd?.()}
          onClick={() => onEdit(task)}
          onContextMenu={e => { e.preventDefault(); setMenu({ x:e.clientX, y:e.clientY }); }}>
          <div className="mcard-bar" style={{ background: cat?.color ? 'rgba(0,0,0,0.25)' : p?.color }} />
          <button className="mcard-more" aria-label="Task actions" onClick={e => { e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect(); setMenu({ x:Math.max(8,Math.min(r.right-170,window.innerWidth-180)), y:Math.min(r.bottom+4,window.innerHeight-320) }); }}>⋯</button>
          <div className="mcard-title" style={{ color: cat?.color ? '#fff' : undefined }}>{task.title}</div>
          <div className="mcard-meta">
            {task.client && <span className="mcard-client" style={{ color: cat?.color ? 'rgba(255,255,255,0.85)' : cat?.color||'#888' }}>{task.client}</span>}
            {ctry && <span className="mcard-flag" title={ctry.name}>{ctry.flag}</span>}
            {task.deadline && <span className={`mcard-dl ${dl==='overdue'?'dl-overdue':dl==='soon'?'dl-soon':''}`}
              style={{ color: cat?.color ? (dl==='overdue'?'#fca5a5':dl==='soon'?'#fde68a':'rgba(255,255,255,0.75)') : undefined }}>
              {dl==='overdue'?'! ':dl==='soon'?'~ ':''}{fmtDate(task.deadline)}</span>}
            {task.type && <span className="mcard-type" style={{ color: cat?.color ? 'rgba(255,255,255,0.6)' : undefined }}>· {task.type}</span>}
            <span className="mcard-pri" style={cat?.color
              ? { background:'rgba(0,0,0,0.2)', color:'#fff', border:'1px solid rgba(255,255,255,0.2)' }
              : { background:(p?.color||'#888')+'28', color:p?.color||'#888', border:`1px solid ${p?.color||'#888'}44` }}>
              {p?.label}
            </span>
            {stale && <span className="mcard-stale" style={cat?.color ? { background:'rgba(0,0,0,0.2)', border:'1px solid rgba(255,255,255,0.2)', color:'#fde68a' } : {}}>{ds}d stale</span>}
            {task.recurrence && <span className="mcard-recur" style={cat?.color ? { color:'rgba(255,255,255,0.7)' } : {}}>🔄{task.lastCompleted ? ` ${Math.floor((Date.now()-task.lastCompleted)/86400000)}d ago` : ''}</span>}
          </div>
          {task.notes && <div className="mcard-notes" style={cat?.color ? { color:'rgba(255,255,255,0.72)', borderTopColor:'rgba(255,255,255,0.18)' } : {}}>{task.notes}</div>}
          {onToggleSubtask && <SubtaskMini task={task} onToggle={onToggleSubtask} solid={false} />}
        </div>
        {menu && (
          <div className="ctx-menu" ref={menuRef} style={{ top:menu.y, left:menu.x }}>
            <div className="ctx-item" onClick={() => { onEdit(task); setMenu(null); }}>Edit</div>
            <div className="ctx-sep" />
            {STATUS_COLS.map((col,i) => i!==colIdx && (
              <div key={col.id} className="ctx-item" onClick={() => { onMove(task.id, col.id); setMenu(null); }}>Move to {col.label}</div>
            ))}
            <div className="ctx-sep" />
            <div className="ctx-item ctx-danger" onClick={() => { if(window.confirm('Delete this task?')) onDelete(task.id); setMenu(null); }}>Delete</div>
          </div>
        )}
      </>
    );
  }

  /* ── MATRIX VIEW ─────────────────────────────────────────────── */
  function MatrixView({ tasks, workCats, staleThreshold, onEdit, onAdd, onDelete, onMove, onToggleSubtask }) {
    const dragRef  = useRef(null); // { taskId }
    const [dragOver, setDragOver] = useState(null); // `${catId}-${colId}`
    const [draggingId, setDraggingId] = useState(null);
    const [collapsed, setCollapsed] = useState({ done:true });
    const toggleCol = id => setCollapsed(c => ({ ...c, [id]:!c[id] }));

    return (
      <div className="matrix-wrap">
        <div className="matrix">
          <div className="matrix-hdr">
            <div className="mhdr-corner">Group</div>
            {STATUS_COLS.map(col => (
              <div key={col.id} className="mhdr-col" style={{ borderTopColor:col.color }}>
                <div className="mhdr-dot" style={{ background:col.color }} />
                <div className="mhdr-label">{col.label}</div>
                <div className="mhdr-count">{tasks.filter(t=>t.column===col.id).length}</div>
                <button className="col-collapse-btn" title={collapsed[col.id]?'Expand':'Collapse'} onClick={() => toggleCol(col.id)}>{collapsed[col.id]?'▶':'▼'}</button>
              </div>
            ))}
          </div>
          {workCats.map(cat => {
            const catTasks = sortTasks(tasks.filter(t => t.category===cat.id));
            const active   = catTasks.filter(t => t.column!=='done' && t.column!=='onhold').length;
            return (
              <div key={cat.id} className="matrix-row">
                <div className="cat-label-cell" style={{ borderLeftColor:cat.color }}>
                  <div className="cat-name">{cat.label}</div>
                  <span className="cat-badge" style={{ background:cat.color+'22', color:cat.color, border:`1px solid ${cat.color}44` }}>{active} active</span>
                  {cat.hint && <div className="cat-hint">{cat.hint}</div>}
                  <button className="cat-add-inline" onClick={() => onAdd(cat.id,'todo')}>+ Add Task</button>
                </div>
                {STATUS_COLS.map(col => {
                  const cellKey   = `${cat.id}-${col.id}`;
                  const cellTasks = catTasks.filter(t => t.column===col.id);
                  const isOver    = dragOver === cellKey;
                  const isCollapsed = !!collapsed[col.id];
                  if (isCollapsed) return (
                    <div key={col.id} data-col={col.label} className={`task-cell collapsed ${col.id==='done'?'cell-done':''} ${col.id==='onhold'?'cell-onhold':''}`}
                      onClick={() => toggleCol(col.id)}>
                      <span className="cell-collapsed-count">{cellTasks.length > 0 ? `${cellTasks.length} task${cellTasks.length!==1?'s':''}` : 'Empty'}</span>
                      <span style={{ fontSize:11, color:'var(--text3)' }}>▶ expand</span>
                    </div>
                  );
                  return (
                    <div key={col.id} data-col={col.label}
                      className={`task-cell ${col.id==='done'?'cell-done':''} ${col.id==='onhold'?'cell-onhold':''} ${isOver?'drag-over':''}`}
                      onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; setDragOver(cellKey); }}
                      onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                      onDrop={e => {
                        e.preventDefault();
                        setDragOver(null);
                        if (!dragRef.current) return;
                        onMove(dragRef.current.taskId, col.id, cat.id);
                        dragRef.current = null; setDraggingId(null);
                      }}>
                      {cellTasks.length===0 && !isOver && <div className="cell-empty">Empty</div>}
                      {cellTasks.map(task => (
                        <MCard key={task.id} task={task} workCats={workCats} staleThreshold={staleThreshold}
                          onEdit={onEdit} onDelete={onDelete} onMove={onMove} onToggleSubtask={onToggleSubtask}
                          isDragging={draggingId===task.id}
                          onDragStart={() => { dragRef.current = { taskId:task.id }; setDraggingId(task.id); }}
                          onDragEnd={() => { dragRef.current=null; setDraggingId(null); setDragOver(null); }} />
                      ))}
                      <button className="cell-add" onClick={() => onAdd(cat.id, col.id)}>+ Add</button>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  /* ── PRIORITY ROW ────────────────────────────────────────────── */
  function PriRow({ task, workCats, staleThreshold, onEdit, onMove }) {
    const p    = priObj(task.priority);
    const cat  = catObj(task.category, workCats);
    const dl   = dlStatus(task.deadline);
    const ctry = ctryObj(task.country);
    const stale = isStale(task, staleThreshold) && task.column !== 'done' && task.column !== 'onhold';
    const ds = daysSince(task);
    return (
      <div className={`pri-row ${stale?'row-stale':''}`} onClick={() => onEdit(task)}>
        <div className="row-pbar" style={{ background:p?.color }} />
        <div className="row-cat" style={{ background:cat?.color+'20'||'#88888820', color:cat?.color||'#888', border:`1px solid ${cat?.color||'#888'}44` }}>{cat?.label||'—'}</div>
        <div className="row-title">{task.title}</div>
        {task.client && <div className="row-client">· {task.client}</div>}
        {ctry && <span className="row-flag">{ctry.flag}</span>}
        {task.deadline && <div className={`row-dl ${dl==='overdue'?'dl-overdue':dl==='soon'?'dl-soon':''}`}>{dl==='overdue'?'! ':dl==='soon'?'~ ':''}{fmtDate(task.deadline)}</div>}
        {(task.subtasks||[]).length > 0 && (
          <span style={{ fontSize:11, background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:8, padding:'2px 7px', color:'var(--text2)', fontWeight:600 }}>
            {(task.subtasks||[]).filter(s=>s.done).length}/{task.subtasks.length} ✓
          </span>
        )}
        {stale
          ? <span className="row-stale-badge" title={`Not updated in ${ds} days`}>{ds}d stale</span>
          : <span className="row-updated">Updated {fmtDaysAgo(task.updatedAt||task.createdAt||Date.now())}</span>
        }
        <select className="row-status" value={task.column} onClick={e => e.stopPropagation()} onChange={e => { e.stopPropagation(); onMove(task.id, e.target.value); }}>
          {STATUS_COLS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
      </div>
    );
  }

  /* ── PRIORITY VIEW ───────────────────────────────────────────── */
  function PriorityView({ tasks, workCats, staleThreshold, onEdit, onMove }) {
    const byDl = arr => [...arr].sort((a,b) => {
      if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
      return a.deadline ? -1 : b.deadline ? 1 : b.createdAt - a.createdAt;
    });
    const active = tasks.filter(t => t.column !== 'done');
    const done   = tasks.filter(t => t.column === 'done');
    function Section({ label, color, items }) {
      if (!items.length) return null;
      const staleCount = items.filter(t => isStale(t, staleThreshold)).length;
      return (
        <div>
          <div className="pri-section-hdr" style={{ borderColor:color+'60' }}>
            <div className="pri-dot" style={{ background:color }} />
            <div className="pri-lbl" style={{ color }}>{label}</div>
            {staleCount > 0 && <span style={{ fontSize:11, color:'#c98a10', background:'rgba(201,138,16,.12)', border:'1px solid rgba(201,138,16,.3)', borderRadius:8, padding:'2px 8px' }}>{staleCount} stale</span>}
            <div className="pri-cnt">{items.length}</div>
          </div>
          <div className="pri-list">
            {byDl(items).map(t => <PriRow key={t.id} task={t} workCats={workCats} staleThreshold={staleThreshold} onEdit={onEdit} onMove={onMove} />)}
          </div>
        </div>
      );
    }
    return (
      <div className="pri-wrap">
        <Section label="HIGH PRIORITY" color="#e05252" items={active.filter(t=>t.priority==='high')} />
        <Section label="MEDIUM" color="#c98a10" items={active.filter(t=>t.priority==='medium')} />
        <Section label="LOW" color="#4aac76" items={active.filter(t=>t.priority==='low')} />
        {done.length > 0 && (
          <details>
            <summary className="done-toggle">Completed ({done.length})</summary>
            <div className="pri-list" style={{ marginTop:8, opacity:.55 }}>
              {byDl(done).map(t => <PriRow key={t.id} task={t} workCats={workCats} staleThreshold={staleThreshold} onEdit={onEdit} onMove={onMove} />)}
            </div>
          </details>
        )}
      </div>
    );
  }

  /* ── PERSONAL KANBAN ─────────────────────────────────────────── */
  function PersonalMatrixView({ tasks, persCats, staleThreshold, onEdit, onDelete, onAdd, onMove, onToggleSubtask }) {
    const dragRef    = useRef(null);
    const [dragOver, setDragOver]   = useState(null); // `${catId}-${colId}`
    const [draggingId, setDraggingId] = useState(null);
    const [collapsed, setCollapsed] = useState({ done:true });
    const toggleCol = id => setCollapsed(c => ({ ...c, [id]:!c[id] }));

    // Build rows: each persCat row + an Uncategorised row for tasks with no/unknown area
    const catIds = new Set(persCats.map(c => c.id));
    const uncatTasks = tasks.filter(t => !t.personalArea || !catIds.has(t.personalArea));
    const rows = [
      ...persCats.map(cat => ({ cat, rowTasks: sortTasks(tasks.filter(t => t.personalArea === cat.id)) })),
      ...(uncatTasks.length > 0 ? [{ cat:{ id:'__uncat__', label:'Uncategorised', color:'#64748b' }, rowTasks: sortTasks(uncatTasks) }] : []),
    ];

    return (
      <div className="matrix-wrap">
        <div className="matrix">
          {/* Header */}
          <div className="matrix-hdr">
            <div className="mhdr-corner">Group</div>
            {STATUS_COLS.map(col => (
              <div key={col.id} className="mhdr-col" style={{ borderTopColor:col.color }}>
                <div className="mhdr-dot" style={{ background:col.color }} />
                <div className="mhdr-label">{col.label}</div>
                <div className="mhdr-count">{tasks.filter(t=>t.column===col.id).length}</div>
                <button className="col-collapse-btn" title={collapsed[col.id]?'Expand':'Collapse'} onClick={() => toggleCol(col.id)}>{collapsed[col.id]?'▶':'▼'}</button>
              </div>
            ))}
          </div>
          {/* Rows */}
          {rows.map(({ cat, rowTasks }) => {
            const active = rowTasks.filter(t => t.column!=='done' && t.column!=='onhold').length;
            return (
              <div key={cat.id} className="matrix-row">
                <div className="cat-label-cell" style={{ borderLeftColor:cat.color }}>
                  <div className="cat-name">{cat.label}</div>
                  <span className="cat-badge" style={{ background:cat.color+'22', color:cat.color, border:`1px solid ${cat.color}44` }}>{active} active</span>
                  {cat.id !== '__uncat__' && (
                    <button className="cat-add-inline" onClick={() => onAdd(cat.id,'todo')}>+ Add Task</button>
                  )}
                </div>
                {STATUS_COLS.map(col => {
                  const cellKey   = `${cat.id}-${col.id}`;
                  const cellTasks = sortTasks(rowTasks.filter(t => t.column===col.id));
                  const isOver    = dragOver === cellKey;
                  const isCollapsed = !!collapsed[col.id];
                  if (isCollapsed) return (
                    <div key={col.id} data-col={col.label} className={`task-cell collapsed ${col.id==='done'?'cell-done':''} ${col.id==='onhold'?'cell-onhold':''}`}
                      onClick={() => toggleCol(col.id)}>
                      <span className="cell-collapsed-count">{cellTasks.length > 0 ? `${cellTasks.length} task${cellTasks.length!==1?'s':''}` : 'Empty'}</span>
                      <span style={{ fontSize:11, color:'var(--text3)' }}>▶ expand</span>
                    </div>
                  );
                  return (
                    <div key={col.id} data-col={col.label}
                      className={`task-cell ${col.id==='done'?'cell-done':''} ${col.id==='onhold'?'cell-onhold':''} ${isOver?'drag-over':''}`}
                      onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; setDragOver(cellKey); }}
                      onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                      onDrop={e => {
                        e.preventDefault();
                        setDragOver(null);
                        if (!dragRef.current) return;
                        const newArea = cat.id === '__uncat__' ? undefined : cat.id;
                        onMove(dragRef.current.taskId, col.id, undefined, newArea);
                        dragRef.current = null; setDraggingId(null);
                      }}>
                      {cellTasks.length===0 && !isOver && <div className="cell-empty">Empty</div>}
                      {cellTasks.map(task => (
                        <MCard key={task.id} task={task} workCats={[]} staleThreshold={staleThreshold}
                          onEdit={onEdit} onDelete={onDelete} onMove={onMove} onToggleSubtask={onToggleSubtask}
                          isDragging={draggingId===task.id}
                          catOverride={cat}
                          onDragStart={() => { dragRef.current = { taskId:task.id }; setDraggingId(task.id); }}
                          onDragEnd={() => { dragRef.current=null; setDraggingId(null); setDragOver(null); }} />
                      ))}
                      {cat.id !== '__uncat__' && (
                        <button className="cell-add" onClick={() => onAdd(cat.id, col.id)}>+ Add</button>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  /* ── CALENDAR VIEW ───────────────────────────────────────────── */
  // Format a Date object as YYYY-MM-DD in LOCAL time (not UTC)
  function localDateStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function CalendarView({ tasks, workCats, persCats, uniData, timeBlocks, onEdit, onAdd, onEditUni, onAddBlock, onEditBlock }) {
    const today = new Date();
    const todayStr = localDateStr(today);

    const [calView,   setCalView]   = useState('month'); // 'month' | 'week'
    const [year,      setYear]      = useState(today.getFullYear());
    const [month,     setMonth]     = useState(today.getMonth());
    const [showNoDl,  setShowNoDl]  = useState(false);
    const [selDay,    setSelDay]    = useState(() => localDateStr(new Date()));
    const timeGridRef = React.useRef(null);

    // No auto-scroll needed — time grid is sized to fit without scrolling
    const [weekStart, setWeekStart] = useState(() => {
      const d = new Date(today);
      d.setDate(d.getDate() - d.getDay()); // back to Sunday
      d.setHours(0,0,0,0);
      return d;
    });

    const MONTHS_LONG  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const WEEKDAYS     = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // Flatten uni assessments into calendar-compatible objects
    const uniEvents = useMemo(() => {
      const evts = [];
      for (const sem of (uniData?.semesters || [])) {
        for (const subj of (sem.subjects || [])) {
          for (const a of (subj.assessments || [])) {
            evts.push({
              ...a, isUni:true,
              subjectCode: subj.code, subjectName: subj.name,
              semId: sem.id, subjId: subj.id,
              _semLabel: sem.label,
            });
          }
        }
      }
      return evts;
    }, [uniData]);

    // Group all tasks + uni assessments with deadlines by date string
    const tasksByDate = useMemo(() => {
      const map = {};
      tasks.filter(t => t.deadline).forEach(t => {
        if (!map[t.deadline]) map[t.deadline] = [];
        map[t.deadline].push(t);
      });
      uniEvents.filter(a => a.deadline).forEach(a => {
        if (!map[a.deadline]) map[a.deadline] = [];
        map[a.deadline].push(a);
      });
      return map;
    }, [tasks, uniEvents]);

    // Group time blocks by date
    const blocksByDate = useMemo(() => {
      const map = {};
      (timeBlocks || []).forEach(b => {
        if (!b.date) return;
        if (!map[b.date]) map[b.date] = [];
        map[b.date].push({ ...b, _isBlock: true });
      });
      Object.values(map).forEach(arr => arr.sort((a,b) => a.startTime.localeCompare(b.startTime)));
      return map;
    }, [timeBlocks]);

    const noDeadline = [
      ...tasks.filter(t => !t.deadline && t.column !== 'done'),
      ...uniEvents.filter(a => !a.deadline && a.plannerStatus !== 'graded'),
    ];

    // Shared chip renderer — handles work, personal, and uni assessments
    const UNI_CAL_COLOR = '#9070d8'; // violet
    function TaskChip({ t, full }) {
      // ── UNI ASSESSMENT ──
      if (t.isUni) {
        const g = utsGrade(t.score !== null && t.score !== undefined ? t.score : null, null);
        const planStat = UNI_PLAN_COLS.find(c => c.id === t.plannerStatus);
        if (full) {
          return (
            <div className="week-evt tint" style={{ '--cc':UNI_CAL_COLOR }}
              onClick={() => onEditUni?.(t.semId, t.subjId, t)}>
              <div className="week-evt-title" style={{ color:'#fff' }}>
                <span style={{ opacity:.65, fontSize:10, marginRight:3 }}>🎓</span>{t.name}
              </div>
              <div className="week-evt-meta">{t.subjectCode} · {t.weight}% weighting</div>
              <div className="week-evt-meta">
                {planStat?.label}
                {g ? ` · ${g.label}` : ''}
              </div>
            </div>
          );
        }
        return (
          <div className="cal-evt tint"
            style={{ '--cc':UNI_CAL_COLOR }}
            onClick={() => onEditUni?.(t.semId, t.subjId, t)}
            title={`${t.subjectCode} — ${t.name} (${t.weight}%)`}>
            <span style={{ opacity:.65, marginRight:3, fontSize:9 }}>🎓</span>
            {t.subjectCode} · {t.name}
          </div>
        );
      }
      // ── WORK / PERSONAL ──
      const cat  = catObj(t.category, workCats);
      const area = areaObj(t.personalArea, persCats);
      const col  = t.isPersonal ? (area?.color || '#94a3b8') : (cat?.color || '#5b6af0');
      const p    = priObj(t.priority);
      const stat = STATUS_COLS.find(s => s.id === t.column);
      if (full) {
        return (
          <div className="week-evt tint" style={{ '--cc':col }} onClick={() => onEdit(t)}>
            <div className="week-evt-title">
              {t.isPersonal && <span style={{ opacity:.7, fontSize:10, marginRight:3 }}>P</span>}
              {t.title}
            </div>
            {t.client && <div className="week-evt-meta">{t.client}</div>}
            <div className="week-evt-meta">
              {p?.label} · {stat?.label || ''}
              {isStale(t, 7) ? ' · stale' : ''}
            </div>
          </div>
        );
      }
      return (
        <div className="cal-evt tint"
          style={{ '--cc':col }}
          onClick={() => onEdit(t)}
          title={`${t.title}${t.client ? ' — '+t.client : ''}`}>
          {t.isPersonal && <span style={{ opacity:.7, marginRight:3, fontSize:10 }}>P</span>}
          {t.title}
        </div>
      );
    }

    // ── BLOCK CHIP RENDERER ────────────────────────────────────────
    function BlockChip({ b, full }) {
      const fmtTime = t => { const [h,m]=t.split(':'); const hr=parseInt(h); return `${hr>12?hr-12:hr||12}:${m}${hr>=12?'pm':'am'}`; };
      if (full) {
        return (
          <div className="tb-evt tint" style={{'--cc':b.color}} onClick={()=>onEditBlock?.(b)}>
            <div className="tb-evt-time">{fmtTime(b.startTime)} – {fmtTime(b.endTime)}</div>
            <div className="tb-evt-title">{b.title}</div>
            {b.notes && <div className="tb-evt-notes">{b.notes}</div>}
          </div>
        );
      }
      return (
        <div className="tb-chip tint" style={{'--cc':b.color}} onClick={()=>onEditBlock?.(b)}
          title={`${fmtTime(b.startTime)}–${fmtTime(b.endTime)}: ${b.title}`}>
          {b.title}
        </div>
      );
    }

    // ── MONTH VIEW ─────────────────────────────────────────────────
    const firstDOW    = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrev  = new Date(year, month, 0).getDate();
    const monthCells  = [];
    for (let i = firstDOW - 1; i >= 0; i--)
      monthCells.push({ day: daysInPrev - i, current: false, dateStr: null });
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      monthCells.push({ day: d, current: true, dateStr });
    }
    while (monthCells.length < 42)
      monthCells.push({ day: monthCells.length - firstDOW - daysInMonth + 1, current: false, dateStr: null });

    function prevMonth() { if (month===0) { setYear(y=>y-1); setMonth(11); } else setMonth(m=>m-1); }
    function nextMonth() { if (month===11) { setYear(y=>y+1); setMonth(0);  } else setMonth(m=>m+1); }

    // ── WEEK VIEW ──────────────────────────────────────────────────
    const weekDays = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(weekStart);
      d.setDate(d.getDate() + i);
      const dateStr = localDateStr(d);
      return { date: d, dateStr, dayName: WEEKDAYS[i], dayNum: d.getDate(), monthIdx: d.getMonth() };
    });

    function prevWeek() { setWeekStart(d => { const nd = new Date(d); nd.setDate(nd.getDate()-7); return nd; }); }
    function nextWeek() { setWeekStart(d => { const nd = new Date(d); nd.setDate(nd.getDate()+7); return nd; }); }
    function thisWeek() {
      const d = new Date(today);
      d.setDate(d.getDate() - d.getDay());
      d.setHours(0,0,0,0);
      setWeekStart(d);
    }

    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const weekLabel = weekStart.getMonth() === weekEnd.getMonth()
      ? `${MONTHS_SHORT[weekStart.getMonth()]} ${weekStart.getDate()} – ${weekEnd.getDate()}, ${weekEnd.getFullYear()}`
      : `${MONTHS_SHORT[weekStart.getMonth()]} ${weekStart.getDate()} – ${MONTHS_SHORT[weekEnd.getMonth()]} ${weekEnd.getDate()}, ${weekEnd.getFullYear()}`;

    return (
      <div className="cal-wrap">
        {/* HEADER */}
        <div className="cal-hdr">
          <button className="cal-nav-btn" onClick={calView==='month' ? prevMonth : prevWeek}>&lt;</button>
          <div className="cal-month-title">
            {calView === 'month' ? `${MONTHS_LONG[month]} ${year}` : weekLabel}
          </div>
          <button className="cal-nav-btn" onClick={calView==='month' ? nextMonth : nextWeek}>&gt;</button>
          <button className="cal-today-btn" onClick={() => {
            if (calView==='month') { setMonth(today.getMonth()); setYear(today.getFullYear()); }
            else thisWeek();
          }}>{calView==='month' ? 'Today' : 'This week'}</button>
          <button className="cal-block-btn" onClick={() => onAddBlock?.(todayStr)}><Icon name="clock" size={15} /> Block time</button>
          <div className="cal-view-toggle">
            <button className={`cal-vtab ${calView==='month'?'active':''}`} onClick={() => setCalView('month')}>Month</button>
            <button className={`cal-vtab ${calView==='week'?'active':''}`}  onClick={() => setCalView('week')}>Week</button>
          </div>
        </div>

        {/* MONTH VIEW */}
        {calView === 'month' && (
          <div className="cal-grid">
            {WEEKDAYS.map(d => <div key={d} className="cal-wday">{d}</div>)}
            {monthCells.map((cell, i) => {
              const dayTasks  = cell.dateStr ? (tasksByDate[cell.dateStr]  || []) : [];
              const dayBlocks = cell.dateStr ? (blocksByDate[cell.dateStr] || []) : [];
              const isToday   = cell.dateStr === todayStr;
              const isPast    = cell.current && cell.dateStr && cell.dateStr < todayStr;
              const totalItems = dayTasks.length + dayBlocks.length;
              const showItems  = [...dayBlocks, ...dayTasks].slice(0, 3);
              return (
                <div key={i} className={`cal-cell ${!cell.current?'cal-dim':''} ${isToday?'cal-is-today':''} ${isPast?'cal-past':''} ${cell.dateStr && cell.dateStr===selDay?'cal-sel':''}`}
                  onClick={() => cell.dateStr && setSelDay(cell.dateStr)}>
                  <div className={`cal-day-n ${isToday?'cal-today-n':''}`}>{cell.day}</div>
                  {showItems.map(t => t._isBlock
                    ? <BlockChip key={t.id} b={t} full={false} />
                    : <TaskChip  key={t.id} t={t} full={false} />
                  )}
                  {totalItems > 3 && <div className="cal-more">+{totalItems - 3} more</div>}
                  {cell.current && <button className="tb-add-day" onClick={() => onAddBlock?.(cell.dateStr)} title="Block time"><Icon name="clock" size={13} /></button>}
                  {cell.current && <button className="cal-add-day" onClick={() => onAdd(cell.dateStr)} title="Add task">+</button>}
                </div>
              );
            })}
          </div>
        )}

        {/* DAY AGENDA (phone: month cells collapse to dots, tap a day to read it here) */}
        {calView === 'month' && (() => {
          const dayTasks  = tasksByDate[selDay]  || [];
          const dayBlocks = blocksByDate[selDay] || [];
          const d = new Date(selDay + 'T00:00:00');
          return (
            <div className="cal-agenda">
              <div className="cal-agenda-hdr">
                <div className="cal-agenda-title">{WEEKDAYS[d.getDay()]} {d.getDate()} {MONTHS_LONG[d.getMonth()]}</div>
                <button className="cal-today-btn" onClick={() => onAddBlock?.(selDay)}><Icon name="clock" size={15} /> Block</button>
                <button className="cal-today-btn" onClick={() => onAdd(selDay)}>+ Task</button>
              </div>
              {dayTasks.length + dayBlocks.length === 0 && <div className="cal-agenda-empty">Nothing scheduled</div>}
              <div className="cal-agenda-list">
                {dayBlocks.map(b => <BlockChip key={b.id} b={b} full={true} />)}
                {dayTasks.map(t => <TaskChip key={t.id} t={t} full={true} />)}
              </div>
            </div>
          );
        })()}

        {/* TIME-GRID WEEK VIEW */}
        {calView === 'week' && (() => {
          const HOUR_START = 6;
          const HOUR_END   = 23;
          const HOUR_H     = 36; // px per hour — compact to fit full day without scrolling
          const TOTAL_H    = (HOUR_END - HOUR_START) * HOUR_H;
          const hours      = Array.from({length: HOUR_END - HOUR_START + 1}, (_,i) => HOUR_START + i);
          const GUTTER_W   = 52;
          const gridCols   = `${GUTTER_W}px repeat(7, 1fr)`;

          function timeToY(t) {
            const [h,m] = t.split(':').map(Number);
            return (h - HOUR_START) * HOUR_H + (m / 60) * HOUR_H;
          }
          function fmtHour(h) {
            if (h === 0) return '12am';
            if (h === 12) return '12pm';
            return h > 12 ? `${h-12}pm` : `${h}am`;
          }
          function fmtT(t) {
            const [h,m] = t.split(':').map(Number);
            const hr = h > 12 ? h-12 : h===0?12:h;
            return `${hr}:${String(m).padStart(2,'0')}${h>=12?'pm':'am'}`;
          }

          const nowH    = today.getHours();
          const nowM    = today.getMinutes();
          const nowY    = (nowH - HOUR_START) * HOUR_H + (nowM / 60) * HOUR_H;
          const showNow = nowH >= HOUR_START && nowH < HOUR_END;

          const hasAnyTasks = weekDays.some(({dateStr}) => (tasksByDate[dateStr]||[]).length > 0);

          return (
            <div className="tg-wrap">
              {/* Day headers */}
              <div className="tg-header" style={{gridTemplateColumns:gridCols}}>
                <div className="tg-hdr-gutter" />
                {weekDays.map(({dateStr, dayName, dayNum, monthIdx}) => {
                  const isToday = dateStr === todayStr;
                  return (
                    <div key={dateStr} className={`tg-hdr-day ${isToday?'tg-hdr-today':''}`}>
                      <div className="week-dayname">{dayName} <span style={{opacity:.55,fontWeight:500}}>{MONTHS_SHORT[monthIdx]}</span></div>
                      <div className={`week-daynum ${isToday?'week-today-num':''}`} style={{fontSize:22,width:36,height:36}}>{dayNum}</div>
                    </div>
                  );
                })}
              </div>

              {/* All-day row — tasks with deadlines */}
              {hasAnyTasks && (
                <div className="tg-allday" style={{gridTemplateColumns:gridCols}}>
                  <div className="tg-allday-gutter">All day</div>
                  {weekDays.map(({dateStr}) => {
                    const dayTasks = tasksByDate[dateStr] || [];
                    return (
                      <div key={dateStr} className="tg-allday-col">
                        {dayTasks.map(t => <TaskChip key={t.id} t={t} full={false} />)}
                        <button className="tg-add-task-btn" onClick={()=>onAdd(dateStr)}>+ task</button>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Scrollable time grid */}
              <div className="tg-body" ref={timeGridRef}>
                <div className="tg-grid" style={{gridTemplateColumns:gridCols, height:TOTAL_H}}>
                  {/* Time gutter */}
                  <div className="tg-gutter">
                    {hours.map((h,i) => i > 0 && (
                      <div key={h} className="tg-hour-lbl" style={{top: (h - HOUR_START) * HOUR_H}}>
                        {fmtHour(h)}
                      </div>
                    ))}
                  </div>

                  {/* Day columns */}
                  {weekDays.map(({dateStr}) => {
                    const dayBlocks = blocksByDate[dateStr] || [];
                    const isToday   = dateStr === todayStr;
                    return (
                      <div key={dateStr} className={`tg-day-col ${isToday?'tg-day-today':''}`}
                        onClick={e => {
                          if (e.target !== e.currentTarget) return;
                          const rect = e.currentTarget.getBoundingClientRect();
                          const y    = e.clientY - rect.top;
                          const rawH = HOUR_START + y / HOUR_H;
                          const h    = Math.min(HOUR_END - 1, Math.max(HOUR_START, Math.floor(rawH)));
                          const m    = Math.round(((rawH - Math.floor(rawH)) * 60) / 15) * 15 % 60;
                          const pad  = n => String(n).padStart(2,'0');
                          const endH = m >= 45 ? h+2 : h+1;
                          const endM = m >= 45 ? m-45 : m+15;
                          onAddBlock?.({date:dateStr, startTime:`${pad(h)}:${pad(m)}`, endTime:`${pad(endH)}:${pad(endM)}`});
                        }}>
                        {/* Hour and half-hour lines */}
                        {hours.map((h,i) => (
                          <React.Fragment key={h}>
                            {i > 0 && <div className="tg-hour-line"  style={{top:(h-HOUR_START)*HOUR_H}} />}
                            <div className="tg-half-line" style={{top:(h-HOUR_START)*HOUR_H + HOUR_H/2}} />
                          </React.Fragment>
                        ))}
                        {/* Current time indicator */}
                        {isToday && showNow && (
                          <div className="tg-now-wrap" style={{top:nowY}}>
                            <div className="tg-now-dot" />
                            <div className="tg-now-bar" />
                          </div>
                        )}
                        {/* Positioned time blocks */}
                        {dayBlocks.map(b => {
                          const top    = timeToY(b.startTime);
                          const height = Math.max(timeToY(b.endTime) - top, 18);
                          return (
                            <div key={b.id} className="tg-block-pos tint"
                              style={{top, height, '--cc':b.color}}
                              onClick={e => { e.stopPropagation(); onEditBlock?.(b); }}>
                              <div className="tg-bp-time">{fmtT(b.startTime)}–{fmtT(b.endTime)}</div>
                              {height >= 28 && <div className="tg-bp-title">{b.title}</div>}
                              {height >= 50 && b.notes && <div className="tg-bp-notes">{b.notes}</div>}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        })()}

        {/* NO DEADLINE — collapsible */}
        {noDeadline.length > 0 && (
          <div className="cal-nodl-section" style={{padding:'14px 20px'}}>
            <button
              onClick={() => setShowNoDl(v => !v)}
              style={{display:'flex',alignItems:'center',gap:8,background:'none',border:'none',cursor:'pointer',width:'100%',padding:0,textAlign:'left'}}>
              <span style={{fontSize:12,fontWeight:700,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.5px'}}>
                Unscheduled — {noDeadline.length} tasks
              </span>
              <span style={{fontSize:11,color:'var(--text3)',marginLeft:'auto'}}>{showNoDl ? '▲ Hide' : '▼ Show'}</span>
            </button>
            {showNoDl && (
              <div className="cal-nodl-list" style={{marginTop:12}}>
                {noDeadline.map((t,i) => {
                  if (t.isUni) {
                    const planStat = UNI_PLAN_COLS.find(c => c.id === t.plannerStatus);
                    return (
                      <div key={t.id||i} className="cal-nodl-row" style={{ borderLeftColor:UNI_CAL_COLOR }}
                        onClick={() => onEditUni?.(t.semId, t.subjId, t)}>
                        <span className="cal-nodl-lbl" style={{ color:UNI_CAL_COLOR }}>🎓 {t.subjectCode}</span>
                        <span className="cal-nodl-name">{t.name}</span>
                        <span className="cal-nodl-client">{t.weight}% weighting</span>
                        <span className="cal-nodl-pri" style={{ background:UNI_CAL_COLOR+'20', color:UNI_CAL_COLOR, border:`1px solid ${UNI_CAL_COLOR}44` }}>{planStat?.label||t.plannerStatus}</span>
                      </div>
                    );
                  }
                  const cat  = catObj(t.category, workCats);
                  const area = areaObj(t.personalArea, persCats);
                  const col  = t.isPersonal ? (area?.color || '#94a3b8') : (cat?.color || '#5b6af0');
                  const p    = priObj(t.priority);
                  return (
                    <div key={t.id||i} className="cal-nodl-row" style={{ borderLeftColor:col }} onClick={() => onEdit(t)}>
                      <span className="cal-nodl-lbl" style={{ color:col }}>
                        {t.isPersonal ? `P · ${area?.label||'Personal'}` : (cat?.label || '—')}
                      </span>
                      <span className="cal-nodl-name">{t.title}</span>
                      {t.client && <span className="cal-nodl-client">{t.client}</span>}
                      <span className="cal-nodl-pri" style={{ background:(p?.color||'#888')+'20', color:p?.color||'#888', border:`1px solid ${p?.color||'#888'}44` }}>{p?.label}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  /* ── TIME BLOCK MODAL ───────────────────────────────────────── */
  const BLOCK_COLORS = [
    { label:'Deep Work', color:'#5b96e8' },
    { label:'Study',     color:'#9070d8' },
    { label:'Client',    color:'#c98a10' },
    { label:'Health',    color:'#4aac76' },
    { label:'Urgent',    color:'#e05252' },
    { label:'Buffer',    color:'#64748b' },
    { label:'Social',    color:'#e07438' },
  ];

  function TimeBlockModal({ block, defaultDate, defaultStartTime, defaultEndTime, onSave, onDelete, onClose }) {
    const isEdit = !!block;
    const blank = {
      title: '', date: defaultDate || localDateStr(new Date()),
      startTime: defaultStartTime || '09:00', endTime: defaultEndTime || '11:00',
      color: '#5b96e8', notes: '',
    };
    const [f, setF] = React.useState(isEdit ? { ...blank, ...block } : blank);
    const set = (k,v) => setF(p => ({...p,[k]:v}));

    function handleSave() {
      if (!f.title.trim() || !f.date) return;
      onSave({ ...f, title: f.title.trim(), id: block?.id || uid() });
    }

    return (
      <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal" style={{maxWidth:440}}>
          <div className="modal-hdr">
            <div className="modal-title">{isEdit ? 'Edit Time Block' : 'Block Time'}</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div style={{padding:'18px 24px',display:'flex',flexDirection:'column',gap:14}}>
            {/* Title */}
            <div className="fg full">
              <label>What are you blocking time for?</label>
              <input autoFocus type="text" value={f.title} placeholder="e.g. Study — Final Assessment"
                onChange={e=>set('title',e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleSave()} />
            </div>
            {/* Date + Times */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
              <div className="fg">
                <label>Date</label>
                <input type="date" value={f.date} onChange={e=>set('date',e.target.value)} />
              </div>
              <div className="fg">
                <label>Start</label>
                <input type="time" value={f.startTime} onChange={e=>set('startTime',e.target.value)} />
              </div>
              <div className="fg">
                <label>End</label>
                <input type="time" value={f.endTime} onChange={e=>set('endTime',e.target.value)} />
              </div>
            </div>
            {/* Duration display */}
            {f.startTime && f.endTime && (() => {
              const [sh,sm]=f.startTime.split(':').map(Number);
              const [eh,em]=f.endTime.split(':').map(Number);
              const mins=(eh*60+em)-(sh*60+sm);
              if(mins<=0) return null;
              const h=Math.floor(mins/60); const m=mins%60;
              return <div style={{fontSize:12,color:'var(--text2)',marginTop:-6}}>Duration: <strong style={{color:'var(--text)'}}>{h>0?`${h}h `:''}{ m>0?`${m}m`:''}</strong></div>;
            })()}
            {/* Color */}
            <div className="fg">
              <label>Colour</label>
              <div className="tb-modal-colors">
                {BLOCK_COLORS.map(({label,color})=>(
                  <div key={color} className={`tb-color-dot ${f.color===color?'sel':''}`}
                    style={{background:color}} title={label}
                    onClick={()=>set('color',color)} />
                ))}
                <div style={{position:'relative',width:30,height:26,borderRadius:8,overflow:'hidden',border:`2px solid ${!BLOCK_COLORS.find(c=>c.color===f.color)?'#fff':'var(--border)'}`,cursor:'pointer',flexShrink:0}}>
                  <div style={{position:'absolute',inset:0,background:f.color,pointerEvents:'none'}}/>
                  <input type="color" value={f.color} onChange={e=>set('color',e.target.value)}
                    style={{position:'absolute',inset:-4,width:'calc(100%+8px)',height:'calc(100%+8px)',border:'none',padding:0,cursor:'pointer',opacity:0}} />
                </div>
              </div>
            </div>
            {/* Notes */}
            <div className="fg full">
              <label>Notes (optional)</label>
              <textarea rows={2} value={f.notes} placeholder="Topics to cover, goals for the session…"
                onChange={e=>set('notes',e.target.value)}
                style={{resize:'vertical',minHeight:54}} />
            </div>
          </div>
          <div className="modal-footer">
            <div>{isEdit && <button className="btn-del" onClick={()=>onDelete(block.id)}>Delete</button>}</div>
            <div className="modal-actions">
              <button className="btn-cancel" onClick={onClose}>Cancel</button>
              <button className="btn-save" disabled={!f.title.trim()||!f.date} onClick={handleSave}>
                {isEdit?'Save Changes':'Block Time'}
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ── UNI COMPONENTS ─────────────────────────────────────────── */
  function GradeBadge({ pct, override, size }) {
    const g = utsGrade(pct, override);
    if (!g) return <span style={{ fontSize:12, color:'var(--text3)' }}>—</span>;
    return <span className="gbadge" style={{ background:g.bg, color:g.color, fontSize:size||12 }}>{g.label}</span>;
  }

  /* ── MODALS ───────────── */
  function UniModal({ title, children, footer, onClose }) {
    return (
      <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-hdr">
            <div className="modal-title">{title}</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          {children}
          {footer}
        </div>
      </div>
    );
  }

  function UniSemModal({ sem, onSave, onClose }) {
    const [label, setLabel] = React.useState(sem?.label || '');
    return (
      <UniModal title={sem ? 'Edit Semester' : 'Add Semester'} onClose={onClose}
        footer={<div className="modal-footer"><div className="modal-actions">
          <button className="btn-cancel" onClick={onClose}>Cancel</button>
          <button className="btn-save" disabled={!label.trim()} onClick={() => onSave(label.trim())}>Save</button>
        </div></div>}>
        <div className="fg full">
          <label>Semester label</label>
          <input autoFocus type="text" value={label} onChange={e => setLabel(e.target.value)}
            placeholder="e.g. Y2 Semester 2" onKeyDown={e => e.key==='Enter' && label.trim() && onSave(label.trim())} />
        </div>
      </UniModal>
    );
  }

  function UniSubjModal({ subj, onSave, onDelete, onClose }) {
    const [f, setF] = React.useState({
      code: subj?.code || '', name: subj?.name || '',
      credits: subj?.credits || 6, status: subj?.status || 'inprogress',
      gradeOverride: subj?.gradeOverride || '',
    });
    const set = (k,v) => setF(p => ({...p,[k]:v}));
    return (
      <UniModal title={subj ? 'Edit Subject' : 'Add Subject'} onClose={onClose}
        footer={<div className="modal-footer">
          <div>{subj && <button className="btn-del" onClick={() => onDelete(subj.id)}>Delete Subject</button>}</div>
          <div className="modal-actions">
            <button className="btn-cancel" onClick={onClose}>Cancel</button>
            <button className="btn-save" disabled={!f.name.trim()} onClick={() => onSave({...f, credits:parseFloat(f.credits)||6})}>Save</button>
          </div>
        </div>}>
        <div className="form-grid">
          <div className="fg"><label>Subject Code</label>
            <input type="text" value={f.code} onChange={e => set('code',e.target.value)} placeholder="e.g. 12345" /></div>
          <div className="fg"><label>Credit Points</label>
            <select value={f.credits} onChange={e => set('credits',e.target.value)}>
              <option value={6}>6 credits</option><option value={12}>12 credits</option>
              <option value={3}>3 credits</option><option value={8}>8 credits</option>
            </select></div>
          <div className="fg full"><label>Subject Name *</label>
            <input autoFocus type="text" value={f.name} onChange={e => set('name',e.target.value)} placeholder="e.g. Advanced Data Analytics" /></div>
          <div className="fg"><label>Status</label>
            <select value={f.status} onChange={e => set('status',e.target.value)}>
              <option value="inprogress">In Progress</option>
              <option value="completed">Completed</option>
            </select></div>
          <div className="fg"><label>Grade Override</label>
            <select value={f.gradeOverride||''} onChange={e => set('gradeOverride',e.target.value||null)}>
              <option value="">Auto-calculate</option>
              <option value="X">Fail(X) — Failed compulsory component</option>
              <option value="W">W — Withheld</option>
              <option value="Q">Q — Results Pending</option>
            </select></div>
        </div>
      </UniModal>
    );
  }

  function UniAssessModal({ assess, onSave, onDelete, onClose }) {
    const [f, setF] = React.useState({
      name: assess?.name||'', weight: assess?.weight??'',
      score: assess?.score??'', plannerStatus: assess?.plannerStatus||'todo',
      notes: assess?.notes||'', deadline: assess?.deadline||'',
      subtasks: assess?.subtasks||[],
    });
    const set = (k,v) => setF(p => ({...p,[k]:v}));
    const scoreNum = f.score==='' ? null : parseFloat(f.score);
    return (
      <UniModal title={assess ? 'Edit Assessment' : 'Add Assessment'} onClose={onClose}
        footer={<div className="modal-footer">
          <div>{assess && <button className="btn-del" onClick={() => onDelete(assess.id)}>Delete</button>}</div>
          <div className="modal-actions">
            <button className="btn-cancel" onClick={onClose}>Cancel</button>
            <button className="btn-save" disabled={!f.name.trim()} onClick={() => onSave({
              ...(assess||{id:uid()}), name:f.name.trim(), weight:parseFloat(f.weight)||0,
              score: f.score==='' ? null : Math.min(100,Math.max(0,parseFloat(f.score))),
              plannerStatus:f.plannerStatus, notes:f.notes, deadline:f.deadline, subtasks:f.subtasks||[],
            })}>Save</button>
          </div>
        </div>}>
        <div className="form-grid">
          <div className="fg full"><label>Assessment Name *</label>
            <input autoFocus type="text" value={f.name} onChange={e => set('name',e.target.value)} placeholder="e.g. Final Exam" /></div>
          <div className="fg"><label>Weight %</label>
            <input type="number" value={f.weight} onChange={e => set('weight',e.target.value)} placeholder="30" min="0" max="100" step="0.5" /></div>
          <div className="fg"><label>Score % {scoreNum!==null && <GradeBadge pct={scoreNum} size={11} />}</label>
            <input type="number" value={f.score} onChange={e => set('score',e.target.value)} placeholder="Leave blank if not graded yet" min="0" max="100" step="0.5" /></div>
          <div className="fg"><label>Planner Status</label>
            <select value={f.plannerStatus} onChange={e => set('plannerStatus',e.target.value)}>
              {UNI_PLAN_COLS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select></div>
          <div className="fg"><label>Due Date</label>
            <input type="date" value={f.deadline} onChange={e => set('deadline',e.target.value)} /></div>
          <div className="fg full"><label>Notes</label>
            <textarea value={f.notes} onChange={e => set('notes',e.target.value)} placeholder="Any notes about this assessment..." /></div>
          <div className="subtasks-section">
            <div className="subtasks-label">
              Subtasks
              {(f.subtasks||[]).length > 0 && <span className="st-count-pill">{(f.subtasks||[]).filter(s=>s.done).length}/{f.subtasks.length}</span>}
            </div>
            <div className="st-list">
              {(f.subtasks||[]).map(st => (
                <div key={st.id} className="st-item">
                  <div className={`st-item-box ${st.done?'checked':''}`}
                    onClick={() => set('subtasks',(f.subtasks||[]).map(s=>s.id===st.id?{...s,done:!s.done}:s))}>
                    {st.done && '✓'}
                  </div>
                  <span className={`st-item-txt ${st.done?'done':''}`}>{st.text}</span>
                  <button className="st-item-del" onClick={() => set('subtasks',(f.subtasks||[]).filter(s=>s.id!==st.id))}>×</button>
                </div>
              ))}
            </div>
            <div className="st-add-row">
              <input id="uni-new-st" className="st-add-in" type="text" placeholder="Add a subtask and press Enter or +"
                onKeyDown={e => { if(e.key==='Enter'&&e.target.value.trim()){set('subtasks',[...(f.subtasks||[]),{id:uid(),text:e.target.value.trim(),done:false}]);e.target.value=''; }}} />
              <button className="st-add-btn" onClick={() => { const el=document.getElementById('uni-new-st'); if(el?.value.trim()){set('subtasks',[...(f.subtasks||[]),{id:uid(),text:el.value.trim(),done:false}]);el.value=''; }}}>+</button>
            </div>
          </div>
        </div>
      </UniModal>
    );
  }

  /* ── GRADES VIEW ──────── */
  function UniAssessRow({ assess, onUpdate, onOpenModal }) {
    const ws = assess.score !== null && assess.score !== undefined
      ? ((assess.score * assess.weight) / 100).toFixed(2) : '—';
    return (
      <tr>
        <td style={{ width:110 }}>
          <select className="uni-pl-sel" value={assess.plannerStatus}
            onChange={e => onUpdate({ ...assess, plannerStatus:e.target.value })}>
            {UNI_PLAN_COLS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
        </td>
        <td style={{ cursor:'pointer' }} onClick={onOpenModal} title="Click to edit">{assess.name}</td>
        <td className="r">{assess.weight}%</td>
        <td className="r">
          <input className="uni-score-in" type="number" min="0" max="100" step="0.5" placeholder="—"
            value={assess.score===null||assess.score===undefined ? '' : assess.score}
            onClick={e => e.stopPropagation()}
            onChange={e => {
              const v = e.target.value==='' ? null : parseFloat(e.target.value);
              onUpdate({ ...assess, score: v===null||isNaN(v) ? null : Math.min(100,Math.max(0,v)) });
            }} />
        </td>
        <td className="r">{ws !== '—' ? ws + '%' : '—'}</td>
        <td><GradeBadge pct={assess.score!==null&&assess.score!==undefined ? assess.score : null} /></td>
        <td><button className="uni-assess-del" onClick={onOpenModal} title="Edit" aria-label="Edit"><Icon name="pen" size={14} /></button></td>
      </tr>
    );
  }

  function UniSubjectBlock({ subj, onUpdateSubj, onDeleteSubj }) {
    const [open, setOpen]   = React.useState(false);
    const [modal, setModal] = React.useState(null);

    function updateAssess(updated) {
      onUpdateSubj({ ...subj, assessments: subj.assessments.map(a => a.id===updated.id ? updated : a) });
    }
    function deleteAssess(id) {
      onUpdateSubj({ ...subj, assessments: subj.assessments.filter(a => a.id!==id) });
      setModal(null);
    }
    function saveAssess(saved) {
      const exists = subj.assessments.find(a => a.id===saved.id);
      onUpdateSubj({ ...subj, assessments: exists
        ? subj.assessments.map(a => a.id===saved.id ? saved : a)
        : [...subj.assessments, saved] });
      setModal(null);
    }
    function saveSubj(f) {
      onUpdateSubj({ ...subj, ...f });
      setModal(null);
    }

    const calc = subjectCalc(subj);
    const g    = utsGrade(calc.gradedWeight > 0 ? calc.weightedScore : null, subj.gradeOverride);
    const isPartial = calc.gradedWeight > 0 && !calc.isComplete;
    const totalWeight = (subj.assessments||[]).reduce((s,a) => s + (a.weight||0), 0);
    const weightOk = Math.abs(totalWeight - 100) < 0.1;

    return (
      <>
        <div className="uni-subj">
          <div className="uni-subj-hdr" onClick={() => setOpen(o => !o)}>
            <div className="uni-subj-chevron"><Icon name="chev" size={14} className={open ? "chev-open" : ""} /></div>
            <div className="uni-subj-code">{subj.code}</div>
            <div className="uni-subj-name">{subj.name}</div>
            <div className="uni-subj-actions" onClick={e => e.stopPropagation()}>
              <button className="uni-act-btn" onClick={() => setModal({type:'edit-subj'})}>Edit</button>
              <button className="uni-act-btn uni-act-del" onClick={() => setModal({type:'del-subj'})}>Del</button>
            </div>
            <div className="uni-subj-cr">{subj.credits}cr · {subj.status==='completed' ? 'Done' : 'Active'}</div>
            <div className="uni-subj-pct" style={{ color: g ? g.color : 'var(--text2)' }}>
              {calc.gradedWeight > 0 ? calc.weightedScore.toFixed(2) + '%' : '—'}{isPartial ? '*' : ''}
            </div>
            <GradeBadge pct={calc.gradedWeight>0 ? calc.weightedScore : null} override={subj.gradeOverride} size={12} />
            <div className="uni-subj-gpt" style={{ color:g?.point!=null ? g.color : 'var(--text3)', marginLeft:4 }}>
              {g?.point!=null ? g.point : '—'}
            </div>
          </div>

          {open && (
            <div className="uni-assess-wrap">
              {!weightOk && calc.gradedWeight > 0 && (
                <div style={{ fontSize:12, color:'#c98a10', marginBottom:6 }}>
                  ⚠ Weights sum to {totalWeight.toFixed(1)}% (should be 100%)
                </div>
              )}
              <table className="uni-atable">
                <thead>
                  <tr>
                    <th style={{ width:110 }}>Status</th>
                    <th>Assessment</th>
                    <th className="r" style={{ width:60 }}>Weight</th>
                    <th className="r" style={{ width:76 }}>Score %</th>
                    <th className="r" style={{ width:76 }}>Weighted</th>
                    <th style={{ width:68 }}>Grade</th>
                    <th style={{ width:30 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {(subj.assessments||[]).map(a => (
                    <UniAssessRow key={a.id} assess={a} onUpdate={updateAssess}
                      onOpenModal={() => setModal({type:'edit-assess', assess:a})} />
                  ))}
                  <tr className="atable-total">
                    <td colSpan={2} style={{ fontWeight:700 }}>Total / Overall</td>
                    <td className="r">{totalWeight}%</td>
                    <td></td>
                    <td className="r" style={{ color:g ? g.color : 'inherit' }}>
                      {calc.gradedWeight > 0 ? calc.weightedScore.toFixed(2) + '%' : '—'}
                    </td>
                    <td><GradeBadge pct={calc.gradedWeight>0 ? calc.weightedScore : null} override={subj.gradeOverride} size={12} /></td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
              {isPartial && (
                <div className="uni-proj-note">
                  * {calc.gradedWeight.toFixed(1)}% of weight graded.
                  Projected final: {calc.projectedPct.toFixed(1)}% → <GradeBadge pct={calc.projectedPct} size={11} />
                </div>
              )}
              <div style={{ marginTop:10, display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
                <button className="uni-add-assess" onClick={() => setModal({type:'add-assess'})}>+ Add Assessment</button>
                <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
                  <span style={{ fontSize:12, color:'var(--text2)' }}>Override:</span>
                  <select className="uni-pl-sel" value={subj.gradeOverride||''} onChange={e => onUpdateSubj({...subj, gradeOverride:e.target.value||null})}>
                    <option value="">Auto</option>
                    <option value="X">Fail(X)</option>
                    <option value="W">W — Withheld</option>
                    <option value="Q">Q — Results Pending</option>
                  </select>
                </div>
              </div>
            </div>
          )}
        </div>

        {modal?.type === 'edit-subj' && (
          <UniSubjModal subj={subj} onSave={saveSubj} onDelete={id => { onDeleteSubj(id); setModal(null); }} onClose={() => setModal(null)} />
        )}
        {modal?.type === 'del-subj' && (
          <UniModal title="Delete Subject" onClose={() => setModal(null)}
            footer={<div className="modal-footer"><div className="modal-actions">
              <button className="btn-cancel" onClick={() => setModal(null)}>Cancel</button>
              <button className="btn-del" onClick={() => { onDeleteSubj(subj.id); setModal(null); }}>Yes, Delete</button>
            </div></div>}>
            <p style={{ color:'var(--text2)', fontSize:14 }}>Delete <strong>{subj.name}</strong> and all {(subj.assessments||[]).length} assessments? This cannot be undone.</p>
          </UniModal>
        )}
        {modal?.type === 'add-assess' && (
          <UniAssessModal onSave={saveAssess} onDelete={deleteAssess} onClose={() => setModal(null)} />
        )}
        {modal?.type === 'edit-assess' && (
          <UniAssessModal assess={modal.assess} onSave={saveAssess} onDelete={deleteAssess} onClose={() => setModal(null)} />
        )}
      </>
    );
  }

  function UniSemBlock({ sem, onUpdateSem, onDeleteSem }) {
    const [open,  setOpen]  = React.useState(sem.id === 'y2s1');
    const [modal, setModal] = React.useState(null);

    const gpaInfo = semGPA(sem);
    const g = gpaInfo ? utsGrade((gpaInfo.gpa / 7) * 100) : null;

    function updateSubj(updated) {
      onUpdateSem({ ...sem, subjects: sem.subjects.map(s => s.id===updated.id ? updated : s) });
    }
    function deleteSubj(id) {
      onUpdateSem({ ...sem, subjects: sem.subjects.filter(s => s.id!==id) });
    }
    function saveSubj(f) {
      const existing = (sem.subjects||[]).find(s => s.id === f.id);
      if (existing) {
        onUpdateSem({ ...sem, subjects: sem.subjects.map(s => s.id===f.id ? {...s,...f} : s) });
      } else {
        onUpdateSem({ ...sem, subjects:[...(sem.subjects||[]), { id:uid(), assessments:[], ...f }] });
      }
      setModal(null);
    }
    function saveSemLabel(label) {
      onUpdateSem({ ...sem, label });
      setModal(null);
    }

    return (
      <>
        <div className="uni-sem">
          <div className="uni-sem-hdr" onClick={() => setOpen(o => !o)}>
            <div className="uni-sem-chevron"><Icon name="chev" size={14} className={open ? "chev-open" : ""} /></div>
            <div className="uni-sem-title">{sem.label}</div>
            <div className="uni-sem-stats">
              {gpaInfo && <>
                <span style={{ fontSize:13, color:'var(--text2)' }}>{gpaInfo.projected ? 'Projected GPA' : 'GPA'}</span>
                <span style={{ fontSize:15, fontWeight:800, color:g ? g.color : 'inherit' }}>{gpaInfo.gpa.toFixed(2)}</span>
                <span style={{ fontSize:12, color:'var(--text2)' }}>{gpaInfo.credits}cr graded</span>
              </>}
              {!gpaInfo && sem.subjects?.some(s => s.status==='inprogress') && (
                <span style={{ fontSize:12, color:'#5b96e8' }}>In progress</span>
              )}
            </div>
            <div className="uni-sem-actions" onClick={e => e.stopPropagation()}>
              <button className="uni-act-btn" onClick={() => setModal({type:'edit-sem'})}>Rename</button>
              <button className="uni-act-btn uni-act-del" onClick={() => setModal({type:'del-sem'})}>Delete</button>
            </div>
            <div style={{ marginLeft:8, fontSize:12, color:'var(--text3)' }}>{(sem.subjects||[]).length} subjects</div>
          </div>
          {open && (
            <>
              {(sem.subjects||[]).map(s => (
                <UniSubjectBlock key={s.id} subj={s} onUpdateSubj={updateSubj} onDeleteSubj={deleteSubj} />
              ))}
              <button className="uni-sem-add-subj" onClick={() => setModal({type:'add-subj'})}>+ Add Subject</button>
            </>
          )}
        </div>

        {modal?.type === 'edit-sem' && (
          <UniSemModal sem={sem} onSave={saveSemLabel} onClose={() => setModal(null)} />
        )}
        {modal?.type === 'del-sem' && (
          <UniModal title="Delete Semester" onClose={() => setModal(null)}
            footer={<div className="modal-footer"><div className="modal-actions">
              <button className="btn-cancel" onClick={() => setModal(null)}>Cancel</button>
              <button className="btn-del" onClick={() => { onDeleteSem(sem.id); setModal(null); }}>Yes, Delete</button>
            </div></div>}>
            <p style={{ color:'var(--text2)', fontSize:14 }}>Delete <strong>{sem.label}</strong> and all subjects? This cannot be undone.</p>
          </UniModal>
        )}
        {modal?.type === 'add-subj' && (
          <UniSubjModal onSave={saveSubj} onClose={() => setModal(null)} />
        )}
      </>
    );
  }

  function UniGradesView({ uniData, onUpdate }) {
    const [addSem, setAddSem] = React.useState(false);
    const cumul      = cumulativeGPA(uniData.semesters);
    const cumulWAM   = computeWAM(uniData.semesters);
    const allDone    = (uniData.semesters||[]).flatMap(s => s.subjects||[]).filter(s => s.status==='completed');
    const active     = (uniData.semesters||[]).flatMap(s => s.subjects||[]).filter(s => s.status==='inprogress');
    const cumulG     = cumul ? utsGrade((cumul.gpa / 7) * 100) : null;

    function updateSem(updated) {
      onUpdate(d => ({ ...d, semesters: d.semesters.map(s => s.id===updated.id ? updated : s) }));
    }
    function deleteSem(id) {
      onUpdate(d => ({ ...d, semesters: d.semesters.filter(s => s.id!==id) }));
    }
    function addSemester(label) {
      onUpdate(d => ({ ...d, semesters:[{ id:uid(), label, subjects:[] }, ...d.semesters] }));
      setAddSem(false);
    }

    return (
      <div>
        <div className="uni-gpa-row">
          <div className="uni-gpa-card">
            <div className="uni-gpa-label" style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
              Cumulative GPA
              {cumul?.projected && <span style={{ fontSize:10, background:'rgba(91,150,232,.15)', color:'#5b96e8', border:'1px solid rgba(91,150,232,.3)', borderRadius:6, padding:'1px 5px', fontWeight:600 }}>Projected</span>}
            </div>
            <div className="uni-gpa-val" style={{ color:cumulG ? cumulG.color : 'var(--text2)' }}>
              {cumul ? cumul.gpa.toFixed(2) : '—'}
            </div>
            {cumulWAM && (
              <div style={{ fontSize:13, fontWeight:700, color:cumulG ? cumulG.color : 'var(--text2)', opacity:0.85, marginTop:2, lineHeight:1 }}>
                WAM {cumulWAM.wam.toFixed(1)}%
              </div>
            )}
            <div className="uni-gpa-sub">{cumul ? `${cumul.credits} credit points` : 'No completed subjects'}</div>
          </div>
          <div className="uni-gpa-card">
            <div className="uni-gpa-label">Completed</div>
            <div className="uni-gpa-val">{allDone.length}</div>
            <div className="uni-gpa-sub">{allDone.reduce((t,s) => t+(s.credits||6), 0)} credit points</div>
          </div>
          <div className="uni-gpa-card">
            <div className="uni-gpa-label">Active Now</div>
            <div className="uni-gpa-val" style={{ color:'#5b96e8' }}>{active.length}</div>
            <div className="uni-gpa-sub">{active.reduce((t,s) => t+(s.credits||6), 0)} credit points</div>
          </div>
          {[...(uniData.semesters||[])].reverse().map(sem => {
            const g = semGPA(sem);
            if (!g) return null;
            const sw = semWAM(sem);
            const sg = utsGrade((g.gpa/7)*100);
            return (
              <div key={sem.id} className="uni-gpa-card">
                <div className="uni-gpa-label" style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
                  {sem.label}
                  {sem.excludeFromGPA && <span style={{ fontSize:10, background:'rgba(148,163,184,.15)', color:'#94a3b8', border:'1px solid rgba(148,163,184,.3)', borderRadius:6, padding:'1px 5px', fontWeight:600 }}>Separate</span>}
                  {g.projected && <span style={{ fontSize:10, background:'rgba(91,150,232,.15)', color:'#5b96e8', border:'1px solid rgba(91,150,232,.3)', borderRadius:6, padding:'1px 5px', fontWeight:600 }}>Projected</span>}
                </div>
                <div className="uni-gpa-val" style={{ color:sg ? sg.color : 'inherit' }}>{g.gpa.toFixed(2)}</div>
                {sw && <div style={{ fontSize:12, fontWeight:700, color:sg ? sg.color : 'var(--text2)', opacity:0.85, marginTop:2, lineHeight:1 }}>WAM {sw.wam.toFixed(1)}%</div>}
