<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Work Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sidd — Work Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23000'/><rect x='5' y='8' width='9' height='7' rx='2' fill='%236470f5'/><rect x='18' y='8' width='9' height='7' rx='2' fill='%236470f5' opacity='.45'/><rect x='5' y='18' width='9' height='7' rx='2' fill='%236470f5' opacity='.45'/><rect x='18' y='18' width='9' height='7' rx='2' fill='%236470f5'/></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#000000; --surface:#111111; --surface2:#1a1a1a; --border:#2a2a2a;
      --accent:#6470f5; --text:#f2f2f2; --text2:#888888; --text3:#444444;
      --high:#e05252; --med:#c98a10; --low:#4aac76;
      --shadow:0 4px 24px rgba(0,0,0,0.7); --radius:10px;
      --map-ocean:#0b1929; --map-land:#232a38;
    }
    body.light {
      --bg:#eef0f5; --surface:#ffffff; --surface2:#f3f5f8; --border:#d5d9e4;
      --text:#1a1a2e; --text2:#5e6a84; --text3:#a8b0c8;
      --shadow:0 4px 20px rgba(0,0,0,0.08);
      --map-ocean:#b8d4e8; --map-land:#dde5ef;
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    button { font-family:inherit; cursor:pointer; }
    input,select,textarea { font-family:inherit; }

    /* FILE BANNER */
    .file-banner { padding:10px 28px; display:flex; align-items:center; gap:14px; font-size:14px; border-bottom:1px solid var(--border); }
    .file-banner.reconnect { background:rgba(201,138,16,.07); border-bottom-color:rgba(201,138,16,.25); color:var(--text); }
    .fbtn { padding:6px 14px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text2); font-size:13px; transition:all .15s; }
    .fbtn:hover { border-color:var(--text2); color:var(--text); }
    .fbtn.primary { background:#c98a10; border-color:#c98a10; color:#000; font-weight:600; }
    .fbtn.primary:hover { opacity:.85; }

    /* TOP NAV */
    .topnav { background:var(--surface); border-bottom:1px solid var(--border); padding:0 28px; display:flex; align-items:center; gap:20px; height:60px; position:sticky; top:0; z-index:200; }
    .nav-logo { font-size:21px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap; }
    .nav-logo span { color:var(--accent); }
    .nav-tabs { display:flex; background:var(--surface2); border-radius:9px; padding:4px; gap:3px; }
    /* APPEARANCE SETTINGS */
    .ap-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
    .ap-row:last-child { margin-bottom:0; }
    .ap-lbl { font-size:13px; font-weight:600; color:var(--text2); min-width:110px; flex-shrink:0; }
    .accent-swatches { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
    .accent-dot { width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .1s, border-color .1s; flex-shrink:0; }
    .accent-dot:hover { transform:scale(1.18); }
    .accent-dot.sel { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.25); transform:scale(1.12); }
    .accent-custom-wrap { position:relative; width:30px; height:30px; border-radius:8px; overflow:hidden; border:2px solid var(--border); cursor:pointer; flex-shrink:0; }
    .accent-custom-wrap input[type=color] { position:absolute; inset:-4px; width:calc(100%+8px); height:calc(100%+8px); border:none; padding:0; cursor:pointer; opacity:0; }
    .accent-custom-swatch { position:absolute; inset:0; pointer-events:none; }
    .bg-chips { display:flex; gap:7px; flex-wrap:wrap; }
    .bg-chip { border:2px solid var(--border); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; font-weight:500; color:var(--text2); transition:all .15s; display:flex; align-items:center; gap:7px; }
    .bg-chip:hover { border-color:var(--text2); color:var(--text); }
    .bg-chip.sel { border-color:var(--accent); color:var(--text); }
    .bg-chip-dot { width:13px; height:13px; border-radius:3px; border:1px solid rgba(255,255,255,0.12); flex-shrink:0; }
    .font-grid { display:flex; gap:8px; flex-wrap:wrap; }
    .font-opt { border:2px solid var(--border); border-radius:9px; padding:10px 16px; cursor:pointer; transition:border-color .15s; }
    .font-opt:hover { border-color:var(--text2); }
    .font-opt.sel { border-color:var(--accent); }
    .font-opt-name { font-size:14px; font-weight:600; color:var(--text); margin-bottom:2px; }
    .font-opt-preview { font-size:11px; color:var(--text2); }
    .nav-settings-btn { width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:none; color:var(--text2); font-size:18px; display:flex; align-items:center; justify-content:center; transition:all .15s; flex-shrink:0; line-height:1; }
    .nav-settings-btn:hover { border-color:var(--text2); color:var(--text); }
    .nav-settings-btn.active { background:var(--surface2); border-color:var(--accent); color:var(--accent); }
    .nav-tab { padding:8px 20px; border-radius:7px; border:none; background:none; color:var(--text2); font-size:14px; font-weight:500; transition:all .15s; }
    .nav-tab:hover { color:var(--text); }
    .nav-tab.active { background:var(--accent); color:#fff; font-weight:600; }
    .nav-stats { display:flex; gap:28px; margin-left:auto; }
    .nstat { display:flex; flex-direction:column; align-items:center; gap:1px; }
    .nstat-n { font-size:19px; font-weight:800; line-height:1; }
    .nstat-l { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.4px; }
    .file-pill { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text3); background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:5px 12px; white-space:nowrap; flex-shrink:0; max-width:200px; overflow:hidden; }
    .fpill-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .fpill-dot.green { background:#4aac76; }
    .fpill-dot.amber { background:#c98a10; animation:pulsedot 1.2s ease-in-out infinite; }
    .fpill-dot.red   { background:#e05252; }
    .fpill-dot.gray  { background:var(--text3); }
    .fpill-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @keyframes pulsedot { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* TOOLBAR */
    .toolbar { background:var(--bg); border-bottom:1px solid var(--border); padding:10px 28px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .toolbar-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; }
    .toolbar-sep { width:1px; height:24px; background:var(--border); margin:0 4px; flex-shrink:0; }
    .ctry-btn { padding:7px 13px; border-radius:16px; border:1px solid var(--border); background:transparent; color:var(--text2); font-size:13px; font-weight:500; transition:all .15s; white-space:nowrap; }
    .ctry-btn:hover { border-color:var(--text3); color:var(--text); }
    .ctry-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    .client-select { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:13px; outline:none; cursor:pointer; transition:border-color .15s; max-width:180px; }
    .client-select:focus { border-color:var(--accent); }
    .search-input { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 15px; color:var(--text); font-size:14px; outline:none; width:200px; transition:border-color .15s; }
    .search-input:focus { border-color:var(--accent); }
    .search-input::placeholder { color:var(--text3); }
    .view-toggle { display:flex; background:var(--surface2); border-radius:8px; padding:3px; gap:2px; }
    .vtab { padding:7px 14px; border-radius:6px; border:none; background:none; color:var(--text2); font-size:13px; font-weight:500; transition:all .15s; }
    .vtab:hover { color:var(--text); }
    .vtab.active { background:var(--surface); color:var(--text); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    .add-btn { margin-left:auto; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 22px; font-size:14px; font-weight:600; white-space:nowrap; transition:opacity .15s; }
    .add-btn:hover { opacity:.85; }

    /* MATRIX */
    .matrix-wrap { padding:22px 28px; overflow-x:auto; }
    .matrix { min-width:900px; display:flex; flex-direction:column; gap:10px; }
    .matrix-hdr { display:grid; grid-template-columns:170px repeat(5,1fr); gap:8px; }
.mhdr-corner { display:flex; align-items:flex-end; padding:0 4px 8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); }
    .mhdr-col { background:var(--surface); border:1px solid var(--border); border-top:3px solid transparent; border-radius:9px; padding:10px 12px; display:flex; align-items:center; gap:7px; }
    .mhdr-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .mhdr-label { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text2); flex:1; }
    .mhdr-count { background:var(--surface2); color:var(--text2); border-radius:10px; font-size:12px; font-weight:700; padding:2px 9px; }
    .matrix-row { display:grid; grid-template-columns:170px repeat(5,1fr); gap:8px; }
    .cat-label-cell { background:var(--surface); border:1px solid var(--border); border-left:4px solid transparent; border-radius:9px; padding:15px; display:flex; flex-direction:column; gap:7px; }
    .cat-name { font-size:15px; font-weight:700; color:var(--text); line-height:1.3; }
    .cat-badge { font-size:11px; font-weight:600; padding:2px 9px; border-radius:10px; display:inline-block; }
    .cat-hint { font-size:11px; color:var(--text3); line-height:1.45; }
    .cat-add-inline { margin-top:auto; background:none; border:1px dashed var(--border); border-radius:7px; color:var(--text3); padding:6px; font-size:12px; width:100%; text-align:center; transition:all .15s; }
    .cat-add-inline:hover { border-color:var(--accent); color:var(--accent); }
    .task-cell { background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px; display:flex; flex-direction:column; gap:7px; min-height:80px; }
    .task-cell.cell-done { opacity:.7; }
    .task-cell.cell-onhold { opacity:.6; background:var(--surface2); border-style:dashed; }
    .cell-empty { color:var(--text3); font-size:13px; padding:10px 4px; text-align:center; }
    .cell-add { background:none; border:1px dashed var(--border); border-radius:7px; color:var(--text3); padding:6px; font-size:12px; text-align:center; transition:all .15s; margin-top:auto; }
    .cell-add:hover { border-color:var(--accent); color:var(--accent); }

    /* MATRIX CARD */
    .mcard { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px 12px 12px 16px; position:relative; cursor:pointer; transition:border-color .15s,box-shadow .15s; }
    .mcard:hover { border-color:var(--accent); box-shadow:0 6px 16px -8px rgba(0,0,0,.6); }
    .mcard.stale { border-color:rgba(201,138,16,.4); }
    .mcard-bar { position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:8px 0 0 8px; }
    .mcard-title { font-size:14px; font-weight:600; color:var(--text); line-height:1.35; margin-bottom:7px; }
    .mcard-meta { display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
    .mcard-client { font-size:12px; font-weight:500; }
    .mcard-flag { font-size:15px; }
    .mcard-dl { font-size:12px; color:var(--text2); }
    .mcard-pri { font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:.3px; }
    .mcard-type { font-size:11px; color:var(--text3); }
    .mcard-stale { font-size:10px; font-weight:600; color:#c98a10; background:rgba(201,138,16,.12); border:1px solid rgba(201,138,16,.3); border-radius:8px; padding:1px 6px; }
    .mcard-notes { font-size:12px; color:var(--text2); line-height:1.5; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
    .dl-overdue { color:var(--high) !important; }
    .dl-soon    { color:var(--med)  !important; }

    /* CONTEXT MENU */
    .ctx-menu { position:fixed; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:5px; z-index:400; box-shadow:var(--shadow); min-width:165px; }
    .ctx-item { padding:9px 14px; font-size:13px; color:var(--text2); border-radius:6px; transition:all .1s; cursor:pointer; }
    .ctx-item:hover { background:var(--surface2); color:var(--text); }
    .ctx-sep { height:1px; background:var(--border); margin:4px 0; }
    .ctx-danger { color:var(--high) !important; }
    .ctx-danger:hover { background:rgba(224,82,82,.1) !important; }

    /* PRIORITY VIEW */
    .pri-wrap { padding:22px 28px; display:flex; flex-direction:column; gap:20px; }
    .pri-section-hdr { display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:2px solid var(--border); margin-bottom:10px; }
    .pri-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .pri-lbl { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; flex:1; }
    .pri-cnt { background:var(--surface2); color:var(--text2); border-radius:10px; font-size:12px; font-weight:700; padding:2px 9px; }
    .pri-list { display:flex; flex-direction:column; gap:5px; }
    .pri-row { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 16px 12px 19px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:border-color .15s; position:relative; overflow:hidden; flex-wrap:wrap; }
    .pri-row:hover { border-color:var(--accent); }
    .pri-row.row-stale { border-color:rgba(201,138,16,.4); }
    .row-pbar { position:absolute; left:0; top:0; bottom:0; width:4px; }
    .row-cat { font-size:11px; font-weight:600; padding:3px 9px; border-radius:10px; white-space:nowrap; flex-shrink:0; }
    .row-title { font-size:14px; font-weight:600; color:var(--text); flex:1; min-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-client { font-size:13px; color:var(--text2); white-space:nowrap; flex-shrink:0; max-width:160px; overflow:hidden; text-overflow:ellipsis; }
    .row-flag { font-size:15px; flex-shrink:0; }
    .row-dl { font-size:12px; color:var(--text2); white-space:nowrap; flex-shrink:0; }
    .row-stale-badge { font-size:11px; font-weight:600; color:#c98a10; background:rgba(201,138,16,.12); border:1px solid rgba(201,138,16,.3); border-radius:8px; padding:2px 7px; white-space:nowrap; flex-shrink:0; }
    .row-updated { font-size:11px; color:var(--text3); white-space:nowrap; flex-shrink:0; }
    .row-status { background:var(--surface2); border:1px solid var(--border); border-radius:7px; color:var(--text2); font-size:12px; padding:5px 9px; cursor:pointer; outline:none; flex-shrink:0; font-family:inherit; }
    details > summary { list-style:none; cursor:pointer; }
    details > summary::-webkit-details-marker { display:none; }
    .done-toggle { padding:10px 0; font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }

    /* PERSONAL */
    .pers-wrap { padding:22px 28px; overflow-x:auto; }
    .pers-board { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; min-width:700px; }
    .pers-col { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; }
    .pers-col-hdr { padding:14px 16px 10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); border-top:3px solid transparent; border-radius:var(--radius) var(--radius) 0 0; }
    .phdr-label { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text2); flex:1; }
    .phdr-count { background:var(--surface2); color:var(--text2); border-radius:10px; font-size:12px; font-weight:700; padding:2px 9px; }
    .pers-cards { padding:10px; display:flex; flex-direction:column; gap:8px; flex:1; min-height:120px; }
    .pers-empty { text-align:center; color:var(--text3); font-size:13px; padding:20px; }
    .pcol-add { margin:0 10px 10px; background:none; border:1px dashed var(--border); border-radius:7px; color:var(--text3); padding:8px; font-size:13px; text-align:center; transition:all .15s; }
    .pcol-add:hover { border-color:var(--accent); color:var(--accent); }

    /* SETTINGS */
    .settings-wrap { padding:28px; max-width:820px; }
    .settings-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
    .section-title { font-size:17px; font-weight:700; margin-bottom:18px; }
    .section-desc { font-size:13px; color:var(--text2); margin-bottom:14px; }
    .theme-cards { display:flex; gap:16px; }
    .theme-card { flex:1; border:2px solid var(--border); border-radius:var(--radius); padding:18px; cursor:pointer; transition:border-color .15s; }
    .theme-card:hover,.theme-card.active { border-color:var(--accent); }
    .theme-preview { height:64px; border-radius:7px; padding:12px; margin-bottom:12px; display:flex; flex-direction:column; gap:6px; }
    .tp-bar { height:11px; border-radius:4px; width:70%; }
    .tp-bar2 { height:8px; border-radius:4px; width:50%; }
    .theme-label { font-size:16px; font-weight:700; margin-bottom:3px; }
    .theme-desc { font-size:13px; color:var(--text2); }
    .theme-active { margin-top:8px; font-size:12px; font-weight:700; color:var(--accent); }
    .settings-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
    .settings-label { font-size:14px; font-weight:600; min-width:200px; }
    .settings-select { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .15s; }
    .settings-select:focus { border-color:var(--accent); }
    .cat-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .cat-row { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:13px 16px; display:flex; align-items:center; gap:12px; }
    .cat-row-swatch { width:17px; height:17px; border-radius:50%; flex-shrink:0; }
    .cat-row-name { font-size:14px; font-weight:600; flex:1; }
    .cat-row-tag { font-size:11px; color:var(--text3); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:2px 8px; }
    .cat-row-edit-btn { background:none; border:1px solid var(--border); color:var(--text2); border-radius:7px; padding:5px 13px; font-size:12px; transition:all .15s; }
    .cat-row-edit-btn:hover { border-color:var(--accent); color:var(--accent); }
    .cat-row-del-btn { background:none; border:1px solid transparent; color:var(--text3); border-radius:7px; padding:5px 10px; font-size:12px; transition:all .15s; }
    .cat-row-del-btn:hover { border-color:var(--high); color:var(--high); }
    .cat-edit-row { background:var(--surface2); border:1px solid var(--accent); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .edit-name-row { display:flex; align-items:center; gap:10px; }
    .edit-swatch { width:22px; height:22px; border-radius:50%; flex-shrink:0; border:2px solid var(--border); }

    /* CALENDAR */

    .cal-today-btn:hover { border-color:var(--accent); color:var(--accent); }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--border); gap:1px; }
    .cal-wday { background:var(--surface2); padding:9px 10px; text-align:center; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }

    .cal-add-day { position:absolute; top:6px; right:6px; background:none; border:1px solid var(--border); border-radius:6px; color:var(--text3); width:20px; height:20px; font-size:14px; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; padding:0; line-height:1; }
    .cal-add-day:hover { border-color:var(--accent); color:var(--accent); opacity:1; }
    .cal-nodl-section { margin-top:22px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; }

    .cal-view-toggle { display:flex; background:var(--surface2); border-radius:8px; padding:3px; gap:2px; }

    .cal-vtab.active { background:var(--surface); color:var(--text); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    /* TIME BLOCKS */
    .cal-block-btn { padding:7px 13px; border-radius:8px; border:1px solid var(--border); background:none; color:var(--text2); font-size:13px; font-weight:600; transition:all .15s; display:flex; align-items:center; gap:5px; }
    .cal-block-btn:hover { border-color:var(--accent); color:var(--accent); }
    .tb-chip { font-size:10px; font-weight:700; padding:2px 5px 2px 4px; border-radius:4px; color:#fff; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:2px; margin-bottom:1px; transition:opacity .12s;   }

    /* TIME BLOCK MODAL */

    .tb-color-dot:hover { transform:scale(1.18); }
    .tb-color-dot.sel { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.25); transform:scale(1.12); }

    /* WEEK VIEW */
    .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .week-col { background:var(--surface); border:1px solid var(--border); border-radius:10px; display:flex; flex-direction:column; min-height:420px; min-width:0; overflow:hidden; }
    .week-col.week-col-today { border-color:var(--accent); background:rgba(91,106,240,.04); }
    .week-col.week-col-past { opacity:.72; }
    .week-col-hdr { padding:12px 14px 10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:4px; }
    .week-dayname { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
    .week-daynum { font-size:20px; font-weight:800; color:var(--text); width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
    .week-today-num { background:var(--accent); color:#fff; }
    .week-tasks { padding:10px; display:flex; flex-direction:column; gap:5px; flex:1; }
    .week-empty { color:var(--text3); font-size:12px; text-align:center; padding:18px 0; }
    .week-evt { border-radius:7px; padding:9px 10px; cursor:pointer; transition:opacity .15s; }
    .week-evt:hover { opacity:.8; }
    .week-evt-title { font-size:13px; font-weight:600; line-height:1.35; margin-bottom:4px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .week-evt-meta { font-size:11px; color:rgba(255,255,255,0.72); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .week-add { background:none; border:1px dashed var(--border); border-radius:7px; color:var(--text3); padding:6px; font-size:12px; text-align:center; transition:all .15s; margin-top:auto; }
    .week-add:hover { border-color:var(--accent); color:var(--accent); }
    /* TIME-GRID WEEK VIEW */
    .tg-wrap { border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
    .tg-header { display:grid; background:var(--surface2); border-bottom:1px solid var(--border); flex-shrink:0; }
    .tg-hdr-gutter { border-right:1px solid var(--border); padding:10px 0; }
    .tg-hdr-day { padding:10px 10px 8px; border-right:1px solid var(--border); min-width:0; overflow:hidden; }
    .tg-hdr-day:last-child { border-right:none; }
    .tg-hdr-today { background:rgba(100,112,245,.07); }
    .tg-allday { display:grid; border-bottom:2px solid var(--border); flex-shrink:0; background:var(--surface); }
    .tg-allday-gutter { border-right:1px solid var(--border); padding:5px 6px 5px 0; font-size:9px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.4px; text-align:right; display:flex; align-items:flex-start; justify-content:flex-end; padding-top:7px; }
    .tg-allday-col { border-right:1px solid var(--border); padding:3px 3px 4px; display:flex; flex-direction:column; gap:2px; min-height:28px; min-width:0; overflow:hidden; }
    .tg-allday-col:last-child { border-right:none; }
    .tg-body { overflow-y:hidden; flex:1; position:relative; }
    .tg-grid { display:grid; position:relative; }
    .tg-gutter { border-right:1px solid var(--border); background:var(--surface); position:sticky; left:0; z-index:3; }
    .tg-hour-lbl { position:absolute; right:7px; font-size:10px; color:var(--text3); font-weight:600; transform:translateY(-50%); white-space:nowrap; user-select:none; }
    .tg-day-col { border-right:1px solid var(--border); position:relative; cursor:crosshair; min-width:0; overflow:hidden; }
    .tg-day-col:last-child { border-right:none; }
    .tg-day-today { background:rgba(100,112,245,.025); }
    .tg-hour-line { position:absolute; left:0; right:0; border-top:1px solid var(--border); pointer-events:none; }
    .tg-half-line { position:absolute; left:0; right:0; border-top:1px dashed var(--border); opacity:.35; pointer-events:none; }
    .tg-block-pos { position:absolute; left:2px; right:2px; border-radius:6px; overflow:hidden; cursor:pointer; transition:opacity .15s; padding:3px 6px; box-sizing:border-box; }
    .tg-block-pos:hover { opacity:.82; }
    .tg-bp-time { font-size:9px; font-weight:700; color:rgba(255,255,255,.75); letter-spacing:.2px; white-space:nowrap; overflow:hidden; }
    .tg-bp-title { font-size:11px; font-weight:700; color:#fff; line-height:1.25; overflow:hidden; }
    .tg-bp-notes { font-size:10px; color:rgba(255,255,255,.6); margin-top:1px; overflow:hidden; }

    .tg-now-dot { position:absolute; left:-4px; top:-4px; width:9px; height:9px; border-radius:50%; background:#e05252; }
    .tg-add-task-btn { background:none; border:1px dashed var(--border); border-radius:5px; color:var(--text3); padding:2px 8px; font-size:11px; transition:all .15s; white-space:nowrap; }
    .tg-add-task-btn:hover { border-color:var(--accent); color:var(--accent); }

    /* MODAL */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; width:100%; max-width:580px; box-shadow:var(--shadow); max-height:92vh; overflow-y:auto; }
    .modal-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .modal-title { font-size:18px; font-weight:700; }
    .modal-close { background:none; border:none; color:var(--text3); font-size:19px; padding:4px; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

    label { font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
    input[type=text],input[type=date],select,textarea { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .15s; width:100%; }

    .btn-save { background:var(--accent); border:none; color:#fff; border-radius:8px; padding:10px 22px; font-size:14px; font-weight:600; transition:opacity .15s; }

    .btn-cancel { background:none; border:1px solid var(--border); color:var(--text2); border-radius:8px; padding:10px 18px; font-size:14px; transition:all .15s; }
    .btn-cancel:hover { border-color:var(--text2); color:var(--text); }
    .btn-cancel.sm { padding:7px 13px; font-size:13px; }
    .btn-del { background:none; border:1px solid var(--high); color:var(--high); border-radius:8px; padding:10px 18px; font-size:14px; transition:background .15s; }
    .btn-del:hover { background:rgba(224,82,82,.1); }

    /* UNI TAB */
    .uni-wrap { padding:22px 28px; }
    .uni-top { display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
    .uni-view-toggle { display:flex; background:var(--surface2); border-radius:8px; padding:3px; gap:2px; }

    .uni-add-sem-btn { margin-left:auto; background:none; border:1px solid var(--border); color:var(--text2); border-radius:8px; padding:8px 16px; font-size:13px; transition:all .15s; }

    /* GPA summary */

    .uni-gpa-val { font-size:26px; font-weight:800; line-height:1; }

    /* Grade badge */
    .gbadge { display:inline-block; padding:2px 8px; border-radius:8px; font-size:12px; font-weight:700; }

    /* Semester block */
    .uni-sem { background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:14px; overflow:hidden; }
    .uni-sem-hdr { padding:14px 20px; display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
    .uni-sem-hdr:hover { background:var(--surface2); }
    .uni-sem-title { font-size:16px; font-weight:700; flex:1; }
    .uni-sem-stats { display:flex; align-items:center; gap:10px; }
    .uni-sem-chevron { font-size:11px; color:var(--text3); transition:transform .2s; width:16px; text-align:center; }
    .uni-sem-chevron.open { transform:rotate(90deg); }
    .uni-sem-actions { display:flex; gap:6px; }
    .uni-act-btn { background:none; border:1px solid var(--border); color:var(--text2); border-radius:6px; padding:3px 10px; font-size:11px; transition:all .15s; }
    .uni-act-btn:hover { border-color:var(--accent); color:var(--accent); }

    .uni-sem-add-subj { margin:0 16px 14px; background:none; border:2px dashed var(--border); border-radius:8px; color:var(--text2); padding:9px; font-size:13px; width:calc(100% - 32px); text-align:center; transition:all .15s; }
    .uni-sem-add-subj:hover { border-color:var(--accent); color:var(--accent); }

    /* Subject block */
    .uni-subj { border-top:1px solid var(--border); }
    .uni-subj-hdr { padding:11px 20px 11px 32px; display:flex; align-items:center; gap:9px; cursor:pointer; }
    .uni-subj-hdr:hover { background:var(--surface2); }
    .uni-subj-code { font-size:11px; color:var(--text3); font-weight:600; min-width:50px; }
    .uni-subj-name { font-size:14px; font-weight:600; flex:1; }
    .uni-subj-cr { font-size:11px; color:var(--text2); background:var(--surface2); border:1px solid var(--border); border-radius:7px; padding:2px 7px; white-space:nowrap; }
    .uni-subj-pct { font-size:13px; font-weight:700; min-width:52px; text-align:right; }
    .uni-subj-gpt { font-size:14px; font-weight:800; min-width:16px; text-align:right; }
    .uni-subj-chevron { font-size:10px; color:var(--text3); transition:transform .2s; }
    .uni-subj-chevron.open { transform:rotate(90deg); }
    .uni-subj-actions { display:flex; gap:5px; opacity:0; transition:opacity .15s; }
    .uni-subj-hdr:hover .uni-subj-actions { opacity:1; }

    /* Assessment table */
    .uni-assess-wrap { padding:2px 20px 14px 32px; }
    .uni-atable { width:100%; border-collapse:collapse; }
    .uni-atable th { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text2); padding:5px 8px 7px 0; text-align:left; border-bottom:1px solid var(--border); }

    .uni-atable td { padding:7px 8px 7px 0; font-size:13px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .uni-atable tr:last-child td { border-bottom:none; }

    /* ═══════════════════════════════════════════════════════════════
       DESIGN REFRESH + RESPONSIVE LAYER
       Breakpoints: ≤1500 poster grids · ≤1280 laptop · ≤1100 small laptop/tablet · ≤820 phone/tablet-portrait · ≤480 small phone
       ═══════════════════════════════════════════════════════════════ */
    :root { --pad:28px; --nav-h:60px; --bn-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --ring:0 0 0 3px rgba(100,112,245,.35); }
    html { -webkit-text-size-adjust:100%; }
    body { overflow-x:hidden; }
    button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline:none; box-shadow:var(--ring); }
    input:focus-visible, select:focus-visible, textarea:focus-visible { box-shadow:var(--ring); }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; border:2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background:var(--text3); }

    /* shared polish */
    .topnav { background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:0 var(--pad); }
    .nav-tabs { min-width:0; overflow-x:auto; scrollbar-width:none; flex-shrink:1; }

    .modal { border-radius:16px; }
    .mcard-more { display:none; }
    .bottom-nav, .more-overlay, .cal-agenda { display:none; }
    @keyframes sheetUp { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    /* poster grids: keep 10-up on wide screens, flow down gracefully elsewhere */
    @media (max-width:1500px) {
      .mv-grid, .tv-card-grid, .tv-notranked-grid { grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); }
    }

    /* ── laptop / small desktop ── */

      .cal-add-day, .tb-add-day { width:28px; height:28px; }

    }
    input.search-input { width:260px; flex:0 1 260px; }

      .search-input, .client-select, .mv-search-in, .mv-form-in, .mv-sb-search, .ctry-search-input, .st-add-in, .edit-name-input, .apf-input, .settings-select, .uni-score-in, .uni-pl-sel, .mv-unrated-sort, .budget-amt-input, .bmt-cell-input, .city-tag-input { font-size:16px !important; }

      /* top bar + bottom tab bar */

      .bottom-nav { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:250; height:calc(var(--bn-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--border); }

      .more-item { background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:16px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--text); font-size:13px; font-weight:600; }

      .more-stats b { font-size:15px; margin-right:3px; }

      /* toolbar (work / personal) */
      .toolbar { padding-top:10px; padding-bottom:10px; }
      .toolbar .ctry-btn { padding:6px 11px; font-size:12px; min-height:34px; }
      .toolbar .view-toggle { margin-right:auto; }
      .toolbar-row { gap:8px; }
      .toolbar-row > .ctry-btn { flex-shrink:0; }

      .client-select { flex:1; min-width:120px; max-width:none; }
      input.search-input { width:100%; flex:1 1 100%; order:5; }
      .view-toggle { order:4; }
      .add-btn { position:fixed; right:16px; bottom:calc(var(--bn-h) + var(--safe-b) + 14px); z-index:180; margin:0; border-radius:28px; padding:0 22px; height:50px; box-shadow:0 6px 20px rgba(0,0,0,.45); font-size:15px; }

      /* work / personal boards → stacked groups, each status as a labelled section */

    /* shared ghost button + header action rows */
    .ghost-btn { background:transparent; color:var(--text2); border:1px solid var(--border); border-radius:var(--r-md); font-size:13px; font-weight:500; padding:8px 14px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; transition:background .15s, border-color .15s, color .15s; }
    .ghost-btn:hover { background:var(--surface2); color:var(--text); border-color:var(--text3); }
    .tv-add-btn { margin-left:0; }
    .tv-push { margin-left:auto; }
    .uni-gpa-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); }
    .uni-gpa-card { min-width:0; }
    @media (max-width:820px) { .uni-gpa-row { grid-template-columns:repeat(2,1fr); } .uni-gpa-card { min-width:0; } .tv-push { margin-left:0; } }

    /* page-level consistency */
    .settings-wrap { margin:0 auto; max-width:860px; }
    .travel-stats-strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
    .travel-stat { min-width:0; border-radius:var(--r-lg); }
    .travel-visit-card, .travel-map-wrap { border-color:var(--hair); }
    .travel-add-btn { margin-left:auto; }
    @media (min-width:901px) and (max-width:1100px) { .bw-main { grid-template-columns:1fr 260px; } }
    .wf-bar-track { height:4px; }
    .wf-income-bar { border-bottom-width:1px; border-bottom-color:var(--hair); }
    .tv-kpi, .uni-gpa-card, .travel-stat, .mv-kpi-card { box-shadow:none; }
    .tv-kpi { border-radius:var(--r-lg); padding:12px 20px; }
    .uni-sem-chevron, .uni-subj-chevron { color:var(--text2); }
    .uni-subj { border-top-color:var(--hair); }
    .uni-sem-hdr:hover, .uni-subj-hdr:hover { background:color-mix(in srgb, var(--text) 4%, transparent); }
    .uni-atable th { border-bottom-color:var(--hair); }
    .uni-atable td { border-bottom-color:var(--hair); }
    .uni-score-in, .uni-pl-sel { border-radius:8px; }
    .uni-pl-card, .uni-pl-cell, .uni-pl-subj-cell, .uni-pl-col-hdr { border-color:var(--hair); border-radius:12px; }
    .uni-pl-card { border-radius:10px; background:var(--surface2); }
    .bmt td, .bmt th { border-bottom-color:var(--hair); }
    .week-col, .tg-wrap { border-color:var(--hair); border-radius:var(--r-lg); }
    .tg-header, .tg-allday { border-bottom-color:var(--hair); }
    .tg-hour-line { border-top-color:var(--hair); }
    .mv-hm-item, .mv-dir-film-pill { border-radius:10px; }
    .mv-genre-hdr, .travel-country-hdr, .pri-section-hdr { border-bottom-color:var(--hair); }
    .pri-section-hdr { border-bottom-width:1px; }
    .pri-row .row-title { font-weight:600; }
    .row-status { border-radius:8px; }
    .enrich-row { border-bottom-color:var(--hair); }
    .mv-result-row, .st-item, .recur-toggle, .recur-options, .storage-status, .no-fsa-note, .cat-edit-row, .add-proj-form { border-radius:var(--r-md); }
    .city-tags-wrap { border-radius:var(--r-md); }
    .city-tag { border-radius:7px; }
    .ctry-dropdown { border-radius:12px; border-color:var(--hair); }

    /* ── tinted event/assessment cards (calendar, planner) ── */
    .tint { background:color-mix(in srgb, var(--cc) 20%, var(--surface2)) !important; color:var(--text) !important; border:1px solid color-mix(in srgb, var(--cc) 32%, transparent) !important; border-left:3px solid var(--cc) !important; }
    .tint:hover { opacity:1; border-color:color-mix(in srgb, var(--cc) 70%, transparent) !important; border-left-color:var(--cc) !important; }
    .tint::after { display:none !important; }
    .tint :is(.uni-pl-card-name, .week-evt-title, .tb-evt-title, .tg-bp-title) { color:var(--text) !important; font-weight:600; }
    .tint :is(.uni-pl-card-meta, .week-evt-meta, .tb-evt-time, .tb-evt-notes, .tg-bp-time, .tg-bp-notes), .tint .uni-pl-card-meta *, .tint .week-evt-meta * { color:var(--text2) !important; }
    .tint .uni-pl-card-meta span[style*="font-weight"] { color:var(--text) !important; }
    .tint .week-evt-title span, .tint.cal-evt span { opacity:.8 !important; }
    .uni-pl-card.tint { border-radius:10px; padding:9px 11px 9px 12px; transition:border-color .15s, background .15s; }
    .uni-pl-card-name { font-size:13px; font-weight:600; letter-spacing:-.01em; color:var(--text); }
    .uni-pl-card-meta { font-size:12px; }
    .tg-block-pos.tint { border-radius:8px; }
    .week-evt.tint, .tb-evt.tint { border-radius:9px; }
    .uni-pl-filter { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .uni-pl-filter-lbl { font-size:12.5px; font-weight:600; color:var(--text2); }
    .uni-pl-hint { font-size:12px; color:var(--text3); flex-basis:100%; }
    .uni-course { font-size:13px; color:var(--text2); font-weight:500; }
    .uni-sem-filter { max-width:100%; overflow-x:auto; scrollbar-width:none; }
    .uni-sem-filter::-webkit-scrollbar { display:none; }
    .uni-sem-filter .uni-vtab { white-space:nowrap; }
    .uni-planner-sem-hdr { margin:6px 0 12px; }
    .uni-pl-subj-cell { background:var(--surface); }
    .uni-pl-subj-name { font-size:13.5px; font-weight:650; letter-spacing:-.01em; }
    .uni-pl-cell { background:color-mix(in srgb, var(--text) 2.5%, var(--surface)); }
    .uni-pl-cell.drag-over { background:var(--accent-soft); outline-color:var(--accent-line); }
    .uni-pl-card.is-dragging { opacity:.35; }
    @media (max-width:820px) {
      .cal-cell .tint { background:var(--cc) !important; border:none !important; }
      .cal-agenda .tint { background:color-mix(in srgb, var(--cc) 20%, var(--surface2)) !important; border:1px solid color-mix(in srgb, var(--cc) 32%, transparent) !important; border-left:3px solid var(--cc) !important; }
      /* planner: stacked subjects with labelled status sections */
      .uni-pl-table { overflow-x:visible; }
      .uni-pl-grid { min-width:0; gap:12px; }
      .uni-pl-hdr-row { display:none; }
      .uni-pl-row { display:flex; flex-direction:column; gap:6px; background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:10px; }
      .uni-pl-subj-cell { border:none; border-left:4px solid transparent; background:none; border-radius:0; padding:4px 6px 8px 12px; }
      .uni-pl-cell { min-height:0; border:none; background:var(--surface2); border-radius:10px; padding:8px; }
      .uni-pl-cell::before { content:attr(data-col); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); padding:2px 4px 4px; }
      .uni-pl-cell:has(> .uni-pl-empty) { flex-direction:row; align-items:center; padding:7px 10px; }
      .uni-pl-cell:has(> .uni-pl-empty)::before { padding:0; flex:1; }
      .uni-pl-empty { display:none; }
      .uni-pl-card.tint { padding:11px 12px; }
      .uni-pl-filter { margin-bottom:10px; }
      /* empty status sections stay visible (compact) so cards can be dragged into them */
      .task-cell:has(> .cell-empty) { flex-direction:row; align-items:center; gap:8px; padding:6px 10px; }
      .task-cell:has(> .cell-empty)::before { flex:1; padding:0; }
      .task-cell:has(> .cell-empty) .cell-add { margin:0; width:auto; padding:6px 12px; }
    }

    /* selects that had no explicit width were stretching to 100% */
    .row-status, .mv-unrated-sort, .recur-select, .uni-pl-sel, .uni-sem-filter select { width:auto; }
    .row-status { padding:5px 10px; font-size:12.5px; border-color:var(--hair); background:var(--surface2); min-width:120px; }
    .pri-row { gap:10px 12px; }
    .mv-unrated-hdr { gap:10px; }
    .mv-unrated-sort { min-width:200px; border-radius:var(--r-md); padding:8px 12px; }
    .mv-kpi-strip, .mv-stats-kpi-row { grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }
    .mv-top4-item { border:1px solid var(--hair); }
    .mv-rank-num { font-variant-numeric:tabular-nums; font-weight:800; }
    .mv-rank-item, .tv-rank-item { cursor:grab; }
    .mv-genre-hdr { cursor:pointer; }
    .mv-genre-hdr:hover .mv-genre-name { color:var(--accent); }
    .mv-genre-name { font-weight:700; letter-spacing:-.01em; }
    .mv-genre-count, .tv-genre-count, .mv-dir-count { background:transparent; border-color:var(--hair); font-weight:600; }
    .mv-at-header-tabs { gap:6px; }

    .mv-form-lbl, .apf-label, .subtasks-label { text-transform:none; letter-spacing:0; font-size:12.5px; font-weight:600; color:var(--text2); }
    .mv-form-grid { gap:14px 16px; }

    input.city-tag-input, input.mv-sb-search.bare { background:transparent !important; border:none !important; padding:1px 0 !important; width:auto !important; box-shadow:none !important; flex:1; min-width:90px; }
    .city-tags-wrap { gap:6px; padding:6px 10px; }

    /* number / time / search inputs never had a base style (browser inset border) */
    :where(input[type=number], input[type=time], input[type=search], input[type=email], input[type=password], input[type=url], input[type=datetime-local], input[type=month]) { background:var(--surface2); border:1px solid var(--border); border-radius:var(--r-md); padding:10px 13px; color:var(--text); font-size:14px; outline:none; width:100%; transition:border-color .15s; }
    :where(input[type=number]) { font-variant-numeric:tabular-nums; }
    input[type=checkbox], input[type=radio] { accent-color:var(--accent); }
    input[type=date], input[type=time], input[type=month] { color-scheme:dark; }
    body.light input[type=date], body.light input[type=time], body.light input[type=month] { color-scheme:light; }

    /* compact inline inputs must beat the generic input rule */
    input.uni-score-in { padding:6px 8px; width:72px; text-align:right; font-size:13.5px; border-radius:8px; }
    input.recur-input { padding:6px 10px; width:64px; }
    input.budget-amt-input, input.bmt-cell-input { padding:3px 7px; width:100%; font-size:14px; }
    input.bmt-cell-input { width:76px; }
    input.mv-sb-search { padding:7px 10px; font-size:12.5px; border-radius:var(--r-md); }
    select.uni-pl-sel, select.recur-select, select.row-status, select.mv-unrated-sort { padding:6px 28px 6px 10px; }

    /* GitHub sync */
    .gh-steps { margin:0 0 16px 20px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; color:var(--text2); line-height:1.5; }
    .gh-steps a { color:var(--accent); }
    .gh-steps code, .section-desc code { background:var(--surface2); border:1px solid var(--hair); border-radius:6px; padding:1px 6px; font-size:12.5px; }
    .gh-form { display:flex; flex-direction:column; gap:14px; max-width:520px; }
    .gh-form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .gh-err { color:var(--high); font-size:13px; background:color-mix(in srgb, var(--high) 10%, transparent); border:1px solid color-mix(in srgb, var(--high) 35%, transparent); border-radius:var(--r-md); padding:10px 12px; }
    .gh-conflict { background:color-mix(in srgb, var(--med) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--med) 40%, transparent); border-radius:var(--r-lg); padding:16px; margin-bottom:14px; }
    .gh-conflict-t { font-weight:700; margin-bottom:10px; }
    .gh-pill { cursor:pointer; }
    .gh-pill.conflict, .gh-pill.error, .gh-pill.auth { border-color:color-mix(in srgb, var(--high) 45%, var(--border)); color:var(--text); }
    @media (max-width:820px) { .gh-pill span { display:none; } .gh-form-row { grid-template-columns:1fr; } }

    /* ╔══════════════════════════════════════════════════════════════╗
       ║  HARBOUR DUSK — final design layer (overrides all above)      ║
       ║  tokens · type scale · tabs/segments/chips · drawer · panels  ║
       ╚══════════════════════════════════════════════════════════════╝ */
    :root {
      --font-ui:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
      --font-display:'Bricolage Grotesque','Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;
      --fs-xs:12px; --fs-sm:13.5px; --fs-base:15px; --fs-md:17px; --fs-lg:21px; --fs-xl:28px;
      --r-sm:8px; --r-md:11px; --r-lg:16px; --r-xl:22px;
      --g-a:#e0566b; --g-b:var(--accent); --g-c:#f2a54b; --on-accent:#14141c;
      --grad:linear-gradient(118deg, var(--g-a), var(--g-b) 52%, var(--g-c));
      --grad-soft:linear-gradient(118deg, color-mix(in srgb,var(--g-a) 20%,transparent), color-mix(in srgb,var(--g-b) 20%,transparent) 52%, color-mix(in srgb,var(--g-c) 20%,transparent));
      --hair:color-mix(in srgb, var(--text) 10%, transparent);
      --hair-2:color-mix(in srgb, var(--text) 16%, transparent);
      --accent-soft:color-mix(in srgb, var(--accent) 16%, transparent);
      --accent-line:color-mix(in srgb, var(--accent) 52%, transparent);
      --lift:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 24px -12px rgba(0,0,0,.6);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    body { font-family:var(--font-ui); font-size:var(--fs-base); line-height:1.5; letter-spacing:0; font-feature-settings:'tnum' 0,'ss01' 0; -webkit-font-smoothing:antialiased; }
    ::selection { background:color-mix(in srgb, var(--g-b) 45%, transparent); color:inherit; }
    input, textarea { caret-color:var(--g-b); }
    html { scrollbar-color:color-mix(in srgb,var(--text) 22%,transparent) transparent; }

    /* horizon light: the only place the gradient is used as ambience */
    body::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:
        radial-gradient(1200px 560px at 90% -12%, color-mix(in srgb, var(--g-c) 17%, transparent), transparent 70%),
        radial-gradient(1000px 620px at 2% 112%, color-mix(in srgb, var(--g-a) 18%, transparent), transparent 70%),
        linear-gradient(to top, color-mix(in srgb, var(--g-c) 8%, transparent), transparent 34%); }
    body.light::before { opacity:.55; }

    /* ── type scale: one family, six steps ── */
    h1, h2, .page-title, .home-greeting-name, .modal-title, .mv-topbar-title, .cal-month-title, .budget-month-label { font-family:var(--font-display); letter-spacing:-.02em; font-weight:600; }
    .section-title, .home-section-title, .mv-chart-title, .bw-chart-title, .travel-section-title, .tv-genre-hdr, .mv-genre-name, .uni-planner-sem-hdr, .tv-unranked-title, .tv-notranked-title, .mv-rank-unranked-title, .bmt-section-title, .wf-income-label, .cal-nodl-title {
      font-family:var(--font-ui); font-size:var(--fs-md); font-weight:650; letter-spacing:-.01em; text-transform:none; color:var(--text); }
    .mhdr-label, .phdr-label, .pri-lbl, .nstat-l, .uni-gpa-label, .uni-atable th, .uni-pl-corner, .mhdr-corner, .uni-pl-col-lbl, .mv-kpi-label, .tv-kpi-lbl, .wf-group-label, .bmt th, .apf-label, .subtasks-label, .mv-hm-title, .done-toggle, .cal-wday, .week-dayname, .mv-form-lbl, .task-cell::before, .uni-pl-cell::before, .mv-sb-label, label {
      font-size:var(--fs-xs); font-weight:600; letter-spacing:.01em; text-transform:none; color:var(--text2); }
    .cal-wday, .week-dayname { text-transform:uppercase; letter-spacing:.06em; }
    .home-stat-n, .mv-kpi-value, .uni-gpa-val, .travel-stat-n, .tv-kpi-val, .wf-income-val, .wf-subtotal-val { font-family:var(--font-display); font-size:var(--fs-xl); font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.1; }
    .home-greeting-name { font-size:var(--fs-xl); }
    .home-greeting-date, .section-desc, .storage-sub, .home-stat-sub, .mv-kpi-sub, .uni-gpa-sub, .travel-stat-l, .cell-empty, .home-empty { font-size:var(--fs-sm); color:var(--text2); }
    .mcard-title, .cat-name, .uni-sem-title, .uni-subj-name, .home-nav-title, .mv-li-title, .tv-title, .mv-dir-name, .travel-country-name, .row-title { font-size:var(--fs-base); font-weight:600; letter-spacing:-.005em; }
    .mcard-meta, .mcard-dl, .mcard-client, .mcard-type, .mcard-notes, .row-client, .row-dl, .mv-card-sub, .tv-card-meta, .mv-li-meta, .tv-meta, .uni-atable td, .bmt td, .st-txt { font-size:var(--fs-sm); }
    .mv-card-title, .tv-card-title { font-size:var(--fs-sm); font-weight:600; }
    [style*="font-size: 9px"], [style*="font-size: 10px"], [style*="font-size: 11px"] { font-size:var(--fs-xs) !important; }
    [style*="font-size: 12px"] { font-size:var(--fs-xs) !important; }

    /* ── icons ── */
    .ic { flex:none; display:inline-block; vertical-align:-3px; }
    .mv-empty-icon, .tv-empty-icon, .travel-empty-icon, .budget-empty-icon { color:var(--text3); display:flex; justify-content:center; font-size:0; margin-bottom:var(--sp-3,12px); }
    .mv-empty-icon .ic, .tv-empty-icon .ic, .travel-empty-icon .ic, .budget-empty-icon .ic { width:44px; height:44px; padding:10px; box-sizing:content-box; border-radius:18px; background:var(--grad-soft); color:var(--text); stroke-width:1.5; }
    .mv-at-badge, .tv-at-badge { color:#f2c14b; display:flex; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

    /* ── top bar ── */
    .topnav { height:60px; padding:0 var(--pad); gap:24px; background:color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3); border-bottom:1px solid var(--hair); }
    .topnav::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--grad); opacity:.55; pointer-events:none; }
    .nav-logo { display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-size:19px; font-weight:650; letter-spacing:-.03em; }
    .nav-logo::before { content:''; width:22px; height:22px; border-radius:7px; background:var(--grad); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); }
    .nav-logo span { color:var(--g-c); }
    .nav-tabs { background:none; border:none; padding:0; gap:2px; border-radius:0; }
    .nav-tab { position:relative; padding:9px 12px; border-radius:var(--r-sm); background:none; box-shadow:none; font-size:14px; font-weight:550; color:var(--text2); }
    .nav-tab:hover { color:var(--text); background:color-mix(in srgb, var(--text) 6%, transparent); }
    .nav-tab.active { background:none; box-shadow:none; color:var(--text); font-weight:650; }
    .nav-tab.active::after { content:''; position:absolute; left:10px; right:10px; bottom:-12px; height:2px; border-radius:2px 2px 0 0; background:var(--grad); }
    .file-pill { background:color-mix(in srgb, var(--text) 5%, transparent); border:1px solid var(--hair); border-radius:var(--r-sm); }
    .nav-settings-btn { border-radius:var(--r-md); border-color:var(--hair); }
    .nav-settings-btn.active { background:var(--grad-soft); border-color:var(--accent-line); color:var(--text); }

    /* ── page header (one per tab) ── */
    .page-hdr { display:flex; align-items:flex-end; justify-content:space-between; gap:var(--pad); padding:28px var(--pad) 8px; max-width:1680px; margin:0 auto; }
    .page-hdr h1 { font-size:var(--fs-xl); line-height:1.1; }
    .page-hdr p { margin-top:6px; font-size:var(--fs-sm); color:var(--text2); }

    /* ── three navigation roles: tabs, segments, chips ── */
    /* tabs: text with a gradient underline (sub-navigation) */
    .uni-view-toggle:not(.uni-sem-filter), .tv-view-tabs, .mv-at-header-tabs, .subnav-tabs { display:flex; gap:4px; background:none; border:none; border-bottom:1px solid var(--hair); border-radius:0; padding:0; margin-bottom:var(--sp-4,16px); }
    .uni-view-toggle:not(.uni-sem-filter) .uni-vtab, .tv-vtab, .mv-at-htab, .subnav-tab { position:relative; background:none !important; border:none; border-radius:0; box-shadow:none !important; padding:10px 14px; font-size:var(--fs-sm); font-weight:550; color:var(--text2); white-space:nowrap; display:inline-flex; align-items:center; gap:7px; }
    .uni-view-toggle:not(.uni-sem-filter) .uni-vtab:hover, .tv-vtab:hover, .mv-at-htab:hover, .subnav-tab:hover { color:var(--text); }
    .uni-view-toggle:not(.uni-sem-filter) .uni-vtab.active, .tv-vtab.active, .mv-at-htab.active, .subnav-tab.active { color:var(--text); font-weight:650; }
    .uni-view-toggle:not(.uni-sem-filter) .uni-vtab.active::after, .tv-vtab.active::after, .mv-at-htab.active::after, .subnav-tab.active::after { content:''; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; border-radius:2px 2px 0 0; background:var(--grad); }
    .subnav-count { font-size:var(--fs-xs); color:var(--text3); font-variant-numeric:tabular-nums; }
    .subnav-tab.active .subnav-count { color:var(--text2); }
    /* segments: switch how the same data is shown */
    .view-toggle, .cal-view-toggle, .mv-view-toggle { display:inline-flex; gap:2px; background:color-mix(in srgb, var(--text) 5%, transparent); border:1px solid var(--hair); border-radius:var(--r-md); padding:3px; }
    .vtab, .cal-vtab, .mv-vtab { padding:6px 13px; border-radius:var(--r-sm); font-size:var(--fs-sm); font-weight:550; color:var(--text2); background:none; border:none; box-shadow:none; display:inline-flex; align-items:center; gap:6px; }
    .vtab:hover, .cal-vtab:hover, .mv-vtab:hover { color:var(--text); }

  // Australian PAYG tax estimate (FY2025-26, resident, tax-free threshold claimed)
  function calcAusTax(grossAnnual, hasHELP) {
    const g = grossAnnual;
    if (!g || g <= 0) return { incomeTax:0, helpRepayment:0, medicare:0, totalWithholding:0, netAnnual:0, netMonthly:0, effectivePct:0 };
    // Income tax brackets
    let tax = 0;
    if (g <= 18200)       tax = 0;
    else if (g <= 45000)  tax = (g - 18200) * 0.19;
    else if (g <= 135000) tax = 5092 + (g - 45000) * 0.325;
    else if (g <= 190000) tax = 34292 + (g - 135000) * 0.37;
    else                  tax = 54942 + (g - 190000) * 0.45;
    // LITO
    let lito = 0;
    if (g <= 37500)       lito = 700;
    else if (g <= 45000)  lito = 700 - (g - 37500) * 0.05;
    else if (g <= 66667)  lito = Math.max(0, 325 - (g - 45000) * 0.015);
    tax = Math.max(0, tax - lito);
    // Medicare levy (2%, shade-in below $32,279)
    let medicare = 0;
    if (g >= 32279)       medicare = g * 0.02;
    else if (g > 26000)   medicare = (g - 26000) * 0.10;

    const incomeTax = Math.round(tax);
    const totalWithholding = incomeTax + helpRepayment;
    const netAnnual = Math.round(g - totalWithholding);
    return { incomeTax, helpRepayment, medicare:Math.round(medicare), totalWithholding, netAnnual, netMonthly:Math.round(netAnnual/12), effectivePct:Math.round(totalWithholding/g*100) };

  function HorizBar({ data, color='var(--accent)', maxW=220 }) {
    if (!data || !data.length) return null;
    const max = Math.max(...data.map(d=>d.value), 1);
    return (
      <div style={{display:'flex',flexDirection:'column',gap:7}}>
        {data.map(d=>(
          <div key={d.label} style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{fontSize:12,color:'var(--text2)',width:maxW,flexShrink:0,textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.label}</div>
            <div style={{flex:1,background:'var(--surface2)',borderRadius:4,height:16,overflow:'hidden',minWidth:60}}>
              <div style={{width:`${(d.value/max)*100}%`,height:'100%',background:color,borderRadius:4,transition:'width .4s ease'}}/>
            </div>
            <div style={{fontSize:12,fontWeight:700,color:'var(--text)',minWidth:24,textAlign:'right'}}>{d.value}</div>
          </div>
        ))}
      </div>
    );
  }

  function LineChart({ data, color='#5b96e8', fillColor='rgba(91,150,232,0.12)' }) {
    if (!data || data.length < 2) return null;
    const W = 480, H = 110, PL = 28, PR = 12, PT = 20, PB = 28;
    const iW = W - PL - PR, iH = H - PT - PB;
    const max = Math.max(...data.map(d=>d.value), 1);
    const xs = data.map((_, i) => PL + (i / (data.length - 1)) * iW);
    const ys = data.map(d => PT + iH - (d.value / max) * iH);
    const linePath = xs.map((x, i) => `${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    const fillPath = `${linePath} L${xs[xs.length-1].toFixed(1)},${(PT+iH).toFixed(1)} L${xs[0].toFixed(1)},${(PT+iH).toFixed(1)} Z`;
    // y-axis gridlines at 0, 50%, 100%
    const gridVals = [0, Math.round(max/2), max];
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block',overflow:'visible'}}>
        {/* Grid */}
        {gridVals.map(v=>{
          const y = PT + iH - (v/max)*iH;
          return <g key={v}>
            <line x1={PL} y1={y} x2={W-PR} y2={y} stroke='var(--border)' strokeWidth='1'/>
            <text x={PL-4} y={y+4} textAnchor='end' fontSize='9' fill='var(--text3)'>{v}</text>
          </g>;
        })}
        {/* Fill */}
        <path d={fillPath} fill={fillColor}/>
        {/* Line */}
        <path d={linePath} fill='none' stroke={color} strokeWidth='2' strokeLinejoin='round' strokeLinecap='round'/>
        {/* Dots + labels */}
        {data.map((d,i)=>(
          <g key={d.label}>
            <circle cx={xs[i]} cy={ys[i]} r='3.5' fill={color}/>
            {d.value > 0 && <text x={xs[i]} y={ys[i]-7} textAnchor='middle' fontSize='9' fontWeight='700' fill='var(--text2)'>{d.value}</text>}
            <text x={xs[i]} y={H-2} textAnchor='middle' fontSize='9' fill='var(--text3)'>{d.label}</text>
          </g>
        ))}
      </svg>
    );
  }

  function WorldMapView({ countriesSet, countryCounts={}, heightRatio=0.5, scaleMultiplier=1 }) {
    const ref = React.useRef(null);
    const tooltipRef = React.useRef(null);
    const [loaded, setLoaded] = React.useState(false);
    const [err, setErr] = React.useState(null);
    const [unmapped, setUnmapped] = React.useState([]);

    // Normalise topojson id → strip leading zeros (atlas stores "076" not "76")
    const normId = id => String(parseInt(String(id), 10));

    React.useEffect(()=>{
      if (!ref.current) return;
      let cancelled = false;
      const container = ref.current;

      // 50m resolution: significantly more small-island and small-state coverage than 110m
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
        .then(r=>r.json())
        .then(world=>{
          if (cancelled) return;
          const countries = window.topojson.feature(world, world.objects.countries);
          // getBoundingClientRect gives accurate layout width even in flex/grid containers
          const w = (container.getBoundingClientRect().width || container.clientWidth || window.innerWidth * 0.7);
          const h = Math.round(w * heightRatio);

          d3.select(container).selectAll('*').remove();

          const svg = d3.select(container)
            .append('svg')
            .attr('width','100%')
            .attr('viewBox', `0 0 ${w} ${h}`)
            .style('display','block');

          const projection = d3.geoNaturalEarth1()
            .scale((w / 6.3) * scaleMultiplier)
            .translate([w/2, h/2]);

          const path = d3.geoPath().projection(projection);
          const tooltip = d3.select(tooltipRef.current);

          // Build watched ISO set + reverse lookup iso→name
          const watchedIsos = new Set();
          const isoToName = {};
          Object.entries(COUNTRY_ISO_MAP).forEach(([iso, name]) => {
            if (countriesSet.has(name)) {
              const nid = normId(iso);
              watchedIsos.add(nid);
              isoToName[nid] = name;
            }
          });

          // Track which watched isos actually exist as topojson features
          const mappedIsos = new Set();
          countries.features.forEach(f => {
            const nid = normId(f.id);
            if (watchedIsos.has(nid)) mappedIsos.add(nid);
          });

          // Watched countries with no topojson feature → dots (if centroid known) or pills
          const unmappedNames = [];
          watchedIsos.forEach(iso => {
            if (!mappedIsos.has(iso)) unmappedNames.push(isoToName[iso]);
          });

          // Graticule
          svg.append('path')
            .datum(d3.geoGraticule()())
            .attr('d', path)
            .attr('fill','none')
            .attr('stroke','rgba(255,255,255,0.06)')
            .attr('stroke-width',0.4);

          // Sphere (ocean)
          svg.append('path')
            .datum({type:'Sphere'})
            .attr('d',path)
            .attr('fill','var(--map-ocean)')
            .attr('stroke','var(--border)')
            .attr('stroke-width',0.5);

          // Country paths
          svg.selectAll('.country')
            .data(countries.features)
            .enter().append('path')
            .attr('class','country')
            .attr('d', path)
            .attr('fill', d => watchedIsos.has(normId(d.id)) ? 'var(--accent)' : 'var(--map-land)')
            .attr('stroke','rgba(0,0,0,0.25)')
            .attr('stroke-width',0.3)
            .style('cursor','default')
            .on('mousemove', (event, d) => {
              const nid = normId(d.id);
              const name = COUNTRY_ISO_MAP[nid] || `Unknown (${d.id})`;
              const watched = watchedIsos.has(nid);
              const cnt = countryCounts[name] || 1;
              tooltip
                .style('display','block')
                .style('left', (event.offsetX + 12)+'px')
                .style('top',  (event.offsetY - 8)+'px')
                .html(`<strong>${name}</strong>${watched ? ` — ${cnt} film${cnt!==1?'s':''}` : ''}`);
            })
            .on('mouseleave', () => { tooltip.style('display','none'); });

          // Micro-territory dots: watched places too small to render as paths
          const dotData = [];
          unmappedNames.forEach(name => {
            const centroid = MICRO_CENTROIDS[name];
            if (centroid) {
              const [px, py] = projection(centroid);
              if (px != null && py != null && !isNaN(px) && !isNaN(py)) {
                dotData.push({ name, px, py, cnt: countryCounts[name] || 1 });
              }
            }
          });

          if (dotData.length > 0) {
            svg.selectAll('.micro-dot')
              .data(dotData)
              .enter().append('circle')
              .attr('class','micro-dot')
              .attr('cx', d => d.px)
              .attr('cy', d => d.py)
              .attr('r', 4)
              .attr('fill','var(--accent)')
              .attr('stroke','rgba(255,255,255,0.5)')
              .attr('stroke-width',1)
              .style('cursor','default')
              .on('mousemove', (event, d) => {
                tooltip
                  .style('display','block')
                  .style('left', (event.offsetX + 12)+'px')
                  .style('top',  (event.offsetY - 8)+'px')
                  .html(`<strong>${d.name}</strong> — ${d.cnt} film${d.cnt!==1?'s':''}`);
              })
              .on('mouseleave', () => { tooltip.style('display','none'); });
          }

          // Only truly centroid-less countries go to pills
          const noCentroid = unmappedNames.filter(n => !MICRO_CENTROIDS[n]);
          if (!cancelled) setUnmapped(noCentroid.sort());

          if (!cancelled) setLoaded(true);
        })
        .catch(e=>{ if (!cancelled) setErr('Map failed to load'); });

      return ()=>{ cancelled=true; };
    }, [JSON.stringify([...countriesSet].sort()), JSON.stringify(countryCounts), heightRatio, scaleMultiplier]);

    return (
      <div style={{position:'relative'}}>
        {!loaded && !err && <div style={{height:220,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:13}}>Loading map…</div>}
        {err && <div style={{height:80,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:13}}>{err}</div>}
        <div ref={ref} style={{width:'100%'}}/>
        <div ref={tooltipRef} style={{
          display:'none', position:'absolute', background:'var(--surface2)',
          border:'1px solid var(--border)', borderRadius:7, padding:'5px 10px',
          fontSize:12, color:'var(--text)', pointerEvents:'none', zIndex:10, whiteSpace:'nowrap'
        }}/>
        {unmapped.length > 0 && (
          <div style={{padding:'10px 0 2px',display:'flex',flexWrap:'wrap',alignItems:'center',gap:'5px 6px'}}>
            <span style={{fontSize:10,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.5px',flexShrink:0,marginRight:2}}>Also watched (too small to map):</span>
            {unmapped.map(name => {
              const cnt = countryCounts[name] || 1;
              return (
                <span key={name} title={`${cnt} film${cnt!==1?'s':''}`} style={{
                  display:'inline-flex', alignItems:'center', gap:4,
                  background:'var(--accent)', color:'#fff',
                  borderRadius:5, padding:'2px 8px',
                  fontSize:11, fontWeight:600, whiteSpace:'nowrap'
                }}>
                  {name}{cnt > 1 && <span style={{opacity:.75,fontSize:10}}>×{cnt}</span>}
                </span>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // UTS grading schema
  function utsGrade(pct, gradeOverride) {
    if (gradeOverride === 'X') return { label:'Fail(X)', point:0, color:'#e05252', bg:'rgba(224,82,82,.15)' };
    if (gradeOverride === 'W') return { label:'W',       point:null, color:'#94a3b8', bg:'rgba(148,163,184,.15)' };
    if (gradeOverride === 'Q') return { label:'Q',       point:null, color:'#94a3b8', bg:'rgba(148,163,184,.15)' };
    if (pct === null || pct === undefined) return null;
    if (pct >= 85) return { label:'HD', point:7, color:'#4aac76', bg:'rgba(74,172,118,.15)' };
    if (pct >= 75) return { label:'D',  point:6, color:'#5b96e8', bg:'rgba(91,150,232,.15)' };
    if (pct >= 65) return { label:'C',  point:5, color:'#c98a10', bg:'rgba(201,138,16,.15)' };
    if (pct >= 50) return { label:'P',  point:4, color:'#e07438', bg:'rgba(224,116,56,.15)' };
    return { label:'F',  point:0, color:'#e05252', bg:'rgba(224,82,82,.15)' };
  }

  function subjectCalc(subj) {
    let gradedWeight = 0, weightedScore = 0, totalWeight = 0;
    for (const a of (subj.assessments || [])) {
      totalWeight += (a.weight || 0);
      if (a.score !== null && a.score !== undefined) {
        weightedScore += (a.score * a.weight) / 100;
        gradedWeight  += (a.weight || 0);
      }
    }
    const isComplete = totalWeight > 0 && gradedWeight >= totalWeight * 0.999;
    const projectedPct = gradedWeight > 0 ? (weightedScore / gradedWeight) * 100 : null;
    return { weightedScore, gradedWeight, totalWeight, isComplete, projectedPct };
  }

  function semGPA(semester) {
    let totalCr = 0, wPts = 0;
    let hasInProgress = false;
    for (const s of (semester.subjects || [])) {
      if (s.status !== 'completed' && s.status !== 'inprogress') continue;
      const { weightedScore, gradedWeight } = subjectCalc(s);
      if (s.status === 'inprogress' && gradedWeight === 0) continue; // no grades yet, skip
      if (s.status === 'inprogress') hasInProgress = true;
      const scoreToUse = s.status === 'completed' ? weightedScore : (gradedWeight > 0 ? weightedScore : null);
      if (scoreToUse === null) continue;
      const g = utsGrade(scoreToUse, s.gradeOverride);
      if (g && g.point !== null) { totalCr += (s.credits||6); wPts += g.point * (s.credits||6); }
    }
    return totalCr > 0 ? { gpa: wPts / totalCr, credits: totalCr, projected: hasInProgress } : null;
  }

  function cumulativeGPA(semesters) {
    let totalCr = 0, wPts = 0, hasProjected = false;
    for (const sem of (semesters || [])) {
      if (sem.excludeFromGPA) continue;
      for (const s of (sem.subjects || [])) {
        if (s.status !== 'completed' && s.status !== 'inprogress') continue;
        const { weightedScore, gradedWeight } = subjectCalc(s);
        if (s.status === 'inprogress' && gradedWeight === 0) continue; // no grades yet
        if (s.status === 'inprogress') hasProjected = true;
        const scoreToUse = s.status === 'completed' ? weightedScore : (gradedWeight > 0 ? weightedScore : null);
        if (scoreToUse === null) continue;
        const g = utsGrade(scoreToUse, s.gradeOverride);
        if (g && g.point !== null) { totalCr += (s.credits||6); wPts += g.point * (s.credits||6); }
      }
    }
    return totalCr > 0 ? { gpa: wPts / totalCr, credits: totalCr, projected: hasProjected } : null;
  }

  // WAM = Σ(M×U) / ΣU  — UTS official formula (mark × credit points, summed, divided by total credits)
  // Excludes Q (exempt/advanced standing from other institutions); includes Fail(X) with its mark
  function _wamFromSubjects(subjects, includeInprogress) {
    let sumMU = 0, sumU = 0;
    for (const s of (subjects || [])) {
      if (s.status !== 'completed' && !(includeInprogress && s.status === 'inprogress')) continue;
      if (s.gradeOverride === 'Q') continue; // exempt — not included in WAM
      const { weightedScore, gradedWeight } = subjectCalc(s);
      if (gradedWeight === 0) continue; // no marks recorded at all
      const u = s.credits || 6;
      // For W (withdrawn/fail) use 0 as the mark per UTS policy
      const m = s.gradeOverride === 'W' ? 0 : weightedScore;
      sumMU += m * u;
      sumU  += u;
    }
    return sumU > 0 ? { wam: sumMU / sumU, credits: sumU } : null;
  }

  function semWAM(semester) {
    // Semester WAM — completed subjects only (no projected)
    return _wamFromSubjects(semester.subjects, false);
  }

  function computeWAM(semesters) {
    // Cumulative WAM across semesters not flagged excludeFromGPA
    // Includes in-progress subjects that have graded assessments (projected)
    let sumMU = 0, sumU = 0, hasProjected = false;
    for (const sem of (semesters || [])) {
      if (sem.excludeFromGPA) continue;
      for (const s of (sem.subjects || [])) {
        if (s.status !== 'completed' && s.status !== 'inprogress') continue;
        if (s.gradeOverride === 'Q') continue;
        const { weightedScore, gradedWeight } = subjectCalc(s);
        if (gradedWeight === 0) continue; // no marks at all
        if (s.status === 'inprogress') hasProjected = true;
        const u = s.credits || 6;
        const m = s.gradeOverride === 'W' ? 0 : weightedScore;
        sumMU += m * u;
        sumU  += u;
      }
    }
    return sumU > 0 ? { wam: sumMU / sumU, credits: sumU, projected: hasProjected } : null;
  }

  /* ── DEFAULT UNI DATA (pre-loaded from transcript) ───────────── */
