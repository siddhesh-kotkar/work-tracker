                <div className="uni-gpa-sub">{g.credits}cr graded · <GradeBadge pct={(g.gpa/7)*100} size={11} /></div>
              </div>
            );
          })}
        </div>

        {[...(uniData.semesters||[])].reverse().map(sem => (
          <UniSemBlock key={sem.id} sem={sem} onUpdateSem={updateSem} onDeleteSem={deleteSem} />
        ))}
        <button className="uni-sem-add-subj" style={{ display:'block', width:'100%', marginTop:4 }}
          onClick={() => setAddSem(true)}>+ Add Semester</button>

        {addSem && <UniSemModal onSave={addSemester} onClose={() => setAddSem(false)} />}
      </div>
    );
  }

  /* ── PLANNER VIEW ─────── */
  function UniPlannerView({ uniData, onUpdate }) {
    const [semFilter, setSemFilter] = React.useState((uniData.semesters?.slice(-1)[0]?.id) || '');
    const [modal,     setModal]     = React.useState(null);
    const [dragOver,  setDragOver]  = React.useState(null); // `${semId}-${subjId}-${colId}`
    const dragRef = React.useRef(null); // { semId, subjId, assessId }
    const sems = uniData.semesters || [];
    const activeSems = semFilter ? sems.filter(s => s.id===semFilter) : sems;

    function moveCard(semId, subjId, assessId, newStatus) {
      onUpdate(d => ({
        ...d,
        semesters: d.semesters.map(sem => sem.id!==semId ? sem : {
          ...sem,
          subjects: sem.subjects.map(subj => subj.id!==subjId ? subj : {
            ...subj,
            assessments: subj.assessments.map(a => a.id===assessId ? { ...a, plannerStatus:newStatus } : a)
          })
        })
      }));
    }

    function saveAssessPlan(semId, subjId, saved) {
      onUpdate(d => ({
        ...d,
        semesters: d.semesters.map(sem => sem.id!==semId ? sem : {
          ...sem,
          subjects: sem.subjects.map(subj => subj.id!==subjId ? subj : {
            ...subj,
            assessments: subj.assessments.find(a => a.id===saved.id)
              ? subj.assessments.map(a => a.id===saved.id ? saved : a)
              : subj.assessments
          })
        })
      }));
      setModal(null);
    }

    return (
      <div>
        <div className="uni-pl-filter">
          <span className="uni-pl-filter-lbl">Semester</span>
          <div className="uni-view-toggle uni-sem-filter">
            <button className={`uni-vtab ${!semFilter?'active':''}`} onClick={() => setSemFilter('')}>All</button>
            {sems.map(s => <button key={s.id} className={`uni-vtab ${semFilter===s.id?'active':''}`} onClick={() => setSemFilter(s.id)}>{s.label}</button>)}
          </div>
          <span className="uni-pl-hint">Drag cards between columns to update status (press and hold on touch)</span>
        </div>

        {activeSems.map(sem => {
          const subjects = sem.subjects || [];
          const countByStatus = id => subjects.flatMap(s => s.assessments||[]).filter(a => a.plannerStatus===id).length;
          return (
            <div key={sem.id} className="uni-pl-table">
              <div className="uni-planner-sem-hdr">{sem.label}</div>
              <div className="uni-pl-grid">
                <div className="uni-pl-hdr-row">
                  <div className="uni-pl-corner">Subject</div>
                  {UNI_PLAN_COLS.map(col => (
                    <div key={col.id} className="uni-pl-col-hdr" style={{ borderTopColor:col.color }}>
                      <div className="uni-pl-col-dot" style={{ background:col.color }} />
                      <div className="uni-pl-col-lbl">{col.label}</div>
                      <div className="uni-pl-col-cnt">{countByStatus(col.id)}</div>
                    </div>
                  ))}
                </div>
                {subjects.map(subj => {
                  const calc = subjectCalc(subj);
                  const g = utsGrade(calc.gradedWeight>0 ? calc.weightedScore : null, subj.gradeOverride);
                  return (
                    <div key={subj.id} className="uni-pl-row">
                      <div className="uni-pl-subj-cell" style={{ borderLeftColor:g?.color||'#5b6af0' }}>
                        <div className="uni-pl-subj-code">{subj.code}</div>
                        <div className="uni-pl-subj-name">{subj.name}</div>
                        <div className="uni-pl-subj-grd">
                          {calc.gradedWeight > 0
                            ? <><span style={{ color:g?.color }}>{calc.weightedScore.toFixed(1)}%</span>
                                {' '}<GradeBadge pct={calc.weightedScore} override={subj.gradeOverride} size={11} /></>
                            : <span style={{ color:'var(--text3)' }}>Not started</span>}
                        </div>
                      </div>
                      {UNI_PLAN_COLS.map(col => {
                        const cellKey = `${sem.id}-${subj.id}-${col.id}`;
                        const cards = (subj.assessments||[]).filter(a => a.plannerStatus===col.id);
                        const isOver = dragOver === cellKey;
                        return (
                          <div key={col.id} data-col={col.label}
                            className={`uni-pl-cell${isOver ? ' drag-over' : ''}`}
                            onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; setDragOver(cellKey); }}
                            onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                            onDrop={e => {
                              e.preventDefault();
                              setDragOver(null);
                              if (!dragRef.current) return;
                              const { semId, subjId, assessId } = dragRef.current;
                              if (semId===sem.id && subjId===subj.id) moveCard(semId, subjId, assessId, col.id);
                              dragRef.current = null;
                            }}>
                            {cards.length===0 && !isOver && <div className="uni-pl-empty">Empty</div>}
                            {cards.map(a => {
                              const ag = utsGrade(a.score, null);
                              const dl = a.deadline ? fmtDate(a.deadline) : null;
                              const isDragging = dragRef.current?.assessId === a.id;
                              // Solid colour: grade colour if scored, otherwise planner col colour
                              const cardBg = ag?.color || col.color;
                              return (
                                <div key={a.id}
                                  className={`uni-pl-card tint${isDragging ? ' is-dragging' : ''}`}
                                  style={{ '--cc':cardBg }}
                                  draggable={true}
                                  onDragStart={e => {
                                    dragRef.current = { semId:sem.id, subjId:subj.id, assessId:a.id };
                                    e.dataTransfer.effectAllowed = 'move';
                                    e.dataTransfer.setData('text/plain', a.id);
                                  }}
                                  onDragEnd={() => { dragRef.current = null; setDragOver(null); }}
                                  onClick={() => setModal({ semId:sem.id, subjId:subj.id, assess:a })}>
                                  <div className="uni-pl-card-name">{a.name}</div>
                                  <div className="uni-pl-card-meta">
                                    <span>{a.weight}%</span>
                                    {a.score!==null && a.score!==undefined && <>
                                      <span>·</span>
                                      <span style={{ color:'#fff', fontWeight:700 }}>{a.score}%</span>
                                    </>}
                                    {(a.score===null||a.score===undefined) && <span style={{ color:'rgba(255,255,255,0.55)' }}>No score yet</span>}
                                    {dl && <><span>·</span><span>{dl}</span></>}
                                  </div>
                                  {(a.subtasks||[]).length > 0 && (
                                    <SubtaskMini
                                      task={a}
                                      onToggle={(assessId, stId) => {
                                        onUpdate(d => ({ ...d, semesters: d.semesters.map(sem2 => sem2.id!==sem.id ? sem2 : { ...sem2,
                                          subjects: sem2.subjects.map(subj2 => subj2.id!==subj.id ? subj2 : { ...subj2,
                                            assessments: subj2.assessments.map(a2 => a2.id!==assessId ? a2 : { ...a2,
                                              subtasks: (a2.subtasks||[]).map(s => s.id===stId ? {...s,done:!s.done} : s)
                                            })
                                          })
                                        })}));
                                      }}
                                      solid={false} />
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}

        {modal && (
          <UniAssessModal assess={modal.assess}
            onSave={saved => saveAssessPlan(modal.semId, modal.subjId, saved)}
            onDelete={() => setModal(null)}
            onClose={() => setModal(null)} />
        )}
      </div>
    );
  }

  function UniView({ uniData, onUpdate }) {
    const [view, setView] = React.useState('grades');
    return (
      <div className="uni-wrap">
        <div className="uni-top">
          <div className="uni-view-toggle">
            <button className={`uni-vtab ${view==='grades'?'active':''}`} onClick={() => setView('grades')}>Grades</button>
            <button className={`uni-vtab ${view==='planner'?'active':''}`} onClick={() => setView('planner')}>Planner</button>
          </div>
          <span className="uni-course">UTS Business Analytics</span>
        </div>
        {view==='grades'  && <UniGradesView  uniData={uniData} onUpdate={onUpdate} />}
        {view==='planner' && <UniPlannerView uniData={uniData} onUpdate={onUpdate} />}
      </div>
    );
  }

  /* ── MOVIES COMPONENTS ───────────────────────────────────────── */

  function StarRating({ value, onChange, size=18, readOnly=false }) {
    const [hov, setHov] = React.useState(null);
    const disp = hov !== null ? hov : (value || 0);
    function hm(e, s) { if (readOnly) return; const rc=e.currentTarget.getBoundingClientRect(); setHov(e.clientX-rc.left < rc.width/2 ? s-0.5 : s); }
    function hc(e, s) { if (readOnly) return; const rc=e.currentTarget.getBoundingClientRect(); const v=e.clientX-rc.left < rc.width/2 ? s-0.5 : s; onChange(value===v?null:v); }
    return (
      <div style={{ display:'flex', gap:2 }} onMouseLeave={() => !readOnly && setHov(null)}>
        {[1,2,3,4,5].map(s => {
          const filled = disp >= s; const half = !filled && disp >= s-0.5; const c='#c98a10';
          return (
            <div key={s} style={{ position:'relative', width:size, height:size, cursor:readOnly?'default':'pointer', flexShrink:0 }}
              onMouseMove={e=>hm(e,s)} onClick={e=>hc(e,s)}>
              <svg width={size} height={size} viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="none" stroke="var(--text3)" strokeWidth="1.5" strokeLinejoin="round"/></svg>
              {half && <svg width={size} height={size} viewBox="0 0 24 24" style={{position:'absolute',left:0,top:0}}><defs><clipPath id={`shc${s}`}><rect x="0" y="0" width="12" height="24"/></clipPath></defs><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill={c} stroke={c} strokeWidth="1.5" strokeLinejoin="round" clipPath={`url(#shc${s})`}/></svg>}
              {filled && <svg width={size} height={size} viewBox="0 0 24 24" style={{position:'absolute',left:0,top:0}}><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill={c} stroke={c} strokeWidth="1.5" strokeLinejoin="round"/></svg>}
            </div>
          );
        })}
      </div>
    );
  }

  const WATCH_REGIONS = [
    ['AU','Australia'],['CA','Canada'],['FR','France'],['DE','Germany'],['IN','India'],
    ['IT','Italy'],['JP','Japan'],['MX','Mexico'],['NL','Netherlands'],['NZ','New Zealand'],
    ['ES','Spain'],['SE','Sweden'],['GB','United Kingdom'],['US','United States'],
  ];

  function WatchProviders({ tmdbId, tmdbKey, title }) {
    const [region, setRegion] = React.useState('US');
    const [detected, setDetected] = React.useState(false);
    const [data, setData] = React.useState(null);
    const [loading, setLoading] = React.useState(false);
    const [err, setErr] = React.useState('');

    // Auto-detect country from IP on first mount
    React.useEffect(() => {
      fetch('https://ipapi.co/country_code/')
        .then(r => r.text())
        .then(code => {
          const c = code.trim().toUpperCase();
          if (WATCH_REGIONS.some(([rc]) => rc === c)) { setRegion(c); setDetected(true); }
        })
        .catch(() => {}); // silently fall back to US
    }, []);

    React.useEffect(() => {
      if (!tmdbId || !tmdbKey) return;
      setLoading(true); setErr(''); setData(null);
      tmdbGetWatchProviders(tmdbId, tmdbKey)
        .then(results => { setData(results); setLoading(false); })
        .catch(() => { setErr('Could not load streaming info.'); setLoading(false); });
    }, [tmdbId, tmdbKey]);

    const jwUrl = `https://www.justwatch.com/us/search?q=${encodeURIComponent(title||'')}`;
    const regionData = data ? data[region] : null;
    const streaming = regionData?.flatrate || [];
    const rent = regionData?.rent || [];
    const buy = regionData?.buy || [];
    const hasAny = streaming.length || rent.length || buy.length;

    function ProviderRow({ label, providers }) {
      if (!providers.length) return null;
      return (
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
          <span style={{fontSize:10,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.5px',width:56,flexShrink:0}}>{label}</span>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {providers.map(p => (
              <a key={p.provider_id} href={regionData?.link||jwUrl} target="_blank" rel="noopener noreferrer" title={p.provider_name}
                style={{display:'block',borderRadius:8,overflow:'hidden',width:32,height:32,flexShrink:0,textDecoration:'none',border:'1px solid var(--border)'}}>
                {p.logo_path
                  ? <img src={`https://image.tmdb.org/t/p/original${p.logo_path}`} alt={p.provider_name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  : <div style={{width:'100%',height:'100%',background:'var(--surface2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'var(--text3)'}}>{p.provider_name.slice(0,3)}</div>}
              </a>
            ))}
          </div>
        </div>
      );
    }

    return (
      <div style={{borderTop:'1px solid var(--border)',marginTop:12,paddingTop:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>📺 Where to watch</span>
          <div style={{display:'flex',alignItems:'center',gap:4,marginLeft:'auto'}}>
            {detected && <span title="Auto-detected from your location" style={{fontSize:11,color:'var(--text3)'}}>📍</span>}
            <select value={region} onChange={e=>{setRegion(e.target.value);setDetected(false);}}
              style={{fontSize:11,padding:'2px 6px',borderRadius:6,border:'1px solid var(--border)',background:'var(--surface2)',color:'var(--text)',cursor:'pointer'}}>
              {WATCH_REGIONS.map(([code,name])=><option key={code} value={code}>{name}</option>)}
            </select>
          </div>
        </div>
        {!tmdbKey && (
          <div style={{fontSize:12,color:'var(--text3)'}}>Add a TMDB key in Settings to see streaming info.</div>
        )}
        {tmdbKey && !tmdbId && (
          <div style={{fontSize:12,color:'var(--text3)'}}>
            No TMDB ID — <a href={jwUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--accent)'}}>search JustWatch ↗</a>
          </div>
        )}
        {tmdbKey && tmdbId && loading && <div style={{fontSize:12,color:'var(--text3)'}}>Loading…</div>}
        {tmdbKey && tmdbId && err && <div style={{fontSize:12,color:'var(--text3)'}}>{err}</div>}
        {tmdbKey && tmdbId && data && !loading && (
          hasAny ? (
            <div>
              <ProviderRow label="Stream" providers={streaming}/>
              <ProviderRow label="Rent" providers={rent}/>
              <ProviderRow label="Buy" providers={buy}/>
              <a href={regionData?.link||jwUrl} target="_blank" rel="noopener noreferrer"
                style={{fontSize:11,color:'var(--accent)',textDecoration:'none',display:'inline-block',marginTop:4}}>
                View on JustWatch ↗
              </a>
            </div>
          ) : (
            <div style={{fontSize:12,color:'var(--text3)'}}>
              Not available to stream in {WATCH_REGIONS.find(([c])=>c===region)?.[1]||region} right now. <a href={jwUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--accent)'}}>Check JustWatch ↗</a>
            </div>
          )
        )}
      </div>
    );
  }

  function MovieAddModal({ movie, tmdbKey, defaultTrackYear, onSave, onDelete, onClose }) {
    const isEdit = !!movie;
    const [q, setQ] = React.useState('');
    const [results, setResults] = React.useState([]);
    const [searching, setSearching] = React.useState(false);
    const [loadingDetails, setLoadingDetails] = React.useState(false);
    const [searchErr, setSearchErr] = React.useState('');
    const [showSearch, setShowSearch] = React.useState(!!tmdbKey);

    const defaultWatchDate = (defaultTrackYear && Number.isInteger(defaultTrackYear) && defaultTrackYear > 1900) ? String(defaultTrackYear) : '';
    const blank = { title:'', director:'', releaseYear:defaultTrackYear, trackYear:null, genres:[], runtime:'', posterPath:'', tmdbId:null, overview:'', rating:null, watchDate:defaultWatchDate, notes:'', language:'', country:'', studio:'', isAllTime:false, honourableMention:false };
    const [form, setForm] = React.useState(isEdit ? { ...blank, ...movie, genres:Array.isArray(movie.genres)?movie.genres:[], runtime:movie.runtime||'' } : blank);
    const [genresStr, setGenresStr] = React.useState((form.genres||[]).join(', '));

    async function doSearch() {
      if (!q.trim()) return;
      if (!tmdbKey) { setSearchErr('Add your TMDB API key in Settings first.'); return; }
      setSearching(true); setSearchErr('');
      try { setResults((await tmdbSearch(q.trim(), tmdbKey)).slice(0,8)); }
      catch(e) { setSearchErr('Search failed — check your TMDB API key.'); }
      setSearching(false);
    }
    async function pickResult(r) {
      setLoadingDetails(true);
      const yr = r.release_date ? parseInt(r.release_date.slice(0,4)) : defaultTrackYear;
      let director='', genres=[], runtime='', language='', country='';
      if (tmdbKey) {
        try {
          const d = await tmdbGetDetails(r.id, tmdbKey);
          director = (d.credits?.crew||[]).find(c=>c.job==='Director')?.name || '';
          genres = (d.genres||[]).map(g=>g.name);
          runtime = d.runtime || '';
          language = d.original_language || r.original_language || '';
          country = (d.production_countries||[])[0]?.name || '';
        } catch(e) {
          genres=(r.genre_ids||[]).map(id=>TMDB_GENRES[id]).filter(Boolean);
          language = r.original_language || '';
        }
      } else {
        genres=(r.genre_ids||[]).map(id=>TMDB_GENRES[id]).filter(Boolean);
        language = r.original_language || '';
      }
      setForm(f=>({...f, tmdbId:r.id, title:r.title, releaseYear:yr, director, genres, runtime, posterPath:r.poster_path||'', overview:r.overview||'', language, country}));
      setGenresStr(genres.join(', '));
      setLoadingDetails(false);
      setResults([]);
      setShowSearch(false);
    }
    function syncGenres(str) { setGenresStr(str); setForm(f=>({...f, genres:str.split(',').map(s=>s.trim()).filter(Boolean)})); }
    function save() {
      if (!form.title.trim()) return;
      const wd = form.watchDate ? String(parseInt(form.watchDate)) : '';
      const isValidYear = wd && !isNaN(parseInt(wd));
      onSave({ id:movie?.id||uid(), ...form, watchDate: isValidYear ? wd : '', trackYear: isValidYear ? parseInt(wd) : null, genres:genresStr.split(',').map(s=>s.trim()).filter(Boolean) });
    }
    return (
      <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal" style={{ maxWidth:520 }}>
          <div className="modal-hdr">
            <div className="modal-title">{isEdit?'Edit Film':'Add Film'}</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div>
            {/* TMDB SEARCH — optional, inline */}
            {tmdbKey && (
              <div style={{ marginBottom:16 }}>
                {!showSearch ? (
                  <span className="mv-manual-link" onClick={()=>setShowSearch(true)}>🔍 Search TMDB to auto-fill</span>
                ) : (
                  <>
                    <div className="mv-modal-search">
                      <input className="mv-search-in" placeholder="Search by title…" value={q} autoFocus
                        onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()} />
                      <button className="mv-search-btn" onClick={doSearch} disabled={searching}>{searching?'…':'Search'}</button>
                    </div>
                    {searchErr && <div style={{ fontSize:12, color:'#e05252', marginBottom:8 }}>{searchErr}</div>}
                    {loadingDetails && <div style={{ fontSize:13, color:'var(--text2)', marginBottom:8 }}>Fetching details…</div>}
                    {results.length > 0 && (
                      <div className="mv-results-list">
                        {results.map(r=>(
                          <div key={r.id} className="mv-result-row" onClick={()=>pickResult(r)}>
                            <div className="mv-result-poster">
                              {r.poster_path ? <img src={TMDB_IMG+r.poster_path} alt="" /> : <div style={{width:'100%',height:'100%',background:'var(--surface2)'}}/>}
                            </div>
                            <div>
                              <div className="mv-result-title">{r.title}</div>
                              <div className="mv-result-meta">{r.release_date?r.release_date.slice(0,4):'—'}{r.vote_average?` · ★ ${r.vote_average.toFixed(1)}`:''}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                    <span className="mv-manual-link" onClick={()=>{setShowSearch(false);setResults([]);}}>Hide search</span>
                  </>
                )}
              </div>
            )}
            {/* FORM — always visible */}
            <div className="mv-form-grid">
              <div className="mv-form-field full" style={{ flexDirection:'row', gap:14, alignItems:'flex-start' }}>
                {form.posterPath && (
                  <div style={{ width:80, height:120, borderRadius:8, overflow:'hidden', flexShrink:0 }}>
                    <img src={TMDB_IMG+form.posterPath} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} />
                  </div>
                )}
                <div style={{ flex:1, display:'flex', flexDirection:'column', gap:10 }}>
                  <div className="mv-form-field">
                    <div className="mv-form-lbl">Title *</div>
                    <input className="mv-form-in" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Film title" />
                  </div>
                  <div className="mv-form-field">
                    <div className="mv-form-lbl">Director</div>
                    <input className="mv-form-in" value={form.director} onChange={e=>setForm(f=>({...f,director:e.target.value}))} placeholder="Director name" />
                  </div>
                </div>
              </div>
              <div className="mv-form-field">
                <div className="mv-form-lbl">Release Year</div>
                <input className="mv-form-in" type="number" min="1900" max="2099" value={form.releaseYear} onChange={e=>{
                  const ry = parseInt(e.target.value)||defaultTrackYear;
                  const watchedAtRelease = String(form.watchDate) === String(form.releaseYear);
                  setForm(f=>({...f, releaseYear:ry, trackYear:ry, watchDate: watchedAtRelease ? String(ry) : f.watchDate }));
                }} />
              </div>
              <div className="mv-form-field">
                <div className="mv-form-lbl" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
                  <span>Year Watched <span style={{fontWeight:400,color:'var(--text3)',fontSize:10}}>(leave blank = Undated)</span></span>
                  <label style={{display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:600,color:'var(--text2)',cursor:'pointer',whiteSpace:'nowrap'}}>
                    <input type="checkbox"
                      checked={form.releaseYear ? String(form.watchDate)===String(form.releaseYear) : false}
                      onChange={e=>{ if(e.target.checked && form.releaseYear) setForm(f=>({...f,watchDate:String(f.releaseYear)})); else setForm(f=>({...f,watchDate:''})); }}
                      style={{accentColor:'var(--accent)'}}
                    />
                    Watched at release
                  </label>
                </div>
                <input className="mv-form-in" type="number" min="1900" max="2099" placeholder="e.g. 2024" value={form.watchDate} onChange={e=>setForm(f=>({...f,watchDate:e.target.value}))} />
              </div>
              <div className="mv-form-field full">

  /* shared duplicate-finder — works for films or TV shows */
  function FindDuplicatesModal({ items, noun, renderMeta, onDelete, onClose }) {
    // Group by lowercase title
    const groups = React.useMemo(() => {
      const map = {};
      for (const item of items) {
        const key = item.title.trim().toLowerCase();
        if (!map[key]) map[key] = [];
        map[key].push(item);
      }
      return Object.values(map).filter(g => g.length > 1).sort((a,b)=>a[0].title.localeCompare(b[0].title));
    }, [items]);

    const [deleted, setDeleted] = React.useState(new Set());

    function handleDelete(id) {
      onDelete(id);
      setDeleted(s => new Set([...s, id]));
    }

    return (
      <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal" style={{maxWidth:540}}>
          <div className="modal-hdr">
            <div className="modal-title">Duplicate {noun === 'film' ? 'Films' : 'Shows'}</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div className="modal-body" style={{maxHeight:'70vh',overflowY:'auto'}}>
            {groups.length === 0 ? (
              <div style={{textAlign:'center',padding:'32px 0',color:'var(--text3)'}}>
                <div style={{fontSize:32,marginBottom:8}}>✅</div>
                <div style={{fontWeight:600}}>No duplicates found</div>
                <div style={{fontSize:13,marginTop:4}}>Your library looks clean!</div>
              </div>
            ) : (
              <>
                <div style={{fontSize:13,color:'var(--text3)',marginBottom:12}}>
                  {groups.length} duplicate group{groups.length!==1?'s':''} found — keep one and delete the rest.
                </div>
                {groups.map((group, gi) => (
                  <div key={gi} style={{border:'1px solid var(--border)',borderRadius:10,overflow:'hidden',marginBottom:12}}>
                    <div style={{background:'var(--surface2)',padding:'7px 12px',fontSize:11,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.5}}>
                      "{group[0].title}" — {group.length} entries
                    </div>
                    {group.map((item, ii) => {
                      const isDel = deleted.has(item.id);
                      return (
                        <div key={item.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderTop:ii>0?'1px solid var(--border)':'none',opacity:isDel?.4:1,background:isDel?'var(--surface2)':'var(--surface)',transition:'opacity .2s'}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontWeight:600,fontSize:13,color:isDel?'var(--text3)':'var(--text)'}}>{item.title}</div>
                            <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{renderMeta(item)}</div>
                          </div>
                          {isDel ? (
                            <span style={{fontSize:11,color:'var(--text3)',fontStyle:'italic'}}>deleted</span>
                          ) : (
                            <button onClick={()=>handleDelete(item.id)}
                              style={{padding:'4px 10px',borderRadius:6,border:'1px solid var(--border)',background:'var(--surface2)',color:'var(--text2)',fontSize:12,cursor:'pointer',flexShrink:0,transition:'all .15s'}}
                              onMouseEnter={e=>{e.target.style.background='rgba(220,60,60,.15)';e.target.style.color='#e05050';e.target.style.borderColor='rgba(220,60,60,.4)';}}
                              onMouseLeave={e=>{e.target.style.background='var(--surface2)';e.target.style.color='var(--text2)';e.target.style.borderColor='var(--border)';}}>
                              Delete
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </>
            )}
          </div>
          <div className="modal-footer">
            <div style={{fontSize:12,color:'var(--text3)'}}>{deleted.size > 0 ? `${deleted.size} entr${deleted.size!==1?'ies':'y'} deleted` : ''}</div>

  function BulkEnrichModal({ movies, tmdbKey, onApply, onClose }) {
    // Films that are missing any of: country, language, runtime, director, releaseYear, studio
    const needsEnrich = React.useMemo(()=>
      movies.filter(m => !m.country || !m.language || !m.runtime || !m.director || !m.releaseYear || !m.studio || m.watchAtRelease),
      [movies]
    );

    const IDLE = 'idle', RUNNING = 'running', DONE = 'done';
    const [phase, setPhase] = React.useState(IDLE);
    const [rows, setRows] = React.useState(()=>
      needsEnrich.map(m=>({ id:m.id, title:m.title, releaseYear:m.releaseYear, tmdbId:m.tmdbId, status:'pending', detail:'' }))
    );
    const [summary, setSummary] = React.useState(null);
    const cancelRef = React.useRef(false);

    function setRow(id, patch) {
      setRows(rs => rs.map(r => r.id===id ? {...r,...patch} : r));
    }

    async function run() {
      if (!tmdbKey) return;
      cancelRef.current = false;
      setPhase(RUNNING);
      const patches = {};
      let enriched = 0, failed = 0, skipped = 0;

      for (const row of needsEnrich) {
        if (cancelRef.current) break;
        setRow(row.id, { status:'running', detail:'Searching…' });

        try {
          let details = null;

          // If we have a tmdbId, fetch directly
          if (row.tmdbId) {
            setRow(row.id, { status:'running', detail:'Fetching details…' });
            const r = await fetch(`https://api.themoviedb.org/3/movie/${row.tmdbId}?api_key=${encodeURIComponent(tmdbKey)}&append_to_response=credits`);
            if (r.ok) details = await r.json();
          }

          // Otherwise search by title + year
          if (!details) {
            const q = encodeURIComponent(row.title);
            const yr = row.releaseYear ? `&year=${row.releaseYear}` : '';
            const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(tmdbKey)}&query=${q}${yr}&include_adult=false`);
            if (r.ok) {
              const res = await r.json();
              const hit = (res.results||[])[0];
              if (hit) {
                setRow(row.id, { status:'running', detail:'Fetching details…' });
                const r2 = await fetch(`https://api.themoviedb.org/3/movie/${hit.id}?api_key=${encodeURIComponent(tmdbKey)}&append_to_response=credits`);
                if (r2.ok) details = await r2.json();
              }
            }
          }

          if (details) {
            const director = (details.credits?.crew||[]).find(c=>c.job==='Director')?.name || '';
            const country  = (details.production_countries||[])[0]?.name || '';
            const language = details.original_language || '';
            const runtime  = details.runtime ? String(details.runtime) : '';
            const genres   = (details.genres||[]).map(g=>g.name);
            const posterPath = details.poster_path || '';
            const overview = details.overview || '';
            const tmdbId   = details.id;

            // Only patch fields that were actually missing
            const orig = movies.find(m=>m.id===row.id)||{};
            const releaseYear = details.release_date ? parseInt(details.release_date.slice(0,4)) : null;
            const studio = (details.production_companies||[])[0]?.name || '';
            const patch = { tmdbId };
            if (!orig.releaseYear && releaseYear) patch.releaseYear = releaseYear;
            if (!orig.studio    && studio)    patch.studio    = studio;
            if (!orig.country   && country)   patch.country   = country;
            if (!orig.language  && language)  patch.language  = language;
            if (!orig.runtime   && runtime)   patch.runtime   = runtime;
            if (!orig.director  && director)  patch.director  = director;
            if ((!orig.genres||!orig.genres.length) && genres.length) patch.genres = genres;
            if (!orig.posterPath && posterPath) patch.posterPath = posterPath;
            if (!orig.overview  && overview)  patch.overview  = overview;
            // If bulk-added with "watched at release", fill watch year from release year
            if (orig.watchAtRelease && releaseYear && !orig.watchDate) {
              patch.watchDate = String(releaseYear);
              patch.trackYear = releaseYear;
              patch.watchAtRelease = false; // clear the flag once applied
            }

            patches[row.id] = patch;
            const filled = Object.keys(patch).filter(k=>k!=='tmdbId').join(', ') || 'nothing new';
            setRow(row.id, { status:'done', detail:`Filled: ${filled}` });
            enriched++;
          } else {
            setRow(row.id, { status:'failed', detail:'Not found on TMDB' });
            failed++;
          }
        } catch(e) {
          setRow(row.id, { status:'failed', detail:'Error: '+e.message });
          failed++;
        }

        // Small delay to avoid rate-limiting
        await new Promise(r=>setTimeout(r,220));
      }

      setSummary({ enriched, failed, skipped });
      setPhase(DONE);

      // Apply all patches
      if (Object.keys(patches).length > 0) {
        onApply(patches);
      }
    }

    const noKey = !tmdbKey;

    return (
      <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
        <div className="modal-box" style={{maxWidth:560,maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
          <div className="modal-header">
            <div className="modal-title">Bulk Enrich Films</div>
            <button className="modal-close" onClick={onClose} aria-label="Close"><Icon name="x" size={18} /></button>
          </div>
          <div style={{padding:'14px 20px',borderBottom:'1px solid var(--border)',fontSize:13,color:'var(--text2)'}}>
            {needsEnrich.length === 0
              ? <span style={{color:'#4aac76',fontWeight:600}}>✓ All films already have full metadata.</span>
              : <span><strong style={{color:'var(--text)'}}>{needsEnrich.length}</strong> film{needsEnrich.length!==1?'s':''} missing country, language, runtime or director — TMDB will fill them automatically.</span>
            }
            {noKey && <div style={{marginTop:8,color:'#e05252',fontWeight:600}}>⚠ No TMDB API key set. Add it in Settings first.</div>}
          </div>
          <div style={{flex:1,overflowY:'auto',padding:'6px 20px'}}>
            {rows.map(r=>(
              <div key={r.id} className="enrich-row">
                <div className={`enrich-status ${r.status}`}>
                  {r.status==='pending'?'·' : r.status==='running'?'…' : r.status==='done'?'✓' : r.status==='failed'?'✕' : '–'}
                </div>
                <div className="enrich-title">{r.title}{r.releaseYear?` (${r.releaseYear})`:''}</div>
                {r.detail && <div className="enrich-detail">{r.detail}</div>}
              </div>
            ))}
            {needsEnrich.length===0 && (
              <div style={{textAlign:'center',padding:'30px 0',color:'var(--text3)',fontSize:13}}>Nothing to enrich.</div>
            )}
          </div>
          {summary && (
            <div style={{padding:'10px 20px',borderTop:'1px solid var(--border)',fontSize:12,color:'var(--text2)',display:'flex',gap:16}}>
              <span style={{color:'#4aac76',fontWeight:700}}>✓ {summary.enriched} updated</span>
              {summary.failed>0 && <span style={{color:'#e05252',fontWeight:700}}>✕ {summary.failed} failed</span>}
            </div>
          )}
          <div className="modal-footer">
            <div className="modal-actions">
              <button className="btn-cancel" onClick={()=>{ cancelRef.current=true; onClose(); }}>
                {phase===RUNNING ? 'Cancel' : 'Close'}
              </button>
              {phase===IDLE && needsEnrich.length>0 && !noKey && (
                <button className="btn-save" onClick={run}>Enrich {needsEnrich.length} Film{needsEnrich.length!==1?'s':''}</button>
              )}
              {phase===DONE && <button className="btn-save" onClick={onClose}>Done</button>}
            </div>
          </div>
        </div>
      </div>
    );
  }

  function MoviesView({ movieData, onUpdate, tmdbKey }) {
    const [year, setYear] = React.useState('all');
    const [subView, setSubView] = React.useState('films');
    const [atTab, setAtTab] = React.useState('films');
    const [gridMode, setGridMode] = React.useState('grid');
    const [groupByRelease, setGroupByRelease] = React.useState(false);
    const [modal, setModal] = React.useState(null);
    const [enrichModal, setEnrichModal] = React.useState(false);
    const [bulkAddModal, setBulkAddModal] = React.useState(false);
    const [dupesModal, setDupesModal] = React.useState(false);
    const [search, setSearch] = React.useState('');
    const [dragId, setDragId] = React.useState(null);
    const [dragOver, setDragOver] = React.useState(null);

    const movies = movieData.movies || [];
    const isAllTime     = year === 'alltime';
    const isUndated     = year === 'undated';
    const isStats       = year === 'stats';
    const isGenres      = year === 'genres';
    const isUnrated     = year === 'unrated';
    const isReleaseYear = year === 'releaseyear';
    const isStudio      = year === 'studio';
    const isAllMovies   = year === 'all';
    const isSpecial = isAllTime || isStats || isGenres || isUnrated || isReleaseYear || isStudio || isAllMovies;

    // Search filter — applied to year views and all-films view
    const searchFilter = m => !search.trim() ||
      m.title.toLowerCase().includes(search.toLowerCase()) ||
      (m.director||'').toLowerCase().includes(search.toLowerCase()) ||
      (m.studio||'').toLowerCase().includes(search.toLowerCase());

    // Count per watch-year for sidebar badges
    const yearCounts = React.useMemo(() => {
      const counts = {};
      for (const m of movies) {
        const wy = m.watchDate ? parseInt(m.watchDate) : m.trackYear;
        if (wy) counts[wy] = (counts[wy]||0) + 1;
      }
      return counts;
    }, [JSON.stringify(movies.map(m=>m.watchDate||m.trackYear))]);
    const undatedMovies = movies.filter(m => {
      const wy = m.watchDate ? parseInt(m.watchDate) : m.trackYear;
      return !wy || isNaN(wy);
    });
    const yearMovies = isUndated ? undatedMovies : movies.filter(m => {
      const wy = m.watchDate ? parseInt(m.watchDate) : m.trackYear;
      return wy === year;
    });
    const allTimeMovies = [...movies.filter(m=>m.isAllTime)].sort((a,b)=>(a.allTimeRank||999)-(b.allTimeRank||999));

    // Genre grouping — all movies across all years
    const { genreMap, sortedGenres } = React.useMemo(() => {
      const map = {};
      for (const m of movies) {
        const gs = m.genres && m.genres.length > 0 ? m.genres : ['Uncategorised'];
        for (const g of gs) {
          if (!map[g]) map[g] = [];
          if (!map[g].find(x => x.id === m.id)) map[g].push(m);
        }
      }
      for (const g of Object.keys(map)) {
        map[g].sort((a,b) => (b.rating||0) - (a.rating||0));
      }
      const keys = Object.keys(map);
      const rest = keys.filter(g => g !== 'Uncategorised').sort((a,b) => map[b].length - map[a].length);
      const unc  = keys.includes('Uncategorised') ? ['Uncategorised'] : [];
      return { genreMap: map, sortedGenres: [...rest, ...unc] };
    }, [JSON.stringify(movies.map(m => m.id + (m.genres||[]).join() + m.rating))]);

    // Release year grouping — all movies grouped by releaseYear, newest first
    const { releaseYearMap, sortedReleaseYears } = React.useMemo(() => {
      const map = {};
      for (const m of movies) {
        const ry = m.releaseYear ? String(m.releaseYear) : 'Unknown';
        if (!map[ry]) map[ry] = [];
        map[ry].push(m);
      }
      for (const ry of Object.keys(map)) {
        map[ry].sort((a,b) => (b.rating||0) - (a.rating||0));
      }
      const known = Object.keys(map).filter(k=>k!=='Unknown').sort((a,b)=>b-a);
      const unknown = map['Unknown'] ? ['Unknown'] : [];
      return { releaseYearMap: map, sortedReleaseYears: [...known, ...unknown] };
    }, [JSON.stringify(movies.map(m=>m.id+(m.releaseYear||'')+m.rating))]);

    const [collapsedReleaseYears, setCollapsedReleaseYears] = React.useState({});
    const toggleReleaseYear = ry => setCollapsedReleaseYears(c=>({...c,[ry]:!c[ry]}));

    // Studio grouping — all movies grouped by studio, most films first
    const { studioMap, sortedStudios } = React.useMemo(() => {
      const map = {};
      for (const m of movies) {
        const s = m.studio && m.studio.trim() ? m.studio.trim() : 'Unknown';
        if (!map[s]) map[s] = [];
        map[s].push(m);
      }
      for (const s of Object.keys(map)) {
        map[s].sort((a,b) => (b.rating||0) - (a.rating||0));
      }
      const known = Object.keys(map).filter(k=>k!=='Unknown').sort((a,b)=>map[b].length-map[a].length);
      const unknown = map['Unknown'] ? ['Unknown'] : [];
      return { studioMap: map, sortedStudios: [...known, ...unknown] };
    }, [JSON.stringify(movies.map(m=>m.id+(m.studio||'')+m.rating))]);

    const [collapsedStudios, setCollapsedStudios] = React.useState({});
    const toggleStudio = s => setCollapsedStudios(c=>({...c,[s]:!c[s]}));

    // Unrated films — all movies with no rating, sorted newest year first then title
    const [collapsedGenres, setCollapsedGenres] = React.useState({});
    const toggleGenre = g => setCollapsedGenres(c => ({ ...c, [g]: !c[g] }));
    const [unratedSort, setUnratedSort] = React.useState('year');
    const [pickedMovie, setPickedMovie] = React.useState(null);

    function pickRandom(pool) {
      if (!pool.length) return;
      const m = pool[Math.floor(Math.random() * pool.length)];
      setPickedMovie(m);
      setModal({ movie: m });
    }
    const unratedMovies = React.useMemo(() => {
      const unr = movies.filter(m => m.rating == null);
      if (unratedSort === 'year') {
        return [...unr].sort((a,b) => {
          const ay = a.watchDate ? parseInt(a.watchDate) : (a.trackYear||0);
          const by = b.watchDate ? parseInt(b.watchDate) : (b.trackYear||0);
          return by - ay || a.title.localeCompare(b.title);
        });
      }
      if (unratedSort === 'runtime_asc') {
        return [...unr].sort((a,b) => (parseInt(a.runtime)||0) - (parseInt(b.runtime)||0));
      }
      if (unratedSort === 'runtime_desc') {
        return [...unr].sort((a,b) => (parseInt(b.runtime)||0) - (parseInt(a.runtime)||0));
      }
      return [...unr].sort((a,b) => a.title.localeCompare(b.title));
    }, [JSON.stringify(movies.map(m => m.id + m.rating + m.runtime)), unratedSort]);

    function saveMovie(m) {
      const exists = movies.find(x=>x.id===m.id);
      // When adding to all-time, assign next rank
      let final = {...m};
      if (m.isAllTime && !exists?.isAllTime) { final.allTimeRank = allTimeMovies.length + 1; }
      if (!m.isAllTime) { final.allTimeRank = null; }
      onUpdate(d => ({ ...d, movies: exists ? (d.movies||[]).map(x=>x.id===m.id?final:x) : [...(d.movies||[]), final] }));
      setModal(null);
    }
    function deleteMovie(id) { onUpdate(d=>({...d, movies:d.movies.filter(m=>m.id!==id)})); setModal(null); }

    function applyEnrichPatches(patches) {
      onUpdate(d => ({
        ...d,
        movies: (d.movies||[]).map(m => patches[m.id] ? {...m, ...patches[m.id]} : m)
      }));
    }

    const enrichCount = movies.filter(m => !m.country || !m.language || !m.runtime || !m.director || !m.releaseYear || !m.studio || m.watchAtRelease).length;

    // Year rankings DnD
    function onRankDragStart(e,id) { setDragId(id); e.dataTransfer.effectAllowed='move'; }
    function onRankDragOver(e,id) { e.preventDefault(); setDragOver(id); }
    function onRankDrop(e, targetId) {
      e.preventDefault();
      if (!dragId||dragId===targetId) { setDragId(null); setDragOver(null); return; }
      const ranked = yearMovies.filter(m=>m.yearRank!=null).sort((a,b)=>a.yearRank-b.yearRank);
      const dragIdx = ranked.findIndex(m=>m.id===dragId);
      const targIdx = ranked.findIndex(m=>m.id===targetId);
      if (dragIdx<0) {
        // From unranked list
        if (ranked.length>=10) { setDragId(null); setDragOver(null); return; }
        const newRanked=[...ranked]; newRanked.splice(targIdx,0,movies.find(m=>m.id===dragId));
        const reranked = newRanked.slice(0,10).map((m,i)=>({...m,yearRank:i+1}));
        onUpdate(d=>({...d, movies:d.movies.map(m=>{const r=reranked.find(x=>x.id===m.id); return r||{...m,yearRank:null};})}));
      } else {
        const newRanked=[...ranked]; const [item]=newRanked.splice(dragIdx,1); newRanked.splice(targIdx,0,item);
        const reranked=newRanked.map((m,i)=>({...m,yearRank:i+1}));
        onUpdate(d=>({...d, movies:d.movies.map(m=>{const r=reranked.find(x=>x.id===m.id); return r||m;})}));
      }
      setDragId(null); setDragOver(null);
    }
    function addToRankings(id) {
      const ranked=yearMovies.filter(m=>m.yearRank!=null);
      if (ranked.length>=10) return;
      onUpdate(d=>({...d, movies:d.movies.map(m=>m.id===id?{...m,yearRank:ranked.length+1}:m)}));
    }
    function removeFromRankings(id) {
      onUpdate(d => {
        const updated = d.movies.map(m=>m.id===id?{...m,yearRank:null}:m);
        const compact = updated.filter(m=>{const wy=m.watchDate?parseInt(m.watchDate):m.trackYear; return wy===year&&m.yearRank!=null;}).sort((a,b)=>a.yearRank-b.yearRank).map((m,i)=>({...m,yearRank:i+1}));
        return {...d, movies:updated.map(m=>{const c=compact.find(x=>x.id===m.id); return c||m;})};
      });
    }
    // All-time DnD
    function onAtDragStart(e,id) { setDragId(id); e.dataTransfer.effectAllowed='move'; }
    function onAtDragOver(e,id) { e.preventDefault(); setDragOver(id); }
    function onAtDrop(e, targetId) {
      e.preventDefault();
      if (!dragId||dragId===targetId) { setDragId(null); setDragOver(null); return; }
      const sorted=[...allTimeMovies];
      const di=sorted.findIndex(m=>m.id===dragId); const ti=sorted.findIndex(m=>m.id===targetId);
      if (di<0||ti<0) { setDragId(null); setDragOver(null); return; }
      const [item]=sorted.splice(di,1); sorted.splice(ti,0,item);
      const reranked=sorted.map((m,i)=>({...m,allTimeRank:i+1}));
      onUpdate(d=>({...d, movies:d.movies.map(m=>{const r=reranked.find(x=>x.id===m.id); return r||m;})}));
      setDragId(null); setDragOver(null);
    }
    // Directors derived from all-time movies
    const directors = React.useMemo(() => {
      const map={};
      allTimeMovies.forEach(m=>{ if(!m.director) return; if(!map[m.director]) map[m.director]=[]; map[m.director].push(m); });
      return Object.entries(map).sort((a,b)=>b[1].length-a[1].length);
    }, [JSON.stringify(allTimeMovies.map(m=>m.id+m.director))]);

    // Stats
    const rated = yearMovies.filter(m=>m.rating!=null);
    const avgRating = rated.length ? (rated.reduce((s,m)=>s+(m.rating||0),0)/rated.length).toFixed(1) : null;
    const ranked = yearMovies.filter(m=>m.yearRank!=null).sort((a,b)=>a.yearRank-b.yearRank);
    const hmMovies = yearMovies.filter(m=>m.yearRank==null && m.honourableMention);
    const unranked = yearMovies.filter(m=>m.yearRank==null && !m.honourableMention);

    function toggleHM(id) {
      onUpdate(d=>({...d, movies:d.movies.map(m=>m.id===id?{...m,honourableMention:!m.honourableMention}:m)}));
    }

    function computeStats(movs) {
      const count = movs.length;
      const ratedM = movs.filter(m=>m.rating!=null);
      const avg = ratedM.length ? (ratedM.reduce((s,m)=>s+m.rating,0)/ratedM.length).toFixed(1) : null;
      const totalMins = movs.reduce((s,m)=>s+(parseInt(m.runtime)||0),0);
      const hours = totalMins > 0 ? (totalMins/60).toFixed(1) : null;
      const genreCounts={};
      movs.forEach(m=>(m.genres||[]).forEach(g=>{genreCounts[g]=(genreCounts[g]||0)+1;}));
      const topGenres=Object.entries(genreCounts).sort((a,b)=>b[1]-a[1]).slice(0,4);
      const dirCounts={};
      movs.forEach(m=>{if(m.director){dirCounts[m.director]=(dirCounts[m.director]||0)+1;}});
      const topDirs=Object.entries(dirCounts).sort((a,b)=>b[1]-a[1]).filter(([,c])=>c>1).slice(0,5);
      const langCounts={};
      movs.forEach(m=>{if(m.language){const l=m.language.toUpperCase();langCounts[l]=(langCounts[l]||0)+1;}});
      const topLangs=Object.entries(langCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
      const countryCounts={};
      movs.forEach(m=>{if(m.country){countryCounts[m.country]=(countryCounts[m.country]||0)+1;}});
      const topCountries=Object.entries(countryCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
      // Rating distribution (0.5 steps)
      const ratingBuckets=[0.5,1,1.5,2,2.5,3,3.5,4,4.5,5];
      const ratingDist=ratingBuckets.map(v=>({label:String(v),value:ratedM.filter(m=>m.rating===v).length}));
      // Films by watch year
      const yearMap={};
      movs.forEach(m=>{
        const wy = m.watchDate ? parseInt(m.watchDate) : m.trackYear;
        if (wy && !isNaN(wy)) yearMap[wy]=(yearMap[wy]||0)+1;
      });
      const yearDist=Object.entries(yearMap).sort((a,b)=>a[0]-b[0]).map(([y,v])=>({label:String(y),value:v}));
      // Release decade distribution
      const decadeMap={};
      movs.forEach(m=>{
        const ry=parseInt(m.releaseYear);
        if(ry>1900){const d=`${Math.floor(ry/10)*10}s`;decadeMap[d]=(decadeMap[d]||0)+1;}
      });
      const decadeDist=Object.entries(decadeMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([label,value])=>({label:label.slice(2),value}));
      // Runtime distribution
      const rtBuckets=[{label:'<80m',fn:r=>r<80},{label:'80–100',fn:r=>r>=80&&r<100},{label:'100–120',fn:r=>r>=100&&r<120},{label:'120–150',fn:r=>r>=120&&r<150},{label:'150+',fn:r=>r>=150}];
      const runtimeDist=rtBuckets.map(b=>({label:b.label,value:movs.filter(m=>{const r=parseInt(m.runtime);return r>0&&b.fn(r);}).length}));
      // Avg rating by genre (top genres only)
      const genreRatings={};
      movs.forEach(m=>{if(m.rating!=null)(m.genres||[]).forEach(g=>{if(!genreRatings[g])genreRatings[g]={sum:0,n:0};genreRatings[g].sum+=m.rating;genreRatings[g].n++;});});
      const avgRatingByGenre=Object.entries(genreRatings).filter(([,v])=>v.n>=2).map(([g,v])=>({label:g,value:parseFloat((v.sum/v.n).toFixed(2)),n:v.n})).sort((a,b)=>b.value-a.value).slice(0,8);
      // Top countries bar
      const topCountriesBar=Object.entries(countryCounts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([label,value])=>({label,value}));
      // Countries set
      const countriesSet=new Set(movs.map(m=>m.country).filter(Boolean));
      return { count, avg, hours, totalMins, topGenres, topDirs, topLangs, topCountries, ratingDist, yearDist, decadeDist, runtimeDist, avgRatingByGenre, topCountriesBar, countriesSet, countryCounts };
    }

    const yearStats = React.useMemo(()=>computeStats(yearMovies), [JSON.stringify(yearMovies.map(m=>m.id+m.rating+m.runtime+m.language+m.country+(m.genres||[]).join()))]);
    const allStats = React.useMemo(()=>computeStats(movies), [JSON.stringify(movies.map(m=>m.id+m.rating+m.runtime+m.language+m.country+(m.genres||[]).join()))]);

    const statsContent = (
      <>
        {/* KPI Row */}
        <div className="mv-stats-kpi-row">
          <div className="mv-kpi-card">
            <div className="mv-kpi-label">Total Films</div>
            <div className="mv-kpi-value">{allStats.count}</div>
            <div className="mv-kpi-sub">{allStats.yearDist.length} year{allStats.yearDist.length!==1?'s':''} tracked</div>
          </div>
          {allStats.hours && (
            <div className="mv-kpi-card">
              <div className="mv-kpi-label">Hours Watched</div>
              <div className="mv-kpi-value">{allStats.hours}</div>
              <div className="mv-kpi-sub">{allStats.totalMins.toLocaleString()} mins total</div>
            </div>
          )}
          {allStats.avg && (
            <div className="mv-kpi-card">
              <div className="mv-kpi-label">Avg Rating</div>
              <div className="mv-kpi-value">{allStats.avg} <span style={{fontSize:16}}>★</span></div>
              <div className="mv-kpi-sub">{movies.filter(m=>m.rating!=null).length} rated</div>
            </div>
          )}
          <div className="mv-kpi-card">
            <div className="mv-kpi-label">Countries</div>
            <div className="mv-kpi-value">{allStats.countriesSet.size}</div>
            <div className="mv-kpi-sub">of {TOTAL_COUNTRIES} mapped</div>
          </div>
          {allStats.topGenres.length > 0 && (
            <div className="mv-kpi-card">
              <div className="mv-kpi-label">Top Genre</div>
              <div className="mv-kpi-value" style={{fontSize:16,marginTop:4}}>{allStats.topGenres[0][0]}</div>
              <div className="mv-kpi-sub">{allStats.topGenres[0][1]} films</div>
            </div>
          )}
        </div>

        {/* World Map */}
        <div className="mv-map-card">
          <div className="mv-chart-title">Countries Watched</div>
          <WorldMapView countriesSet={allStats.countriesSet} countryCounts={allStats.countryCounts} />
          <div className="mv-map-legend">
            <div style={{display:'flex',alignItems:'center',gap:5}}>
              <div className="mv-map-leg-dot" style={{background:'var(--accent)'}}/>
              <span>Watched ({allStats.countriesSet.size})</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:5}}>
              <div className="mv-map-leg-dot" style={{background:'var(--surface)',border:'1px solid var(--border)'}}/>
              <span>Not yet ({TOTAL_COUNTRIES - allStats.countriesSet.size} remaining)</span>
            </div>
          </div>
        </div>

        {/* Country Goal Progress */}
        <div className="mv-country-goal">
          <div className="mv-chart-title">Country Goal — Watch a Film from Every Country</div>
          <div className="mv-cg-bar-wrap">
            <div className="mv-cg-bar-fill" style={{width:`${Math.min((allStats.countriesSet.size/TOTAL_COUNTRIES)*100,100).toFixed(1)}%`}}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text2)'}}>
            <span><strong style={{color:'var(--text)'}}>{allStats.countriesSet.size}</strong> countries watched</span>
            <span><strong style={{color:'var(--text)'}}>{((allStats.countriesSet.size/TOTAL_COUNTRIES)*100).toFixed(1)}%</strong> complete</span>
            <span><strong style={{color:'var(--text)'}}>{TOTAL_COUNTRIES - allStats.countriesSet.size}</strong> to go</span>
          </div>
        </div>

        {/* Row: Genres + Languages */}
        <div className="mv-charts-2col">
          {allStats.topGenres.length > 0 && (
            <div className="mv-chart-card">
              <div className="mv-chart-title">Top Genres</div>
              <HorizBar data={allStats.topGenres.slice(0,8).map(([label,value])=>({label,value}))} maxW={100}/>
            </div>
          )}
          {allStats.topLangs.length > 0 && (
            <div className="mv-chart-card">
              <div className="mv-chart-title">Languages</div>
              <HorizBar data={allStats.topLangs.map(([label,value])=>({label,value}))} color='#9070d8' maxW={60}/>
            </div>
          )}
        </div>

        {/* Films by Watch Year — line chart, full width */}
        {allStats.yearDist.length > 1 && (
          <div className="mv-chart-card" style={{marginBottom:14}}>
            <div className="mv-chart-title">Films Watched by Year</div>
            <LineChart data={allStats.yearDist}/>
          </div>
        )}

        {/* Row: Rating Dist + Runtime */}
        <div className="mv-charts-2col">
          {allStats.ratingDist.some(d=>d.value>0) && (
            <div className="mv-chart-card">
              <div className="mv-chart-title">Rating Distribution</div>
              <RatingBars data={allStats.ratingDist}/>
            </div>
          )}
          {allStats.runtimeDist.some(d=>d.value>0) && (
            <div className="mv-chart-card">
              <div className="mv-chart-title">Film Length Buckets</div>
              <VertBar data={allStats.runtimeDist} color='#4aac76'/>
            </div>
          )}
        </div>

        {/* Row: Release Decade + Avg Rating by Genre */}
        <div className="mv-charts-2col">
          {allStats.decadeDist.length > 0 && (
            <div className="mv-chart-card">
              <div className="mv-chart-title">Films by Release Decade</div>
              <VertBar data={allStats.decadeDist} color='#9070d8'/>
            </div>
          )}
          {allStats.avgRatingByGenre.length > 0 && (
            <div className="mv-chart-card">
              <div className="mv-chart-title">Avg Rating by Genre <span style={{fontSize:10,color:'var(--text3)',fontWeight:400}}>(2+ films)</span></div>
              <HorizBar data={allStats.avgRatingByGenre.map(d=>({label:`${d.label} (${d.n})`,value:d.value}))} color='#c98a10' maxW={120}/>
            </div>
          )}
        </div>

        {/* Top Countries bar */}
        {allStats.topCountriesBar.length > 0 && (
          <div className="mv-chart-card" style={{marginBottom:14}}>
            <div className="mv-chart-title">Top Production Countries</div>
            <HorizBar data={allStats.topCountriesBar} color='#5b96e8' maxW={160}/>
          </div>
        )}

        {/* Directors Bar */}
        {allStats.topDirs.length > 0 && (
          <div className="mv-chart-card" style={{marginBottom:14}}>
            <div className="mv-chart-title">Recurring Directors <span style={{fontSize:10,color:'var(--text3)',fontWeight:400}}>(2+ films)</span></div>
            <HorizBar data={allStats.topDirs.map(([label,value])=>({label,value}))} color='#c98a10' maxW={180}/>
          </div>
        )}
      </>
    );

    function Poster({ movie, style={} }) {
      if (movie.posterPath) return <img src={TMDB_IMG+movie.posterPath} alt={movie.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block',...style}} />;
      return <div style={{width:'100%',height:'100%',background:'var(--surface2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,...style}}>🎬</div>;
    }

    const sortedYearMovies = [...yearMovies].filter(searchFilter).sort((a,b)=>{
      if (a.yearRank&&b.yearRank) return a.yearRank-b.yearRank;
      if (a.yearRank) return -1; if (b.yearRank) return 1;
      return (b.rating||0)-(a.rating||0);
    });

    // Adaptive year tabs — all years with films + current year, always sorted
    const activeYears = React.useMemo(() => {
      const curY = new Date().getFullYear();
      const fromMovies = movies.map(m => m.watchDate ? parseInt(m.watchDate) : m.trackYear).filter(Boolean);
      const all = [...new Set([...fromMovies, curY])].sort((a,b)=>a-b);
      return all;
    }, [JSON.stringify(movies.map(m=>m.watchDate||m.trackYear))]);

    const libraryMode = !(isAllTime || isStats || isGenres || isReleaseYear || isStudio || isUnrated);
    const sidebarTitle = isAllMovies ? 'All Films' : isAllTime ? 'All Time' : isStats ? 'Stats' : isGenres ? 'Genres' : isReleaseYear ? 'By Release' : isStudio ? 'Studios' : isUnrated ? 'Unrated' : isUndated ? 'Undated' : String(year);

    return (
      <div className="mv-wrap">
        {/* ── SIDEBAR ── */}
        <div className="subnav">
          <div className="subnav-tabs" role="tablist">
            <button role="tab" className={`subnav-tab ${libraryMode?'active':''}`} onClick={()=>{setYear('all');setSearch('');}}><Icon name="film" size={16} />Library<span className="subnav-count">{movies.length}</span></button>
            <button role="tab" className={`subnav-tab ${isAllTime?'active':''}`} onClick={()=>setYear('alltime')}><Icon name="star" size={16} />All Time</button>
            <button role="tab" className={`subnav-tab ${isStats?'active':''}`} onClick={()=>setYear('stats')}><Icon name="chart" size={16} />Stats</button>
            <button role="tab" className={`subnav-tab ${isGenres?'active':''}`} onClick={()=>setYear('genres')}><Icon name="tag" size={16} />Genres</button>
            <button role="tab" className={`subnav-tab ${isReleaseYear?'active':''}`} onClick={()=>setYear('releaseyear')}><Icon name="calendar" size={16} />By release</button>
            <button role="tab" className={`subnav-tab ${isStudio?'active':''}`} onClick={()=>setYear('studio')}><Icon name="layers" size={16} />Studios</button>
            {unratedMovies.length > 0 && (
              <button role="tab" className={`subnav-tab ${isUnrated?'active':''}`} onClick={()=>setYear('unrated')}><Icon name="alert" size={16} />Unrated<span className="subnav-count">{unratedMovies.length}</span></button>
            )}
            <span className="subnav-spacer" />
            <input className="mv-sb-search subnav-search" placeholder="Search films" value={search} onChange={e=>setSearch(e.target.value)} />
          </div>
          {libraryMode && (
            <div className="subnav-years">
              <span className="subnav-years-lbl">Watched in</span>
              <button className={`subnav-chip ${isAllMovies?'active':''}`} onClick={()=>{setYear('all');setSearch('');}}>All</button>
              {[...activeYears].reverse().map(y=>(
                <button key={y} className={`subnav-chip ${year===y&&!isAllMovies?'active':''}`} onClick={()=>{setYear(y);setSubView('films');}}>{y}<span className="subnav-count">{yearCounts[y]||0}</span></button>
              ))}
              {undatedMovies.length > 0 && (
                <button className={`subnav-chip ${isUndated?'active':''}`} onClick={()=>{setYear('undated');setSubView('films');}}>Undated<span className="subnav-count">{undatedMovies.length}</span></button>
              )}
            </div>
          )}
        </div>

        {/* ── MAIN ── */}
        <div className="mv-main">
        {/* TOPBAR */}
        <div className="mv-topbar">
          <div className="mv-topbar-title">{sidebarTitle}</div>
          {!isSpecial && !isUndated && (
            <div className="mv-view-toggle">
              <button className={`mv-vtab ${subView==='films'?'active':''}`} onClick={()=>setSubView('films')}>Films</button>
              <button className={`mv-vtab ${subView==='rankings'?'active':''}`} onClick={()=>setSubView('rankings')}>Rankings</button>
            </div>
          )}
          {(!isSpecial || isAllMovies) && subView==='films' && (
            <div className="mv-view-toggle">
              <button className={`mv-vtab ${gridMode==='grid'?'active':''}`} onClick={()=>setGridMode('grid')}>⊞</button>
              <button className={`mv-vtab ${gridMode==='list'?'active':''}`} onClick={()=>setGridMode('list')}>☰</button>
            </div>
          )}
          {!isSpecial && !isUndated && subView==='films' && yearMovies.length > 0 && (
            <button
              className={`mv-vtab${groupByRelease?' active':''}`}
              onClick={()=>setGroupByRelease(g=>!g)}
              title="Group by release year"
              style={{fontSize:13}}
            ><Icon name="calendar" size={15} /> By era</button>
          )}
          <div className="mv-actions">
            {isUnrated && unratedMovies.length > 0 && (
              <button onClick={()=>pickRandom(unratedMovies)}
                className="mv-add-btn">
                <Icon name="dice" size={16} /> Pick one
              </button>
            )}
            {movies.length > 0 && (
              <button className={`mv-enrich-btn${enrichCount>0?' has-gap':''}`} onClick={()=>setEnrichModal(true)} title="Auto-fill missing metadata from TMDB">
                {enrichCount > 0 ? <><Icon name="bolt" size={14} /> Enrich {enrichCount}</> : <><Icon name="check" size={14} /> All enriched</>}
              </button>
            )}
            <button className="ghost-btn" onClick={()=>setDupesModal(true)} title="Find duplicate films"><Icon name="alert" size={15} /> Dupes</button>
            <button className="ghost-btn" onClick={()=>setBulkAddModal(true)}>+ Bulk Add</button>
            <button className="mv-add-btn" onClick={()=>setModal('add')}>+ Add Film</button>
          </div>
        </div>

        {/* KPI STRIP */}
        {!isSpecial && yearMovies.length > 0 && (
          <div className="mv-kpi-strip">
            <div className="mv-kpi-card">
              <div className="mv-kpi-label">Films Watched</div>
              <div className="mv-kpi-value">{yearStats.count}</div>
              <div className="mv-kpi-sub">{ranked.length} ranked · {hmMovies.length} HM</div>
            </div>
            {yearStats.hours && (
              <div className="mv-kpi-card">
                <div className="mv-kpi-label">Hours Watched</div>
                <div className="mv-kpi-value">{yearStats.hours}</div>
                <div className="mv-kpi-sub">{yearStats.totalMins} total minutes</div>
              </div>
            )}
            {yearStats.avg && (
              <div className="mv-kpi-card">
                <div className="mv-kpi-label">Avg Rating</div>
                <div className="mv-kpi-value">{yearStats.avg} <span style={{fontSize:16}}>★</span></div>
                <div className="mv-kpi-sub">{rated.length} of {yearStats.count} rated</div>
              </div>
            )}
            {yearStats.topGenres.length > 0 && (
              <div className="mv-kpi-card">
                <div className="mv-kpi-label">Top Genres</div>
                <div className="mv-kpi-sub" style={{marginTop:4}}>
                  {yearStats.topGenres.map(([g,c])=><div key={g}><span>{g}</span> — {c} film{c!==1?'s':''}</div>)}
                </div>
              </div>
            )}
            {yearStats.topDirs.length > 0 && (
              <div className="mv-kpi-card">
                <div className="mv-kpi-label">Directors (2+)</div>
                <div className="mv-kpi-sub" style={{marginTop:4}}>
                  {yearStats.topDirs.map(([d,c])=><div key={d}><span>{d}</span> × {c}</div>)}
                </div>
              </div>
            )}
            {yearStats.topLangs.length > 0 && (
              <div className="mv-kpi-card">
                <div className="mv-kpi-label">Languages</div>
                <div className="mv-kpi-sub" style={{marginTop:4}}>
                  {yearStats.topLangs.map(([l,c])=><div key={l}><span>{l}</span> — {c} film{c!==1?'s':''}</div>)}
                </div>
              </div>
            )}
            {yearStats.topCountries.length > 0 && (
              <div className="mv-kpi-card">
                <div className="mv-kpi-label">Countries</div>
                <div className="mv-kpi-sub" style={{marginTop:4}}>
                  {yearStats.topCountries.map(([c,n])=><div key={c}><span>{c}</span> — {n} film{n!==1?'s':''}</div>)}
                </div>
              </div>
            )}
          </div>
        )}

        <div className="mv-content">

          {/* ── ALL FILMS VIEW ── */}
          {isAllMovies && (
            movies.length === 0 ? (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="film" size={40} /></div>
                <div className="mv-empty-ttl">No films yet</div>
                <div className="mv-empty-sub">Add your first film to get started.</div>
              </div>
            ) : (
              (() => {
                const allFiltered = movies.filter(searchFilter).sort((a,b)=>(b.rating||0)-(a.rating||0));
                return allFiltered.length === 0 ? (
                  <div className="mv-empty">
                    <div className="mv-empty-icon"><Icon name="search" size={40} /></div>
                    <div className="mv-empty-ttl">No results</div>
                    <div className="mv-empty-sub">Try a different search term.</div>
                  </div>
                ) : gridMode === 'list' ? (
                  <div className="mv-list">
                    {allFiltered.map(movie => (
                      <div key={movie.id} className="mv-list-row" onClick={()=>setModal({movie})}>
                        <div className="mv-list-poster"><Poster movie={movie}/></div>
                        <div className="mv-list-info">
                          <div className="mv-list-title">{movie.title}</div>
                          <div className="mv-list-meta">{[movie.director, movie.releaseYear, movie.runtime?`${movie.runtime}m`:null].filter(Boolean).join(' · ')}</div>
                        </div>
                        {movie.rating
                          ? <StarRating value={movie.rating} readOnly size={13}/>
                          : <span className="mv-no-rating" style={{fontSize:11}}>Unrated</span>}
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="mv-grid">
                    {allFiltered.map(movie => (
                      <div key={movie.id} className="mv-card" onClick={()=>setModal({movie})}>
                        <div className="mv-poster">
                          {movie.posterPath
                            ? <img src={TMDB_IMG+movie.posterPath} alt={movie.title}/>
                            : <div className="mv-poster-fb"><Icon name="film" size={26} /></div>}
                          {movie.isAllTime && <div className="mv-at-badge" title="All-time favourite"><Icon name="star" size={15} fill /></div>}
                        </div>
                        <div className="mv-card-body">
                          <div className="mv-card-title" title={movie.title}>{movie.title}</div>
                          <div className="mv-card-sub">{[movie.director, movie.releaseYear].filter(Boolean).join(' · ')}</div>
                          {movie.rating
                            ? <div className="mv-card-rating"><StarRating value={movie.rating} readOnly size={11}/><span style={{fontSize:10,color:'var(--text2)'}}>{movie.rating}</span></div>
                            : <div className="mv-no-rating">Unrated</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })()
            )
          )}

          {/* ── STATS VIEW ── */}
          {isStats && (
            movies.length===0 ? (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="chart" size={40} /></div>
                <div className="mv-empty-ttl">No data yet</div>
                <div className="mv-empty-sub">Add films across years to see your lifetime stats.</div>
              </div>
            ) : (
              <div className="mv-stats-section">
                {statsContent}
              </div>
            )
          )}

          {/* ── GENRES VIEW ── */}
          {isGenres && (
            movies.length === 0 ? (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="tag" size={40} /></div>
                <div className="mv-empty-ttl">No films yet</div>
                <div className="mv-empty-sub">Add films to browse by genre.</div>
              </div>
            ) : (
              <div className="mv-genre-view">
                {sortedGenres.map(genre => (
                  <div key={genre} className="mv-genre-section">
                    <div className="mv-genre-hdr" style={{ cursor:'pointer' }} onClick={() => toggleGenre(genre)}>
                      <span className="mv-genre-name">{genre}</span>
                      <span className="mv-genre-count">{genreMap[genre].length} film{genreMap[genre].length!==1?'s':''}</span>
                      <span style={{ marginLeft:'auto', fontSize:12, color:'var(--text3)' }}>{collapsedGenres[genre] ? '▶' : '▼'}</span>
                    </div>
                    {!collapsedGenres[genre] && <div className="mv-grid">
                      {genreMap[genre].map(movie => (
                        <div key={movie.id} className="mv-card" onClick={() => setModal({ movie })}>
                          <div className="mv-poster">
                            {movie.posterPath
                              ? <img src={TMDB_IMG + movie.posterPath} alt={movie.title} />
                              : <div className="mv-poster-fb"><Icon name="film" size={26} /></div>}
                            {movie.isAllTime && <div className="mv-at-badge" title="All-time favourite"><Icon name="star" size={15} fill /></div>}
                          </div>
                          <div className="mv-card-body">
                            <div className="mv-card-title" title={movie.title}>{movie.title}</div>
                            <div className="mv-card-sub">{[movie.director, movie.releaseYear].filter(Boolean).join(' · ')}</div>
                            {movie.rating
                              ? <div className="mv-card-rating"><StarRating value={movie.rating} readOnly size={11}/><span style={{fontSize:10,color:'var(--text2)'}}>{movie.rating}</span></div>
                              : <div className="mv-no-rating">Unrated</div>}
                          </div>
                        </div>
                      ))}
                    </div>}
                  </div>
                ))}
              </div>
            )
          )}

          {/* ── RELEASE YEAR VIEW ── */}
          {isReleaseYear && (
            movies.length === 0 ? (
              <div className="mv-empty">
                <div className="mv-empty-icon"><Icon name="calendar" size={40} /></div>
                <div className="mv-empty-ttl">No films yet</div>
                <div className="mv-empty-sub">Add films to browse by release year.</div>
              </div>
            ) : (
              <div className="mv-genre-view">
                {sortedReleaseYears.map(ry => {
                  const group = releaseYearMap[ry];
                  const collapsed = collapsedReleaseYears[ry];
                  const avgRating = group.filter(m=>m.rating).length
                    ? (group.filter(m=>m.rating).reduce((s,m)=>s+m.rating,0)/group.filter(m=>m.rating).length).toFixed(1)
                    : null;
                  return (
                    <div key={ry} className="mv-genre-section">
                      <div className="mv-genre-hdr" style={{cursor:'pointer'}} onClick={()=>toggleReleaseYear(ry)}>
                        <span className="mv-genre-name">{ry}</span>
                        <span className="mv-genre-count">{group.length} film{group.length!==1?'s':''}</span>
                        {avgRating && <span style={{fontSize:12,color:'var(--text3)',marginLeft:8}}>avg ★{avgRating}</span>}
                        <span style={{marginLeft:'auto',fontSize:12,color:'var(--text3)'}}>{collapsed?'▶':'▼'}</span>
                      </div>
                      {!collapsed && (
                        <div className="mv-grid">
                          {group.map(movie => (
                            <div key={movie.id} className="mv-card" onClick={()=>setModal({movie})}>
                              <div className="mv-poster">
                                {movie.posterPath
                                  ? <img src={TMDB_IMG+movie.posterPath} alt={movie.title}/>
                                  : <div className="mv-poster-fb"><Icon name="film" size={26} /></div>}
